tt des bus dure plus d’un an.\n- **28 août 1963** : **Martin Luther King** prononce le discours « I have a dream » devant 250 000 personnes à Washington. Prix Nobel de la paix en 1964.\n- **1964** : le **Civil Rights Act** interdit la ségrégation ; **1965** : le Voting Rights Act protège le droit de vote.","en":"Rosa Parks refused to give up her seat. Martin Luther King: I have a dream. The Civil Rights Act of 1964."},{"id":"cu35","t":"fiche","s":"cu","l":"3","tags":["suffragettes","axe 5"],"h":"Axe 5 : les suffragettes et le droit de vote","b":"- **Emmeline Pankhurst** fonde en **1903** au Royaume-Uni un mouvement pour le vote des femmes. Devise : « **Deeds, not words** » (des actes, pas des mots).\n- **1918** : certaines femmes de plus de 30 ans obtiennent le droit de vote ; **1928** : égalité avec les hommes, dès 21 ans.\n- Aux **États-Unis** : le **19e amendement** donne le droit de vote aux femmes en **1920**.\n- Aujourd’hui : **Malala Yousafzai**, militante pour l’éducation des filles, prix Nobel de la paix en 2014, à 17 ans.","en":"Emmeline Pankhurst. Votes for women! Deeds, not words."},{"id":"cu36","t":"fiche","s":"cu","l":"3","tags":["travail","axe 2"],"h":"Axe 2 : travailler hier","b":"- La **révolution industrielle** démarre en Grande-Bretagne au milieu du 18e siècle : **machine à vapeur** (perfectionnée par James Watt), usines textiles, mines de charbon.\n- Des enfants travaillent 12 heures par jour dans les usines et les mines. Le **Factory Act** de 1833 commence à limiter ce travail.\n- **Charles Dickens** dénonce cette misère dans **Oliver Twist** (1838).","en":"The Industrial Revolution. Steam engines. Factories. Child labour."},{"id":"cu37","t":"fiche","s":"cu","l":"3","tags":["travail","axe 2"],"h":"Axe 2 : travailler aujourd’hui et demain","b":"- **Silicon Valley** (Californie) : berceau des géants du numérique.\n- **Remote work** : le télétravail s’est développé depuis 2020.\n- **L’intelligence artificielle** transforme de nombreux métiers : lesquels disparaîtront, lesquels apparaîtront ?\n- **The gig economy** : des petits boulots payés à la tâche via des applis (livraison, VTC), avec peu de protection.","en":"Remote work. Artificial intelligence. Silicon Valley."},{"id":"cu38","t":"fiche","s":"cu","l":"3","tags":["rêve américain","axe 3"],"h":"Axe 3 : sur la route du rêve américain","b":"- **The American Dream** : l’idée que chacun peut réussir par son travail, quel que soit son point de départ.\n- **Route 66** (1926) : la « Mother Road » relie Chicago à Santa Monica (Californie), environ 3 900 km.\n- Années 1930 : sécheresse et tempêtes de poussière (**Dust Bowl**). Des milliers de familles fuient vers la Californie par la Route 66, ce que raconte **John Steinbeck** dans **The Grapes of Wrath** (1939).","en":"Route 66. The Dust Bowl. The Grapes of Wrath. The American Dream."},{"id":"cu39","t":"fiche","s":"cu","l":"3","tags":["médias","axe 4"],"h":"Axe 4 : langages et médias","b":"- Le **1er amendement** de la Constitution américaine (1791) protège la **liberté d’expression** et la **liberté de la presse**.\n- La **BBC** a une mission d’impartialité ; aux États-Unis, beaucoup de chaînes sont ouvertement engagées.\n- **Fake news** : vérifie qui publie, quand, et croise avec d’autres sources fiables (agences comme Reuters ou AP).","en":"The First Amendment protects freedom of speech. Check your sources."},{"id":"cu310","t":"fiche","s":"cu","l":"3","tags":["rencontre","axe 1"],"h":"Axe 1 : à la rencontre de l’autre","b":"- Les **peuples amérindiens** (Native Americans) vivaient sur le continent bien avant l’arrivée des Européens ; leurs langues ont laissé de nombreux noms : **Massachusetts**, **Mississippi**, Ohio, Chicago.\n- Les **échanges scolaires** et les **correspondants** (pen pals) permettent de découvrir une autre culture de l’intérieur.\n- Découvrir l’autre, c’est aussi questionner ses **stéréotypes**.","en":"Native Americans. Exchange programmes. Pen pals."},{"id":"cu311","t":"quiz","s":"cu","l":"3","tags":["États-Unis"],"h":"Quiz","b":"","q":"La capitale des États-Unis est…","o":["Washington, D.C.","New York","Los Angeles","Chicago"],"a":0,"e":"New York est la plus grande ville, pas la capitale.","en":"Washington, D.C."},{"id":"cu312","t":"quiz","s":"cu","l":"3","tags":["États-Unis"],"h":"Quiz","b":"","q":"Les 13 bandes du drapeau américain représentent…","o":["les 13 colonies d’origine","les 13 présidents fondateurs","les 13 plus grands États","les 13 amendements"],"a":0,"e":"Les 50 étoiles représentent les États actuels."},{"id":"cu313","t":"quiz","s":"cu","l":"3","tags":["institutions"],"h":"Quiz","b":"","q":"Le Sénat américain compte…","o":["100 sénateurs, 2 par État","50 sénateurs, 1 par État","435 sénateurs","9 sénateurs"],"a":0,"e":"435, c’est la Chambre des représentants ; 9, la Cour suprême."},{"id":"cu314","t":"quiz","s":"cu","l":"3","tags":["institutions"],"h":"Quiz","b":"","q":"Un président américain peut faire au maximum…","o":["deux mandats de 4 ans","un mandat de 7 ans","trois mandats de 5 ans","autant de mandats qu’il veut"],"a":0,"e":"Limite fixée par le 22e amendement."},{"id":"cu315","t":"quiz","s":"cu","l":"3","tags":["migrations"],"h":"Quiz","b":"","q":"Par Ellis Island sont passés environ…","o":["12 millions d’immigrants","12 000 immigrants","1 milliard d’immigrants","120 immigrants"],"a":0,"e":"Entre 1892 et 1954."},{"id":"cu316","t":"quiz","s":"cu","l":"3","tags":["droits civiques"],"h":"Quiz","b":"","q":"En 1955, Rosa Parks est arrêtée parce qu’elle…","o":["refuse de céder sa place dans un bus","organise une marche à Washington","veut voter","écrit un livre"],"a":0,"e":"Le début du boycott des bus de Montgomery."},{"id":"cu317","t":"quiz","s":"cu","l":"3","tags":["droits civiques"],"h":"Quiz","b":"","q":"Le discours « I have a dream » date de…","o":["1963","1776","1929","2008"],"a":0,"e":"Le 28 août 1963, lors de la marche sur Washington."},{"id":"cu318","t":"quiz","s":"cu","l":"3","tags":["suffragettes"],"h":"Quiz","b":"","q":"La devise des suffragettes britanniques :","o":["Deeds, not words","Yes, we can","Keep calm and carry on","God save the King"],"a":0,"e":"Des actes, pas des mots."},{"id":"cu319","t":"quiz","s":"cu","l":"3","tags":["travail"],"h":"Quiz","b":"","q":"La révolution industrielle commence…","o":["en Grande-Bretagne, au 18e siècle","aux États-Unis, en 1950","en Irlande, au Moyen Âge","au Canada, en 1920"],"a":0,"e":"Machine à vapeur, usines, charbon."},{"id":"cu320","t":"quiz","s":"cu","l":"3","tags":["médias"],"h":"Quiz","b":"","q":"Le 1er amendement américain protège…","o":["la liberté d’expression et de la presse","le droit de vote des femmes","la fin de l’esclavage","l’élection du président"],"a":0,"e":"Adopté en 1791."},{"id":"co31","t":"methode","s":"co","l":"3","tags":["compréhension","document long"],"h":"Comprendre un document long et authentique","b":"1. **Avant** : source, date, titre, image → type de document et hypothèses.\n2. **Découpe** : repère les parties (changements de voix, de sujet, de lieu, de temps).\n3. **Par partie** : qui, quoi, où, quand, pourquoi, puis les détails.\n4. **Repère les articulations** : however, because, so, although, finally.\n5. **Le point de vue** : l’auteur est-il neutre, enthousiaste, critique, ironique ?\n> Un mot inconnu ? Ne bloque pas : le contexte, la famille du mot ou sa ressemblance avec le français t’aident souvent."},{"id":"co32","t":"methode","s":"co","l":"3","tags":["compte rendu"],"h":"Rédiger un compte rendu en français","b":"1. **Présente** le document : nature, source, thème général.\n2. **Organise** par idées, pas dans l’ordre où tu as entendu : qui, quoi, où, quand, pourquoi.\n3. **Précise** : chiffres, noms, dates, opinions et sentiments.\n4. **Termine** par le message ou le point de vue du document.\n> Ce qui rapporte des points : la précision, et le lien entre les informations."},{"id":"co33","t":"quiz","s":"co","l":"3","tags":["compréhension","implicite"],"h":"Quiz","b":"","q":"Pour repérer le point de vue de l’auteur, tu observes surtout…","o":["les adjectifs, les adverbes d’opinion et le ton","le nombre de mots du texte","la police d’écriture","la date de publication seulement"],"a":0,"e":"Amazing, unfortunately, so-called, l’ironie : c’est là que se cache l’opinion."},{"id":"ex31","t":"methode","s":"ex","l":"3","tags":["argumenter"],"h":"Argumenter : la structure qui convainc","b":"1. **Introduction** : présente le sujet et ta position. Nowadays, many people think that…\n2. **Arguments pour** : **Firstly**, … **Moreover** / **What’s more**, … **For example**, …\n3. **Nuance ou contre-argument** : **On the other hand**, … **However**, …\n4. **Conclusion** : **To conclude**, / **All in all**, I believe that…\n> Un argument = une idée + une explication + un exemple précis.","en":"Firstly, … Moreover, … On the other hand, … To conclude, I believe that …"},{"id":"ex32","t":"fiche","s":"ex","l":"3","tags":["débat"],"h":"Débattre : accord et désaccord nuancés","b":"- Accord : I totally agree. / That’s a good point. / Exactly!\n- Nuance : **I see your point, but**… / It depends. / To some extent…\n- Désaccord poli : **I’m not sure about that.** / I don’t think so. / I strongly disagree.\n- Prendre la parole : Can I say something? / If I may…\n> On critique les idées, jamais les personnes.","en":"I totally agree. I see your point, but… I'm not sure about that. I strongly disagree."},{"id":"ex33","t":"methode","s":"ex","l":"3","tags":["lettre formelle"],"h":"Écrire une lettre ou un e-mail formel","b":"- **Dear Sir or Madam,** (destinataire inconnu) / **Dear Mr Smith,**\n- Objet : **I am writing to** apply for / complain about / ask for…\n- Corps : phrases complètes, pas de contractions (I am, I would).\n- **I look forward to hearing from you.**\n- **Yours faithfully,** (si Dear Sir or Madam) / **Yours sincerely,** (si tu connais le nom)","en":"Dear Sir or Madam, I am writing to apply for… I look forward to hearing from you. Yours faithfully,"},{"id":"ex34","t":"methode","s":"ex","l":"3","tags":["médiation"],"h":"La médiation : expliquer un document à quelqu’un","b":"Tu sers de **pont** entre un document et une personne qui ne l’a pas lu (ou qui ne parle pas la langue).\n1. Annonce : **This document is about**…\n2. Sélectionne l’**essentiel** pour ton interlocuteur : il ne veut pas tout, il veut ce qui lui sert.\n3. Reformule simplement : **In other words**, … **What the author means is**…\n4. Vérifie : **Is that clear?** **Do you have any questions?**","en":"This document is about… In other words… What the author means is…"},{"id":"ex35","t":"methode","s":"ex","l":"3","tags":["oral du brevet","langue vivante"],"h":"L’oral du brevet : une partie en anglais ?","b":"Tu peux présenter **une partie** de ton oral dans une langue vivante étudiée au collège.\n- Choisis une partie que tu maîtrises : l’**introduction**, ou la présentation d’une œuvre, d’un lieu.\n- Prépare des **mots-clés en anglais**, pas un texte rédigé.\n- Annonce le passage : « Now I’m going to present this part in English. »\n- Entraîne-toi à répondre à une question simple en anglais.\n> Renseigne-toi auprès de ton collège sur les modalités exactes."},{"id":"ex36","t":"quiz","s":"ex","l":"3","tags":["lettre formelle"],"h":"Quiz","b":"","q":"Une lettre qui commence par « Dear Sir or Madam » se termine par…","o":["Yours faithfully,","Love,","See you!","Yours sincerely, Bob xx"],"a":0,"e":"Destinataire inconnu → Yours faithfully."},{"id":"ex37","t":"quiz","s":"ex","l":"3","tags":["argumenter"],"h":"Quiz","b":"","q":"Pour ajouter un argument, tu dis…","o":["Moreover,","However,","To conclude,","Although"],"a":0,"e":"However introduit une opposition ; to conclude, la fin."},{"id":"ex38","t":"quiz","s":"ex","l":"3","tags":["débat"],"h":"Quiz","b":"","q":"La façon la plus polie de ne pas être d’accord :","o":["I see your point, but I’m not sure about that.","You’re stupid.","No. Wrong.","Shut up, I’m right."],"a":0,"e":"Reconnaître l’argument de l’autre avant de nuancer.","en":"I see your point, but I'm not sure about that."},{"id":"gr637","t":"fiche","s":"gr","l":"6","tags":["réponses courtes"],"h":"Les réponses courtes : Yes, I am / No, I don’t","b":"En anglais, on ne répond pas juste « yes » : on reprend l’**auxiliaire** de la question.\n- Are you French? — Yes, I **am**. / No, I**’m not**.\n- Is he your brother? — No, he **isn’t**.\n- Can you swim? — Yes, I **can**.\n- Do you like cats? — No, I **don’t**.\n> Pas de contraction dans une réponse courte positive : Yes, I am (jamais « Yes, I’m »).","en":"Are you French? Yes, I am. Is he your brother? No, he isn't. Can you swim? Yes, I can. Do you like cats? No, I don't."},{"id":"gr638","t":"fiche","s":"gr","l":"6","tags":["démonstratifs"],"h":"THIS, THAT, THESE, THOSE","b":"- **this** (ce… -ci, proche) → **these** au pluriel\n- **that** (ce… -là, loin) → **those** au pluriel\n> **This** pen is mine. **Those** boys over there are my friends.\nPour présenter quelqu’un : **This is** my sister, Emma.","en":"This is my pen. These are my books. That is my house over there. Those are my friends."},{"id":"gr639","t":"fiche","s":"gr","l":"6","tags":["prépositions de lieu"],"h":"Les prépositions de lieu","b":"- **in** (dans), **on** (sur), **under** (sous)\n- **next to** (à côté de), **between** (entre)\n- **in front of** (devant), **behind** (derrière)\n- **above** (au-dessus de), **opposite** (en face de)\n> Where’s the cat? — It’s **under** the bed!","en":"The cat is on the table. The ball is under the bed. The bank is next to the school. The car is in front of the house. The garden is behind the house."},{"id":"gr640","t":"fiche","s":"gr","l":"6","tags":["nombres"],"h":"Compter jusqu’à 100","b":"- 1 à 12 : one, two, three, four, five, six, seven, eight, nine, ten, **eleven**, **twelve**\n- 13 à 19 : **-teen** → thirteen, fourteen, fifteen…\n- dizaines : **-ty** → twenty, thirty, **forty** (sans u !), fifty…\n- 21 : twenty-**one** (avec un tiret) ; 100 : **a hundred**\n> four mais **forty**, five mais **fifteen** et **fifty**.","en":"One, two, three. Thirteen, thirty. Fourteen, forty. A hundred."},{"id":"gr641","t":"fiche","s":"gr","l":"6","tags":["can","permission"],"h":"CAN pour demander la permission ou un service","b":"- Permission : **Can I** open the window, please?\n- Service : **Can you** help me, please?\n- Réponses : Yes, of course! / Sure! / Sorry, you can’t.\n> Ajoute toujours **please** : en anglais, c’est indispensable.","en":"Can I open the window, please? Can you help me? Yes, of course. Sorry, you can't."},{"id":"gr642","t":"fiche","s":"gr","l":"6","tags":["souhait"],"h":"I WANT / I’D LIKE : exprimer un souhait","b":"- **I want** = je veux (direct, parfois un peu brusque)\n- **I’d like** (= I would like) = je voudrais (poli) → I’d like a burger, please.\n- **I’d like to** + verbe → I’d like **to go** to Scotland.\n- Proposer : **Would you like** some tea? — Yes, please. / No, thank you.","en":"I'd like a beef burger, please. I want a ticket. Would you like some tea?"},{"id":"gr643","t":"fiche","s":"gr","l":"6","tags":["questions avec do"],"h":"Mot interrogatif + DO / DOES","b":"Au présent simple, la question avec un mot interrogatif suit l’ordre :\n> **Mot interrogatif + do / does + sujet + verbe**\n- What **do** you eat for breakfast?\n- Where **does** she live?\n- When **do** they go to bed?\n> Avec be, pas de do : Where **is** he? How old **are** you?","en":"What do you eat for breakfast? Where does she live? When do you go to bed?"},{"id":"gr644","t":"fiche","s":"gr","l":"6","tags":["degré"],"h":"VERY, TOO, QUITE : dire « à quel point »","b":"- **very** = très → It’s **very** cold.\n- **too** = trop → It’s **too** hot. I can’t sleep.\n- **quite** = assez → It’s **quite** good.\n- **very much** à la fin = beaucoup → I like it **very much**.\n> Too = « trop », pas « très » : too expensive = trop cher.","en":"It's very cold. It's too hot. I like it very much. It's quite good."},{"id":"gr645","t":"fiche","s":"gr","l":"6","tags":["hypothèses"],"h":"Faire des hypothèses : maybe, perhaps, probably","b":"- **Maybe** / **Perhaps** (peut-être), en début de phrase : Maybe the gift is a penguin.\n- **probably** (probablement), après be : It’s **probably** a dragon.\n- **certainly** (certainement)\n- **I think** (that)… : I think it’s a castle.\n> Pratique pour décrire une image ou deviner la suite d’une histoire.","en":"Maybe the gift is a penguin. Perhaps he is sad. It's probably a dragon. I think it's a castle."},{"id":"gr646","t":"fiche","s":"gr","l":"6","tags":["adverbes"],"h":"L’adverbe en -LY : dire comment","b":"Adjectif + **-ly** = adverbe de manière :\n- quick → quick**ly**, slow → slow**ly**, beautiful → beautiful**ly**\n- happy → happ**ily** (y → ily)\n- Irrégulier : good → **well** ; fast → **fast**\nPour commenter : **Luckily**, it’s sunny. **Unfortunately**, it’s raining.","en":"She sings beautifully. He runs quickly. Luckily, it's sunny. Unfortunately, it's raining."},{"id":"gr647","t":"fiche","s":"gr","l":"6","tags":["formation des mots"],"h":"Fabriquer des mots avec des suffixes","b":"- nom + **-y** = adjectif : cloud → cloud**y**, sun → sun**ny**, sport → sport**y**\n- verbe + **-er** / **-or** = la personne : sing → sing**er**, act → act**or**, paint → paint**er**\n- **-ian** = la personne : magic → magic**ian**, music → music**ian**\n> Connaître les suffixes, c’est deviner le sens de mots jamais vus.","en":"Cloud, cloudy. Sun, sunny. Sing, singer. Magic, magician. Music, musician. Act, actor."},{"id":"gr648","t":"fiche","s":"gr","l":"6","tags":["noms composés"],"h":"Les noms composés : on lit à l’envers !","b":"Le mot important est **le dernier**. Le premier le précise :\n- a **bed**room = une chambre (room) pour dormir (bed)\n- a **snow**man = un bonhomme de neige\n- a **birthday** cake = un gâteau d’anniversaire\n- a **lunch** box = une boîte à repas\n> Lis de droite à gauche : a school bag = un sac d’école.","en":"A snowman. A bedroom. A policeman. A football. A lunch box. A birthday cake."},{"id":"gr649","t":"fiche","s":"gr","l":"6","tags":["let's"],"h":"LET’S : proposer de faire quelque chose ensemble","b":"**Let’s** + base verbale = « allons-y », « faisons… »\n> **Let’s** go! **Let’s** play a game!\nRéponses : Good idea! / OK! / Yes, let’s!\nNégation : **Let’s not** fight.","en":"Let's go! Let's play a game! Let's not fight."},{"id":"gr650","t":"fiche","s":"gr","l":"6","tags":["like","would like"],"h":"I LIKE ou I’D LIKE ?","b":"- **I like** chocolate = j’aime le chocolat (en général, toujours)\n- **I’d like** some chocolate = je voudrais du chocolat (maintenant)\n> Do you like tea? (en général) ≠ Would you like some tea? (je t’en propose)","en":"I like chocolate. I'd like some chocolate, please."},{"id":"vo618","t":"fiche","s":"vo","l":"6","tags":["couleurs"],"h":"Les couleurs","b":"red, blue, green, yellow, orange, **purple** (violet), pink, black, white, **grey** (UK) / gray (US), **brown** (marron)\n- **light** blue (bleu clair), **dark** blue (bleu foncé)\n- What colour is it? — It’s green.\n> La couleur se place avant le nom : a **red** dragon.","en":"Red, blue, green, yellow, orange, purple, pink, black, white, grey, brown.","p":[["🟥","red","rouge"],["🟦","blue","bleu"],["🟩","green","vert"],["🟨","yellow","jaune"],["🟧","orange","orange"],["🟪","purple","violet"],["🟫","brown","marron"],["⬛","black","noir"],["⬜","white","blanc"],["🌸","pink","rose"]]},{"id":"vo619","t":"fiche","s":"vo","l":"6","tags":["jours","mois"],"h":"Jours, mois, saisons","b":"- **Jours** : Monday, Tuesday, **Wednesday**, **Thursday**, Friday, Saturday, Sunday\n- **Mois** : January, February, March, April, May, June, July, August, September, October, November, December\n- **Saisons** : spring, summer, autumn, winter\n> Toujours une **majuscule** aux jours et aux mois, jamais aux saisons.","en":"Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday. January, February, March, April, May, June, July, August, September, October, November, December.","p":[["🌷","spring","printemps"],["☀️","summer","été"],["🍂","autumn","automne"],["❄️","winter","hiver"],["📅","Monday","lundi"],["🎄","December","décembre"],["🎂","birthday","anniversaire"],["🗓️","calendar","calendrier"]]},{"id":"vo620","t":"fiche","s":"vo","l":"6","tags":["corps"],"h":"Le corps humain","b":"- head, hair, **face**, eyes, ears, nose, mouth, **teeth** (dents)\n- neck, shoulders, arms, hands, fingers\n- body, **stomach** (ventre), legs, knees, **feet** (pieds), toes\n> I’ve got a headache = j’ai mal à la tête. My leg hurts = j’ai mal à la jambe.","en":"My head, my eyes, my ears, my mouth. My arms, my hands, my fingers. My legs, my feet.","p":[["🧠","head","tête"],["👁️","eye","œil"],["👂","ear","oreille"],["👃","nose","nez"],["👄","mouth","bouche"],["🦷","tooth","dent"],["💪","arm","bras"],["✋","hand","main"],["🦵","leg","jambe"],["🦶","foot","pied"]]},{"id":"vo621","t":"fiche","s":"vo","l":"6","tags":["métiers"],"h":"Les métiers","b":"a teacher, a doctor, a nurse, a **vet**, a pilot, a driver, a farmer, a **cook**, a baker, a police officer, an engineer, an actor / actress, a writer\n- What does your mum do? — She’s **a** nurse.\n> En anglais, on met **a / an** devant le métier : He’s **an** engineer.","en":"My mother is a doctor. My father is a teacher. I want to be a pilot.","p":[["🧑‍🏫","teacher","professeur"],["🧑‍⚕️","doctor","médecin"],["🧑‍🍳","cook","cuisinier"],["🧑‍🌾","farmer","agriculteur"],["👮","police officer","policier"],["🧑‍✈️","pilot","pilote"],["🧑‍🚒","firefighter","pompier"],["🧑‍🔧","mechanic","mécanicien"],["🧑‍🎨","artist","artiste"],["🧑‍💻","engineer","ingénieur"]]},{"id":"vo622","t":"fiche","s":"vo","l":"6","tags":["nationalités"],"h":"Pays et nationalités","b":"- France → **French** ; England → **English** ; Britain → **British**\n- Scotland → **Scottish** ; Wales → **Welsh** ; Ireland → **Irish**\n- the USA → **American** ; Canada → **Canadian** ; Australia → **Australian**\n- India → **Indian** ; Kenya → **Kenyan** ; New Zealand → **New Zealander**\n> Majuscule obligatoire aux nationalités : I’m **F**rench.","en":"I'm French. She's British. He's American. They're Irish. We're Scottish."},{"id":"vo623","t":"fiche","s":"vo","l":"6","tags":["météo"],"h":"La météo de base","b":"- What’s the weather like? — It’s **sunny / cloudy / windy / rainy / snowy**.\n- It’s **hot / cold**.\n- En ce moment : It’s **raining**. It’s **snowing**.\n> Les Britanniques adorent parler de la météo : « Lovely weather today, isn’t it? »","en":"What's the weather like today? It's sunny. It's raining. It's cold. It's windy.","p":[["☀️","sunny","ensoleillé"],["☁️","cloudy","nuageux"],["🌧️","rainy","pluvieux"],["❄️","snowy","neigeux"],["💨","windy","venteux"],["🌫️","foggy","brumeux"],["🔥","hot","chaud"],["🥶","cold","froid"]]},{"id":"vo624","t":"fiche","s":"vo","l":"6","tags":["jeux"],"h":"Jouer en anglais","b":"- a **board game** (jeu de plateau), **cards**, **dice** (dés), a **pawn** (pion)\n- It’s **my turn** / **your turn**. Roll the dice!\n- I **win**! You **lose**. It’s a draw.\n- **the rules** (les règles), **fair play**, Don’t **cheat**!","en":"It's your turn. Roll the dice. I win! You lose. Don't cheat!","p":[["🎲","dice","dés"],["🃏","cards","cartes"],["♟️","pawn","pion"],["🏆","win","gagner"],["😞","lose","perdre"],["🔄","your turn","ton tour"],["📜","the rules","les règles"],["🙅","cheat","tricher"]]},{"id":"vo625","t":"fiche","s":"vo","l":"6","tags":["contes"],"h":"Contes et légendes : les mots magiques","b":"- **Once upon a time**, there was… (Il était une fois…)\n- a **witch** (sorcière), a **wizard** (sorcier), a **fairy** (fée), a **giant**, a **dragon**, a **ghost**\n- a **haunted castle** (château hanté), a **spell** (un sort), **magic**\n- …and they lived **happily ever after**. (…et ils vécurent heureux)","en":"Once upon a time, there was a witch in a haunted castle. A wizard. A dragon. They lived happily ever after.","p":[["🧙","wizard","sorcier"],["🧹","witch","sorcière"],["🧚","fairy","fée"],["🐉","dragon","dragon"],["👻","ghost","fantôme"],["🏰","castle","château"],["🪄","magic wand","baguette magique"],["👑","king","roi"],["👹","ogre","ogre"]]},{"id":"vo626","t":"fiche","s":"vo","l":"6","tags":["paysages"],"h":"Les paysages","b":"- a **mountain**, a **hill** (colline), a **valley**, a **cliff** (falaise)\n- a **forest**, a **field** (champ), a **desert**\n- a **river**, a **lake**, the **sea**, the **ocean**, a **beach**, an **island** (s muet !)\n- **landscape** (paysage), **coast** (côte)","en":"Mountains, hills, a forest, a lake, a river, an island, the sea, the ocean, a beach, a desert.","p":[["⛰️","mountain","montagne"],["🏞️","lake","lac"],["🌊","sea","mer"],["🏖️","beach","plage"],["🏝️","island","île"],["🌲","forest","forêt"],["🏜️","desert","désert"],["🌾","field","champ"],["🌋","volcano","volcan"]]},{"id":"vo627","t":"fiche","s":"vo","l":"6","tags":["argent"],"h":"Faire des achats : l’argent britannique","b":"- La monnaie du Royaume-Uni : la **livre sterling** (£, the pound). 1 pound = **100 pence** (p).\n- **How much is it?** — It’s **£5** (five pounds).\n- How much **are** they? — They’re 50p (fifty pence).\n- **Here you are.** Thank you!\n> Aux États-Unis : le **dollar** ($), 100 **cents**.","en":"How much is it? It's five pounds. It costs fifty pence. Here you are.","p":[["💷","pound","livre"],["🪙","coin","pièce"],["💵","note","billet"],["💳","card","carte bancaire"],["🛒","trolley","chariot"],["🧾","receipt","ticket de caisse"],["🏷️","price","prix"],["🛍️","shopping bag","sac de courses"]]},{"id":"vo628","t":"fiche","s":"vo","l":"6","tags":["opinion","adjectifs"],"h":"Les adjectifs pour donner ton avis","b":"- Positifs : **beautiful**, **funny** (drôle), **cool**, **great**, **amazing**, **interesting**\n- Négatifs : **boring** (ennuyeux), **strange** (bizarre), **scary** (qui fait peur), **disgusting** (dégoûtant)\n> This painting is very **strange**. I think it’s **amazing**!","en":"It's beautiful. It's funny. It's strange. It's boring. It's amazing! It's disgusting.","p":[["😍","beautiful","beau"],["😂","funny","drôle"],["🤔","strange","bizarre"],["😴","boring","ennuyeux"],["😱","scary","qui fait peur"],["🤩","amazing","incroyable"],["🤢","disgusting","dégoûtant"],["👍","great","génial"]]},{"id":"vo629","t":"fiche","s":"vo","l":"6","tags":["besoins"],"h":"Exprimer un besoin","b":"- I’m **cold** / **hot** / **tired** / **hungry** / **thirsty**\n- I’m **not well** (je ne me sens pas bien), I’m **ill** (je suis malade)\n- I **need** a pen. / I **need** help.\n- He **needs** help!","en":"I'm cold. I'm hungry. I'm tired. I need help. I'm not well.","p":[["🥶","I’m cold","j’ai froid"],["🥵","I’m hot","j’ai chaud"],["😋","I’m hungry","j’ai faim"],["🥤","I’m thirsty","j’ai soif"],["😪","I’m tired","je suis fatigué"],["🤒","I’m ill","je suis malade"],["🆘","I need help","j’ai besoin d’aide"]]},{"id":"ph610","t":"piege","s":"ph","l":"6","tags":["nombres"],"h":"THIRTEEN ou THIRTY ? C’est l’accent qui décide","b":"- 13 : thir**TEEN** → l’accent est à la fin\n- 30 : **THIR**ty → l’accent est au début\nMême chose pour 14 / 40, 15 / 50, 16 / 60…\n> Au téléphone ou dans une gare, ça change tout !","en":"Thirteen, thirty. Fourteen, forty. Fifteen, fifty."},{"id":"ph611","t":"fiche","s":"ph","l":"6","tags":["alphabet"],"h":"L’alphabet anglais : les lettres qui piègent","b":"- **A** se dit /eɪ/ ; **E** se dit /iː/ ; **I** se dit /aɪ/\n- **G** /dʒiː/ et **J** /dʒeɪ/ : l’inverse du français !\n- **H** /eɪtʃ/, **R** /ɑː/, **W** /ˈdʌbəljuː/ (double u), **Y** /waɪ/\n> Indispensable pour épeler ton nom : How do you spell it?","en":"A, E, I, O, U. G, J. H, R, W, Y."},{"id":"ph612","t":"fiche","s":"ph","l":"6","tags":["schwa"],"h":"Le schwa /ə/ : le son le plus fréquent de l’anglais","b":"C’est un « eu » très court et très léger, sur les syllabes **non accentuées** :\n- **a**bout /əˈbaʊt/, banan**a**\n- teach**er**, sist**er**, doct**or** /ˈdɒktə/\n> Si tu prononces toutes les syllabes à fond, tu sonnes français. Le schwa donne le rythme anglais.","en":"Banana. About. Teacher. Sister. Doctor."},{"id":"cu618","t":"fiche","s":"cu","l":"6","tags":["Australie"],"h":"L’Australie : un continent-pays","b":"- Capitale : **Canberra** ; grandes villes : Sydney, Melbourne.\n- Animaux uniques : **kangaroo**, **koala**, **wombat**, **platypus** (ornithorynque).\n- La **Grande Barrière de corail** : le plus grand récif de corail du monde, sur plus de 2 000 km.\n- Noël tombe en **été** : barbecue sur la plage !","en":"Kangaroos and koalas live in Australia. The Great Barrier Reef.","p":[["🦘","kangaroo","kangourou"],["🐨","koala","koala"],["🐊","crocodile","crocodile"],["🦈","shark","requin"],["🐠","coral reef","récif corallien"],["🏄","surfing","surf"],["🏜️","the outback","l’outback"],["🕷️","spider","araignée"]]},{"id":"cu619","t":"fiche","s":"cu","l":"6","tags":["vacances","axe 2"],"h":"Axe 2 : les vacances aux États-Unis","b":"- Les grandes vacances durent environ **dix à douze semaines**.\n- Beaucoup d’enfants partent en **summer camp** : camp de vacances avec canoë, feu de camp, chansons.\n- **Road trips** en famille, parcs nationaux, parcs d’attractions.\n- Le 4 juillet : feux d’artifice et barbecue pour la fête nationale.","en":"In summer, many American children go to summer camp."},{"id":"cu620","t":"fiche","s":"cu","l":"6","tags":["sports","axe 2"],"h":"Axe 2 : sports populaires et traditionnels","b":"- **Cricket** : sport d’été britannique, des matchs qui peuvent durer plusieurs jours.\n- **Rugby** : il serait né à l’école de Rugby, en Angleterre, au 19e siècle.\n- **Baseball** : « America’s pastime », le passe-temps national américain.\n- **Lacrosse** : jeu d’origine amérindienne, très populaire au Canada.","en":"Cricket, rugby, baseball, lacrosse."},{"id":"cu621","t":"fiche","s":"cu","l":"6","tags":["personnages","axe 1"],"h":"Axe 1 : des animaux et des héros pleins de leçons","b":"- **The Jungle Book** (Rudyard Kipling, 1894) : Mowgli, Baloo et Bagheera.\n- **Winnie-the-Pooh** (A. A. Milne, 1926) : un ourson gourmand de miel et ses amis.\n- **Diary of a Wimpy Kid** (Jeff Kinney, 2007) : le journal intime illustré d’un collégien américain.\n> Journal de bord, journal intime : l’axe 1 s’intéresse aussi à ces formes d’écriture sur soi.","en":"The Jungle Book. Winnie-the-Pooh. Diary of a Wimpy Kid."},{"id":"cu622","t":"fiche","s":"cu","l":"6","tags":["légendes","axe 4"],"h":"Axe 4 : Arthur, Merlin et Robin des Bois","b":"- **Le roi Arthur** retire l’épée du rocher et réunit les chevaliers de la **Table ronde**, avec l’aide de l’enchanteur **Merlin**.\n- **Robin Hood** vit dans la forêt de **Sherwood**, près de Nottingham : il vole les riches pour donner aux pauvres.\n> Ce sont des légendes : on ne sait pas si ces personnages ont vraiment existé.","en":"King Arthur. Merlin the wizard. The sword in the stone. Robin Hood."},{"id":"cu623","t":"fiche","s":"cu","l":"6","tags":["masques et costumes","axe 1"],"h":"Axe 1 : masques et costumes","b":"- **Halloween** : les enfants se déguisent en sorcières, fantômes ou squelettes.\n- **Notting Hill Carnival** (Londres, fin août) : un immense carnaval caribéen né dans les années 1960, avec costumes à plumes et musique steel band.\n- **Mardi Gras** à **La Nouvelle-Orléans** : masques et colliers colorés.","en":"Notting Hill Carnival. Halloween costumes."},{"id":"cu624","t":"fiche","s":"cu","l":"6","tags":["art","axe 5"],"h":"Axe 5 : Norman Rockwell, peintre de l’Amérique","b":"**Norman Rockwell** (1894-1978) a peint des scènes de la vie quotidienne américaine pleines d’humour et d’émotion, souvent pour les couvertures du magazine The Saturday Evening Post.\n- **Freedom from Want** (1943) montre une famille réunie autour de la dinde de Thanksgiving.\n> Décris-la : In the picture, there is… The family looks happy.","en":"Norman Rockwell painted American family life."},{"id":"cu625","t":"fiche","s":"cu","l":"6","tags":["comptines","axe 5"],"h":"Axe 5 : nursery rhymes et tongue twisters","b":"- Les **nursery rhymes** sont des comptines anciennes que tous les enfants anglophones connaissent : Humpty Dumpty, Twinkle Twinkle Little Star.\n- Les **tongue twisters** sont des virelangues :\n> She sells seashells by the seashore.\n> Red lorry, yellow lorry.\nExcellent pour travailler la prononciation… et rire !","en":"Twinkle, twinkle, little star. Humpty Dumpty. She sells seashells by the seashore."},{"id":"cu626","t":"fiche","s":"cu","l":"6","tags":["mers et océans","axe 3"],"h":"Axe 3 : mers et océans du monde anglophone","b":"- L’**Atlantique** sépare le Royaume-Uni et l’Irlande de l’Amérique.\n- Le **Pacifique** borde l’ouest des États-Unis, l’Australie et la Nouvelle-Zélande.\n- L’**océan Indien** baigne l’Inde, le Kenya et l’Australie.\n- La **Manche** se dit **the English Channel**. Un tunnel la traverse depuis 1994.","en":"The Atlantic Ocean. The Pacific Ocean. The Indian Ocean. The North Sea."},{"id":"co66","t":"methode","s":"co","l":"6","tags":["image"],"h":"Décrire une image","b":"1. **Quoi ?** It’s a photo / a painting / a poster.\n2. **Où ?** In the picture, **on the left**, **on the right**, **in the middle**, **at the top**, **at the bottom**.\n3. **Qui / quoi ?** There is / There are… I can see…\n4. **Ton avis :** It’s beautiful / funny / strange.","en":"In the picture, there is a girl. On the left, there is a dog. At the top, I can see the sun."},{"id":"ex68","t":"methode","s":"ex","l":"6","tags":["invitation"],"h":"Écrire une invitation","b":"- **Quoi ?** You’re invited to my **birthday party**!\n- **Quand ?** It’s **on** Saturday **at** 3 pm.\n- **Où ?** **At** my house, 12 Green Street.\n- **Demande de réponse :** Please reply / Can you come?\n> Pense aux trois infos clés : quoi, quand, où.","en":"You're invited to my birthday party! It's on Saturday at 3 pm, at my house. Please come!"},{"id":"ex69","t":"methode","s":"ex","l":"6","tags":["quotidien"],"h":"Parler de ta journée","b":"- **Le matin :** In the morning, I get up at… I have breakfast.\n- **L’école :** I go to school by bus / on foot.\n- **Le soir :** In the evening, I do my homework, I watch TV.\n- **Le week-end :** At the weekend, I…\n> Au présent simple, avec des heures et des connecteurs (first, then, after that).","en":"On weekdays, I get up at seven. I go to school by bus. In the evening, I do my homework. At the weekend, I play football."},{"id":"ex610","t":"methode","s":"ex","l":"6","tags":["parler de ses goûts"],"h":"Parler de ce que tu aimes, avec une raison","b":"1. Annonce : My favourite… is…\n2. Justifie : **because** it’s… / because I can…\n3. Compare : I love…, **but** I don’t like…\n4. Termine par une question : And you? What’s your favourite…?","en":"My favourite animal is the fox because it's clever. I love music, but I hate rap."},{"id":"gr534","t":"fiche","s":"gr","l":"5","tags":["prétérit","questions"],"h":"Les questions au passé avec un mot interrogatif","b":"> **Mot interrogatif + did + sujet + base verbale ?**\n- What **did** you **do** last weekend?\n- Where **did** you **go**?\n- How **did** you **travel** to England?\n- When **did** she **arrive**?\n> Avec was / were, pas de did : Where **were** you? How **was** the trip?","en":"What did you do last weekend? Where did you go? Who did you see? How did you travel?"},{"id":"gr535","t":"fiche","s":"gr","l":"5","tags":["prétérit","verbes irréguliers"],"h":"15 irréguliers de plus pour raconter","b":"- give → **gave** ; tell → **told** ; leave → **left**\n- feel → **felt** ; spend → **spent** ; meet → **met**\n- begin → **began** ; drink → **drank** ; sing → **sang**\n- sleep → **slept** ; send → **sent** ; lose → **lost**\n- sit → **sat** ; run → **ran** ; win → **won**\n> Astuce : -eep, -eel, -end donnent souvent -ept, -elt, -ent.","en":"I gave him a present. She told me a story. We left at six. He felt tired. They spent a lot of money."},{"id":"gr536","t":"fiche","s":"gr","l":"5","tags":["modaux","politesse"],"h":"COULD et MAY : demander poliment","b":"- **Could you** + verbe, please? = Pourriez-vous… ? (plus poli que can you)\n- **Could I** / **May I** + verbe ? = Puis-je… ?\n> **May I** come in? — Yes, of course.\nPlus la demande est polie, plus on s’éloigne de can.","en":"Could you open the door, please? May I help my neighbour? Could I have some water?"},{"id":"gr537","t":"fiche","s":"gr","l":"5","tags":["souhait"],"h":"Exprimer un souhait ou une envie","b":"- **I would like to** + BV : je voudrais\n- **I would love to** + BV : j’adorerais\n- **I can’t wait to** + BV : j’ai hâte de\n- **I hope to** + BV : j’espère\n> I can’t wait to see the Tower of London!","en":"I would love to visit London. I wish to become an actor. I'm impatient to see the castle."},{"id":"gr538","t":"fiche","s":"gr","l":"5","tags":["autorisation","interdiction"],"h":"Autorisé ou interdit ?","b":"- **be allowed to** = avoir le droit de → You **are allowed to** take photos.\n- **not allowed** = interdit → Eating is **not allowed** here.\n- **must / mustn’t**, **can / can’t** (vus en 6e)\n- Panneaux : **No** smoking. **Do not** touch.","en":"Eating is not allowed on the grass. You are allowed to take photos. You mustn't use your phone."},{"id":"gr539","t":"fiche","s":"gr","l":"5","tags":["quantité"],"h":"A LOT OF, A FEW, A LITTLE","b":"- **a lot of** + tout nom : a lot of friends, a lot of water\n- **a few** + dénombrable pluriel (quelques) : a few friends\n- **a little** + indénombrable (un peu de) : a little sugar\n- **too much** / **too many** : trop de\n> How many? → a few. How much? → a little.","en":"A lot of people. A few friends. A little sugar. Not much time. Too many cars."},{"id":"gr540","t":"fiche","s":"gr","l":"5","tags":["too","enough"],"h":"TOO et ENOUGH","b":"- **too** + adjectif = trop → It’s **too** expensive.\n- adjectif + **enough** = assez → I’m not old **enough**. (enough **après** l’adjectif)\n- **enough** + nom = assez de → We don’t have **enough** time. (enough **avant** le nom)","en":"This T-shirt is too big. I'm not old enough. We don't have enough time."},{"id":"gr541","t":"fiche","s":"gr","l":"5","tags":["intensité"],"h":"Nuancer avec des adverbes d’intensité","b":"- **so** (tellement) : It was **so** funny!\n- **really** (vraiment) : I **really** like it.\n- **quite** (assez), **a bit** (un peu)\n- **completely** (complètement), **almost** (presque)\n> Ces petits mots rendent ton anglais beaucoup plus naturel.","en":"It was so funny! I really like it. The museum was quite big. I'm completely lost. It's almost finished."},{"id":"gr542","t":"fiche","s":"gr","l":"5","tags":["exclamations"],"h":"Les exclamations : WHAT et HOW","b":"- **What a** + adjectif + nom singulier ! → **What a** beautiful castle!\n- **What** + adjectif + nom pluriel ou indénombrable ! → **What** lovely weather!\n- **How** + adjectif ! → **How** amazing!","en":"What a beautiful castle! What lovely weather! How amazing!"},{"id":"gr543","t":"fiche","s":"gr","l":"5","tags":["perception"],"h":"Les verbes de perception + adjectif","b":"- **look** (avoir l’air) : You **look** tired.\n- **smell** (sentir) : It **smells** delicious.\n- **taste** (avoir un goût) : It **tastes** sweet.\n- **sound** (sembler, à l’oreille) : That **sounds** great!\n- **feel** (au toucher) : It **feels** soft.\n> Après ces verbes : un **adjectif**, pas un adverbe.","en":"It smells delicious. It tastes sweet. You look tired. It sounds great. It feels soft."},{"id":"gr544","t":"fiche","s":"gr","l":"5","tags":["antonymes"],"h":"Les contraires pour comparer et décrire","b":"- **quiet** ≠ **noisy** ; **cheap** ≠ **expensive**\n- **urban** ≠ **rural** ; **modern** ≠ **old-fashioned**\n- **real** ≠ **virtual** ; **safe** ≠ **dangerous**\n- **lonely** ≠ **popular** ; **crowded** ≠ **empty**\n> The city is noisy, **whereas** the village is quiet.","en":"Quiet, noisy. Urban, rural. Real, virtual. Cheap, expensive. Lonely, popular."},{"id":"gr545","t":"fiche","s":"gr","l":"5","tags":["préfixes","suffixes"],"h":"Préfixes et suffixes : une famille de mots","b":"- **un-**, **in-**, **im-**, **dis-** = le contraire : **un**happy, **im**possible, **dis**like\n- **-able** = qu’on peut : recognis**able**, comfort**able**\n- **-ful** = plein de : beauti**ful** ; **-less** = sans : home**less**, use**less**\n> recognise → recognisable → **un**recognisable","en":"Happy, unhappy. Recognise, recognisable, unrecognisable. Comfort, comfortable."},{"id":"gr546","t":"fiche","s":"gr","l":"5","tags":["marqueurs de temps"],"h":"Se situer dans le temps","b":"- Passé : yesterday, **last** week / month / year, two days **ago**\n- Présent : now, today, at the moment, every day\n- Futur : tomorrow, **next** week, **in** two years (dans deux ans)\n> **in** + durée = « dans » (futur) ; durée + **ago** = « il y a » (passé).","en":"Last week. Next month. Six months ago. In two years. Every day."},{"id":"gr547","t":"fiche","s":"gr","l":"5","tags":["discours indirect"],"h":"Rapporter des paroles (au présent)","b":"- **say (that)** : He **says that** he is tired.\n- **tell** + personne : She **tells me** that…\n- question fermée : She **asks if** we are ready.\n- **wonder if** (se demander si) : The author **wonders if** the city ever sleeps.\n> Au présent, les temps ne changent pas.","en":"He says that he is tired. She asks if we are ready. The author wonders if the city ever sleeps."},{"id":"gr548","t":"fiche","s":"gr","l":"5","tags":["image","espace"],"h":"Situer dans une image ou un tableau","b":"- **in the foreground** (au premier plan), **in the background** (à l’arrière-plan)\n- **in the middle** / **in the centre**\n- **at the top** / **at the bottom**\n- **on the left** / **on the right**\n> In the foreground, there is a cart. In the background, I can see trees.","en":"In the foreground, there is a horse. In the background, I can see a house. At the top, the sky is grey."},{"id":"vo515","t":"fiche","s":"vo","l":"5","tags":["shopping"],"h":"Faire du shopping","b":"- **How much is** this jumper? — It’s £20.\n- Can I **try it on**? (l’essayer) — The **changing rooms** are over there.\n- What **size** are you? — Medium.\n- I’ll **take** it. Can I pay **by card** / **in cash**?\n- a **receipt** (ticket de caisse), a **bargain** (une bonne affaire)","en":"How much is this jumper? Can I try it on? I'll take it. Can I pay by card?","p":[["👚","jumper","pull"],["📏","size","taille"],["🪞","changing room","cabine d’essayage"],["💸","expensive","cher"],["🤑","a bargain","une bonne affaire"],["💳","pay by card","payer par carte"],["💵","in cash","en espèces"],["🧾","receipt","ticket"]]},{"id":"vo516","t":"fiche","s":"vo","l":"5","tags":["voyages","tourisme"],"h":"Le tourisme","b":"- **go sightseeing** (visiter les monuments), a **guided tour**, a **tourist attraction**\n- **book** a hotel / tickets (réserver), **stay** in a hotel / at a campsite\n- a **map**, a **guide**, **souvenirs**, a **postcard**\n- a **queue** (UK) / a **line** (US) : une file d’attente → to **queue**","en":"We went sightseeing. We bought souvenirs. The guided tour was great. We stayed in a hotel.","p":[["🗺️","map","carte"],["📸","take photos","prendre des photos"],["🏨","hotel","hôtel"],["⛺","campsite","camping"],["🎟️","ticket","billet"],["🧳","suitcase","valise"],["🗽","sightseeing","visites"],["🧍‍♂️🧍‍♀️","queue","file d’attente"]]},{"id":"vo517","t":"fiche","s":"vo","l":"5","tags":["loisirs","clubs"],"h":"Loisirs et clubs","b":"- the **drama** club (théâtre), the **chess** club, the **choir** (chorale), the **school band**\n- **be keen on** / **be fond of** + V-ing (aimer beaucoup)\n- **spend** time + V-ing : I spend my free time **drawing**.\n- **spare time** / **free time**, a **hobby**, a **pastime**","en":"I'm a member of the drama club. I'm keen on chess. I spend my free time drawing.","p":[["🎭","drama club","club de théâtre"],["♟️","chess","échecs"],["🎤","choir","chorale"],["🥁","school band","groupe de l’école"],["📷","photography","photographie"],["🏀","basketball","basket"],["🧶","knitting","tricot"],["🎮","video games","jeux vidéo"]]},{"id":"vo518","t":"fiche","s":"vo","l":"5","tags":["catastrophes","climat"],"h":"Le climat et ses extrêmes","b":"- a **storm** (tempête), a **hurricane** (ouragan), a **tornado**\n- a **flood** (inondation), a **drought** (sécheresse)\n- **humid**, **dry**, **freezing** (glacial), **boiling** (très chaud)\n- **the climate** (le climat), **seasonal** (saisonnier)","en":"A hurricane. A flood. A storm. A drought. It's humid. The weather is changing.","p":[["🌀","hurricane","ouragan"],["🌊","flood","inondation"],["🏜️","drought","sécheresse"],["🔥","wildfire","incendie"],["🥵","boiling","brûlant"],["🥶","freezing","glacial"],["🌪️","tornado","tornade"],["⛈️","storm","tempête"]]},{"id":"vo519","t":"fiche","s":"vo","l":"5","tags":["art"],"h":"Parler d’une œuvre d’art","b":"- a **painting**, a **portrait**, a **self-portrait** (autoportrait), a **landscape**\n- the **painter**, the **artist**, the **model**\n- **depict** / **represent** (représenter)\n- **bright** (vif) ≠ **dark** colours ; the **setting** (le décor)\n> This **portrait** **depicts** a young girl in a garden.","en":"It's a portrait by Gainsborough. The painter depicts a family. The colours are bright. The setting is a garden.","p":[["🖼️","painting","tableau"],["🧑‍🎨","painter","peintre"],["🖌️","brush","pinceau"],["🎨","palette","palette"],["🗿","sculpture","sculpture"],["🏛️","gallery","galerie"],["👤","portrait","portrait"],["🌄","landscape","paysage"]]},{"id":"vo520","t":"fiche","s":"vo","l":"5","tags":["sentiments"],"h":"Les sentiments nuancés","b":"- **amazed** (émerveillé), **excited**, **proud** (fier)\n- **disappointed** (déçu), **lonely** (seul, isolé), **upset** (contrarié)\n- **worried** (inquiet), **nervous**, **relieved** (soulagé)\n- **I felt** + adjectif : I felt **relieved**.","en":"I was amazed. She felt lonely. He was disappointed. I was really proud of myself.","p":[["🤩","amazed","émerveillé"],["😞","disappointed","déçu"],["😟","worried","inquiet"],["😌","relieved","soulagé"],["😬","nervous","nerveux"],["🥲","lonely","seul"],["😤","upset","contrarié"],["🥳","excited","enthousiaste"]]},{"id":"vo521","t":"fiche","s":"vo","l":"5","tags":["phrasal verbs"],"h":"Premiers phrasal verbs","b":"- **get on** / **get off** (monter / descendre d’un bus, d’un train)\n- **go out** (sortir), **come back** (revenir)\n- **sit down** (s’asseoir), **stand up** (se lever)\n- **put on** (mettre un vêtement), **take off** (enlever)\n> Le petit mot (on, off, up, down) change complètement le sens du verbe.","en":"Get on the bus. Get off the bus. Come back. Go out. Sit down. Stand up.","p":[["🚌","get on","monter"],["🚏","get off","descendre"],["🪑","sit down","s’asseoir"],["🧍","stand up","se lever"],["🧥","put on","mettre"],["👕","take off","enlever"],["🚪","go out","sortir"],["🔙","come back","revenir"]]},{"id":"vo522","t":"fiche","s":"vo","l":"5","tags":["animaux de compagnie","maison"],"h":"Les tâches à la maison","b":"- **tidy** my room (ranger), **make** my bed\n- **lay** the table / **clear** the table\n- **do the washing-up** (la vaisselle), **do the shopping**\n- **walk the dog**, **feed the cat**, **take care of** (s’occuper de)","en":"We take care of our dog. I walk the dog every day. I tidy my room. I help at home.","p":[["🧹","tidy my room","ranger ma chambre"],["🛏️","make my bed","faire mon lit"],["🍽️","lay the table","mettre la table"],["🧽","do the washing-up","faire la vaisselle"],["🛒","do the shopping","faire les courses"],["🐕","walk the dog","promener le chien"],["🗑️","take out the rubbish","sortir les poubelles"],["🧺","do the laundry","faire la lessive"]]},{"id":"ph511","t":"fiche","s":"ph","l":"5","tags":["voyelles"],"h":"/æ/ ou /ʌ/ ? CAT ou CUT ?","b":"- **/æ/** bouche grande ouverte, entre « a » et « è » : c**a**t, h**a**t, b**a**g\n- **/ʌ/** un « a » bref et sourd : c**u**t, h**u**t, b**u**s, l**o**ve, m**o**ney\n> I love my cat ≠ I love my cut. Entraîne-toi en exagérant !","en":"Cat, cut. Hat, hut. Bag, bug. Cap, cup."},{"id":"ph512","t":"fiche","s":"ph","l":"5","tags":["noms propres"],"h":"Les noms de lieux qui piègent","b":"- **Leicester** /ˈlestə/ : « lesteu »\n- **Edinburgh** /ˈedɪnbrə/ : « édinbreu »\n- **Thames** /temz/ : « temz »\n- **Greenwich** /ˈɡrenɪtʃ/ : « grénitch »\n- **Worcester** /ˈwʊstə/ : « wousteu »\n> Les Britanniques mangent les syllabes : ne lis pas tout ce qui est écrit !","en":"Leicester. Edinburgh. Thames. Greenwich. Worcester."},{"id":"ph513","t":"fiche","s":"ph","l":"5","tags":["contractions"],"h":"Les formes contractées à l’oral","b":"- I am → **I’m**, you are → **you’re**, he is → **he’s**\n- is not → **isn’t**, do not → **don’t**, cannot → **can’t**\n- will → **’ll**, would → **’d**\n> À l’oral, elles sont presque obligatoires. À l’écrit formel, on peut les éviter.","en":"I'm. You're. He's. It isn't. I don't. I can't. I'll. I'd."},{"id":"cu520","t":"fiche","s":"cu","l":"5","tags":["Écosse","axe 6"],"h":"Axe 6 : l’Écosse","b":"- Capitale : **Edinburgh** ; plus grande ville : **Glasgow**.\n- Symboles : le **kilt** en **tartan**, la **cornemuse** (bagpipes), le chardon (thistle), la licorne.\n- **Burns Night** (25 janvier) : on fête le poète **Robert Burns** en mangeant du **haggis**.\n- Les **Highland Games** : lancer de tronc d’arbre, tir à la corde, danse.\n- Le Parlement écossais siège à Édimbourg depuis 1999.","en":"Burns Night is on the 25th of January. Haggis. Kilts and bagpipes."},{"id":"cu521","t":"fiche","s":"cu","l":"5","tags":["pays de Galles","axe 6"],"h":"Axe 6 : le pays de Galles","b":"- Capitale : **Cardiff**. En gallois, le pays s’appelle **Cymru**.\n- Le **gallois** (Welsh) est langue officielle avec l’anglais : les panneaux sont bilingues.\n- Symboles : le **dragon rouge**, la **jonquille** (daffodil) et le **poireau** (leek).\n- **St David’s Day** : le 1er mars.\n- Passion nationale : le **rugby**.","en":"Wales is called Cymru in Welsh. St David's Day is on the 1st of March."},{"id":"cu522","t":"fiche","s":"cu","l":"5","tags":["Irlande du Nord","axe 6"],"h":"Axe 6 : l’Irlande du Nord","b":"- Capitale : **Belfast**. Elle fait partie du **Royaume-Uni**, mais partage l’île avec la république d’Irlande.\n- Le **Titanic** a été construit à Belfast, au chantier Harland & Wolff ; il a coulé en avril 1912 lors de son premier voyage. Un grand musée lui est consacré.\n- La **Giant’s Causeway** est sur sa côte nord.","en":"Belfast is the capital of Northern Ireland. The Titanic was built in Belfast."},{"id":"cu523","t":"fiche","s":"cu","l":"5","tags":["famille royale","axe 6"],"h":"Axe 6 : la monarchie en images","b":"- **La relève de la garde** devant Buckingham Palace : soldats en tunique rouge et bonnet en peau d’ours (bearskin).\n- **Henry VIII** (16e siècle) : six épouses, et la rupture avec l’Église de Rome.\n- **Elizabeth II** a régné **70 ans** (1952-2022), un record au Royaume-Uni.\n- Le visage du monarque figure sur les pièces, les billets et les timbres.","en":"The Changing of the Guard at Buckingham Palace. Henry the Eighth had six wives."},{"id":"cu524","t":"fiche","s":"cu","l":"5","tags":["Londres","transports","axe 2"],"h":"Axe 2 : se déplacer au Royaume-Uni","b":"- À Londres : les **bus rouges à impériale** (double-deckers), les taxis noirs (**black cabs**), le **Tube** et sa célèbre annonce « **Mind the gap!** ».\n- Au Royaume-Uni et en Irlande, on **roule à gauche**.\n- La **Oyster card** ou le paiement sans contact pour les transports londoniens.","en":"Red double-decker buses. Black cabs. Mind the gap! In the UK, people drive on the left."},{"id":"cu525","t":"fiche","s":"cu","l":"5","tags":["Sherlock Holmes","axe 3"],"h":"Axe 3 : Sherlock Holmes, entre réel et imaginaire","b":"- Créé par **Arthur Conan Doyle**, médecin écossais, en 1887.\n- Le détective vit au **221B Baker Street**, à Londres, avec le docteur **Watson**.\n- Méthode : l’**observation** et la **déduction**.\n- Aujourd’hui, un musée Sherlock Holmes existe à cette adresse… qui était fictive à l’époque !","en":"Sherlock Holmes lived at 221B Baker Street. Elementary, my dear Watson!"},{"id":"cu526","t":"fiche","s":"cu","l":"5","tags":["saisons et peinture","axe 2"],"h":"Axe 2 : les saisons en peinture","b":"- **John Constable**, **The Hay Wain** (1821) : la campagne anglaise en été, une charrette dans la rivière, un ciel nuageux.\n- **J. M. W. Turner** : la lumière, la brume, les tempêtes en mer.\n- Ces peintres sont exposés à la National Gallery et à la Tate, à Londres.\n> In the foreground, there is a cart in the river…","en":"The Hay Wain by John Constable. Turner painted light and storms."},{"id":"cu527","t":"fiche","s":"cu","l":"5","tags":["école","axe 4"],"h":"Axe 4 : des écoles pas comme les autres","b":"- **Boarding schools** : internats britanniques où les élèves vivent toute l’année scolaire. **Eton College**, fondé en 1440, est l’un des plus célèbres.\n- Aux États-Unis, à l’université : les **fraternities** et **sororities**, des associations d’étudiants aux noms en lettres grecques.\n- Les **cliques** : des groupes d’amis, souvent montrés dans les films de lycée.","en":"Boarding schools. Eton College. Fraternities and sororities. School clubs."},{"id":"cu528","t":"fiche","s":"cu","l":"5","tags":["familles présidentielles","axe 1"],"h":"Axe 1 : les familles présidentielles américaines","b":"- Le président vit avec sa famille à la **Maison-Blanche**, à Washington.\n- **Abraham Lincoln**, 16e président, pendant la guerre de Sécession (1861-1865).\n- **John F. Kennedy**, président de 1961 à 1963 : la famille Kennedy a été photographiée sans cesse.\n- La **First Lady** est l’épouse du président.","en":"The White House. Abraham Lincoln. John F. Kennedy."},{"id":"cu529","t":"fiche","s":"cu","l":"5","tags":["fêtes britanniques","axe 2"],"h":"Axe 2 : l’année en fêtes britanniques","b":"- **Pancake Day** (Shrove Tuesday) : crêpes et courses de crêpes, la veille du carême.\n- **Easter** : chocolats et chasse aux œufs.\n- **Bank Holidays** : les jours fériés.\n- **Remembrance Day** (11 novembre) : on porte un **coquelicot** rouge (poppy) en souvenir des soldats morts.","en":"Pancake Day. Easter eggs. Bonfire Night. Remembrance Day."},{"id":"cu530","t":"fiche","s":"cu","l":"5","tags":["migrations","axe 5"],"h":"Axe 5 : Londres, ville-monde","b":"Londres est l’une des villes les plus **multiculturelles** du monde : on y entend plus de 300 langues.\n- **Brick Lane** : quartier des communautés venues du Bangladesh.\n- **Chinatown**, près de Soho.\n- Le **curry** est l’un des plats préférés des Britanniques.","en":"London is a multicultural city. Over 300 languages are spoken in London."},{"id":"co54","t":"methode","s":"co","l":"5","tags":["prospectus"],"h":"Lire un document pratique (dépliant, site, affiche)","b":"Repère les informations clés :\n- **Opening times / hours** (horaires), **Closed on** (fermé le)\n- **Admission** / **Tickets** (entrée), **free** (gratuit), **adults / children**\n- **Address**, **How to get there**\n> Pas besoin de tout lire : cherche juste ce qu’on te demande (scanning).","en":"Opening times. Admission. Free for children. Closed on Mondays."},{"id":"co55","t":"methode","s":"co","l":"5","tags":["inférer"],"h":"Deviner le sens d’un mot inconnu","b":"1. Est-ce un mot **transparent** ? (museum, castle…)\n2. Sa **famille** : unrecognisable → un + recognise + able\n3. Le **contexte** : ce qui est dit avant et après\n4. Sa **nature** : nom, verbe, adjectif ? (place dans la phrase)\n> Ne t’arrête pas sur chaque mot : beaucoup ne sont pas indispensables.","en":"I don't know the word, but I can guess from the context."},{"id":"ex57","t":"methode","s":"ex","l":"5","tags":["recette","instructions"],"h":"Donner des instructions (recette, règle du jeu)","b":"- Impératif : **Mix**, **Add**, **Cut**, **Cook**, **Pour**.\n- Ordre : **First**, … **Then**, … **Next**, … **Finally**, …\n- Quantités : 200 g of flour, two eggs, a pinch of salt.\n> Pour une règle de jeu : You must… / You can’t… / The winner is…","en":"First, mix the flour and the eggs. Then, add the milk. Finally, cook for two minutes."},{"id":"ex58","t":"fiche","s":"ex","l":"5","tags":["interaction","réservation"],"h":"Acheter un billet ou réserver","b":"- **I’d like** two tickets **for**…, please.\n- **How much** is it? / Is it **free** for children?\n- **What time** does it start / finish?\n- Can I **book** a table for four, please?\n- Thank you. **Have a nice day!**","en":"I'd like two tickets for the tour, please. How much is it? What time does it start? Here you are."},{"id":"ex59","t":"methode","s":"ex","l":"5","tags":["décrire une photo"],"h":"Décrire une photo pas à pas","b":"1. **Nature** : This is a photo / a painting / a poster of…\n2. **Situer** : In the foreground… In the background…\n3. **Actions** au présent BE + -ing : A girl **is eating**.\n4. **Impressions** : She **looks** happy.\n5. **Hypothèses** : **Maybe** they are celebrating a birthday.","en":"This is a photo of a family. In the foreground, a girl is eating. She looks happy. Maybe they are celebrating."},{"id":"ex510","t":"methode","s":"ex","l":"5","tags":["portrait"],"h":"Faire le portrait de quelqu’un","b":"1. **Qui** : My best friend is called… / This is…\n2. **Physique** : He’s tall, he has short curly hair.\n3. **Caractère** : He’s generous, but a bit shy.\n4. **Une anecdote au passé** : We met two years ago…\n5. **Pourquoi tu l’apprécies** : I like him because…","en":"My best friend is called Inès. She's tall and has long dark hair. She's generous and funny. We met at school two years ago."},{"id":"gr430","t":"fiche","s":"gr","l":"4","tags":["present perfect","been","gone"],"h":"BEEN ou GONE ?","b":"- She **has been** to Dublin = elle y est allée… et elle est revenue (expérience).\n- She **has gone** to Dublin = elle est partie là-bas… et elle y est encore.\n> Have you ever **been** to Ireland? (jamais « gone » pour une expérience)","en":"She has been to Dublin. She has gone to Dublin."},{"id":"gr431","t":"fiche","s":"gr","l":"4","tags":["present perfect","superlatif"],"h":"Superlatif + present perfect + EVER","b":"> It’s **the best** film I**’ve ever seen**.\n> It’s **the most beautiful** place I**’ve ever visited**.\n= le meilleur… que j’aie jamais vu. Parfait pour une critique ou un récit de voyage.","en":"It's the best film I've ever seen. It's the most beautiful place I've ever visited."},{"id":"gr432","t":"fiche","s":"gr","l":"4","tags":["questions sujet"],"h":"Les questions sur le sujet : sans DO","b":"Quand **who** ou **what** est le **sujet**, pas d’auxiliaire do / did :\n- **Who called** you? (quelqu’un t’a appelé : qui ?)\n- **What happened**?\n- **Who won** the match?\nComparer : **Who did you call**? (tu as appelé quelqu’un : qui ?)","en":"Who called you? What happened? Who won the match?"},{"id":"gr433","t":"fiche","s":"gr","l":"4","tags":["futur","when"],"h":"WHEN + présent pour parler du futur","b":"Après **when**, **as soon as**, **before**, **after**, **until**, on met le **présent**, même pour le futur :\n> **When** I **am** eighteen, I**’ll** learn to drive.\n> As soon as I **get** home, I’ll call you.\nJamais « when I will be ».","en":"When I'm eighteen, I'll learn to drive. As soon as I get home, I'll call you."},{"id":"gr434","t":"fiche","s":"gr","l":"4","tags":["conditionnel","unless"],"h":"UNLESS : à moins que, si… ne… pas","b":"**unless** = if… not\n> **Unless** you hurry, you’ll miss the bus.\n> = **If** you **don’t** hurry, you’ll miss the bus.\nAprès unless, le verbe est **affirmatif**.","en":"Unless you hurry, you'll miss the bus. If you don't hurry, you'll miss the bus."},{"id":"gr435","t":"fiche","s":"gr","l":"4","tags":["cause","conséquence"],"h":"Exprimer la cause et la conséquence","b":"- Cause : **because** + phrase ; **because of** + nom ; **as** / **since** (comme)\n- Conséquence : **so** (donc), **that’s why** (c’est pourquoi), **as a result** (par conséquent)\n> **Because of** the rain, the match was cancelled. **That’s why** I’m sad.","en":"It was raining, so we stayed home. Because of the rain, the match was cancelled. As a result, prices went up. That's why I'm late."},{"id":"gr436","t":"fiche","s":"gr","l":"4","tags":["composés de some","any","no"],"h":"SOMEONE, ANYTHING, NOWHERE…","b":"- some- (affirmatif) : **someone / somebody**, **something**, **somewhere**\n- any- (question, négation) : **anyone**, **anything**, **anywhere**\n- no- (sens négatif, verbe affirmatif) : **no one / nobody**, **nothing**, **nowhere**\n- every- (tout) : **everyone**, **everything**, **everywhere**\n> Nobody came. (jamais « nobody didn’t come »)","en":"Someone is knocking. Is there anything to eat? Nobody came. I can't find it anywhere."},{"id":"gr437","t":"fiche","s":"gr","l":"4","tags":["both","either","neither"],"h":"BOTH, EITHER, NEITHER : parmi deux","b":"- **both** = les deux → **Both** teams played well.\n- **either** = l’un ou l’autre → You can take **either** bus.\n- **neither** = aucun des deux → **Neither** of them won.\n- **Me too** ≠ **Me neither** : moi aussi (positif) / moi non plus (négatif)","en":"Both teams played well. Neither of them won. You can take either bus."},{"id":"gr438","t":"fiche","s":"gr","l":"4","tags":["adjectifs composés"],"h":"Les adjectifs composés : jamais de -s !","b":"nombre + nom **au singulier**, avec des tirets, avant le nom :\n- a **ten-year-old** boy (un garçon de dix ans)\n- a **two-hour** film\n- a **five-star** hotel\n> Mais : the boy is ten years old (là, years prend un -s).","en":"A ten-year-old boy. A two-hour film. A five-star hotel."},{"id":"gr439","t":"fiche","s":"gr","l":"4","tags":["ordre des adjectifs"],"h":"L’ordre des adjectifs","b":"**opinion → taille → âge → forme → couleur → origine → matière → nom**\n> a **beautiful old wooden** castle\n> a **lovely little red Irish** boat\nLes anglophones le respectent sans y penser : à toi de l’apprendre.","en":"A beautiful old wooden castle. A lovely little red car."},{"id":"gr440","t":"fiche","s":"gr","l":"4","tags":["had better"],"h":"HAD BETTER : un conseil fort","b":"**’d better** + base verbale = tu ferais mieux de…\n> You**’d better** hurry, the bus is leaving!\n> You**’d better not** be late.\nPlus insistant que should, avec une idée de risque si on ne le fait pas.","en":"You'd better hurry. You'd better not be late."},{"id":"gr441","t":"fiche","s":"gr","l":"4","tags":["each other"],"h":"EACH OTHER : l’un l’autre","b":"> They looked at **each other**. (ils se sont regardés)\n> We help **each other**. (on s’entraide)\nÀ ne pas confondre avec les réfléchis : They looked at **themselves** in the mirror (chacun soi-même).","en":"They looked at each other. We help each other."},{"id":"gr442","t":"fiche","s":"gr","l":"4","tags":["indénombrables"],"h":"Les indénombrables qui piègent","b":"Ils n’ont **pas de pluriel** et pas de « a » :\n- **advice** (des conseils), **information**, **news**, **luggage**, **furniture** (meubles), **homework**, **bread**, **money**\n- Pour compter : **a piece of** advice, **a piece of** furniture\n> The news **is** good. Your advice **was** helpful.","en":"Can you give me some advice? The information is useful. A piece of furniture."},{"id":"vo412","t":"fiche","s":"vo","l":"4","tags":["numérique"],"h":"Le vocabulaire du numérique","b":"- **log in / log out**, an **account**, a **password**, a **username**\n- **download** / **upload**, an **app**, a **file**, a **link**\n- a **screen**, a **keyboard**, a **device**, **charge** my phone\n- **post**, **share**, **like**, **follow**, **comment**","en":"Log in to your account. Download the app. Type your password. Share the link.","p":[["🔑","password","mot de passe"],["📥","download","télécharger"],["📤","upload","mettre en ligne"],["🔗","link","lien"],["💻","laptop","ordinateur portable"],["⌨️","keyboard","clavier"],["🖱️","mouse","souris"],["🔋","charge","recharger"],["❤️","like","aimer"]]},{"id":"vo413","t":"fiche","s":"vo","l":"4","tags":["cinéma"],"h":"Le cinéma et les séries","b":"- the **director** (réalisateur), an **actor / actress**, the **cast** (la distribution)\n- the **plot** (l’intrigue), the **main character**, the **setting**\n- a **scene**, a **trailer** (bande-annonce), the **soundtrack**, **subtitles**\n- It’s **set in** Dublin (l’action se passe à Dublin). It’s **based on** a true story.","en":"The director. The plot. The main character. The soundtrack. It's set in Dublin.","p":[["🎬","director","réalisateur"],["🎥","camera","caméra"],["🍿","popcorn","pop-corn"],["🎞️","trailer","bande-annonce"],["⭐","star","vedette"],["🏆","award","récompense"],["📺","series","série"],["💬","subtitles","sous-titres"]]},{"id":"vo414","t":"fiche","s":"vo","l":"4","tags":["musique"],"h":"La musique","b":"- a **band**, a **singer**, a **songwriter**, a **concert**, a **gig**\n- **instruments** : the guitar, the drums, the piano, the violin / **fiddle**\n- the **lyrics** (paroles), the **tune** (mélodie), the **chorus** (refrain)\n- **catchy** (entraînant), **meaningful** (qui a du sens)","en":"I play the drums. My favourite band. The lyrics are meaningful. A catchy tune.","p":[["🎸","guitar","guitare"],["🥁","drums","batterie"],["🎻","violin","violon"],["🎹","piano","piano"],["🎺","trumpet","trompette"],["🎷","saxophone","saxophone"],["🎤","microphone","micro"],["🎶","tune","mélodie"]]},{"id":"vo415","t":"fiche","s":"vo","l":"4","tags":["environnement"],"h":"L’environnement","b":"- **climate change**, **global warming**, **pollution**, **waste** (déchets)\n- **recycle**, **reduce**, **reuse**, **save** energy\n- **renewable energy** : solar, wind\n- **endangered species** (espèces menacées), to **protect**","en":"Climate change. Pollution. Recycle. Renewable energy. Protect the planet.","p":[["♻️","recycle","recycler"],["🌍","planet","planète"],["🏭","pollution","pollution"],["🌡️","global warming","réchauffement climatique"],["☀️","solar energy","énergie solaire"],["🌬️","wind power","énergie éolienne"],["🗑️","waste","déchets"],["🐼","endangered species","espèce menacée"]]},{"id":"vo416","t":"fiche","s":"vo","l":"4","tags":["espace"],"h":"L’espace","b":"- an **astronaut**, a **rocket** (fusée), a **spaceship**, a **satellite**\n- to **launch** (lancer), to **orbit**, to **land** (atterrir), the **landing**\n- **outer space**, a **planet**, **gravity**, the **Moon** (avec majuscule)\n- a **space station**, a **mission**, the **crew**","en":"An astronaut. A rocket. To launch. To land on the Moon. Outer space.","p":[["🚀","rocket","fusée"],["🧑‍🚀","astronaut","astronaute"],["🌙","the Moon","la Lune"],["🪐","planet","planète"],["🛰️","satellite","satellite"],["⭐","star","étoile"],["☄️","comet","comète"],["🔭","telescope","télescope"]]},{"id":"vo417","t":"fiche","s":"vo","l":"4","tags":["mode"],"h":"La mode","b":"- **fashion**, a **designer** (styliste), a **catwalk** (podium), a **model**\n- **trendy** / **fashionable** ≠ **old-fashioned**\n- **second-hand** clothes (d’occasion), **fast fashion**\n- **to suit** someone (aller bien à) : That jacket suits you!","en":"It's trendy. Old-fashioned. A designer. A catwalk. Second-hand clothes.","p":[["👗","dress","robe"],["👠","high heels","talons hauts"],["👜","handbag","sac à main"],["🕶️","sunglasses","lunettes de soleil"],["🧣","scarf","écharpe"],["💍","ring","bague"],["🧵","sewing","couture"],["♻️","second-hand","d’occasion"]]},{"id":"vo418","t":"fiche","s":"vo","l":"4","tags":["mouvement"],"h":"Les prépositions de mouvement","b":"- **along** (le long de), **across** (à travers, d’un côté à l’autre)\n- **through** (à travers, à l’intérieur), **past** (devant, en passant)\n- **into** (dans, en entrant), **out of** (hors de)\n- **up** / **down**, **towards** (vers), **over** (par-dessus)","en":"We walked along the river. They swam across the lake. The train went through the tunnel.","p":[["⬆️","up","vers le haut"],["⬇️","down","vers le bas"],["↔️","across","d’un côté à l’autre"],["🚇","through","à travers"],["➡️","towards","vers"],["🚪","into","dans (en entrant)"],["🏃","out of","hors de"],["🌉","over","par-dessus"]]},{"id":"vo419","t":"fiche","s":"vo","l":"4","tags":["opinion"],"h":"Donner son avis comme un anglophone","b":"- **I reckon** (that)… (familier)\n- **As far as I’m concerned**, …\n- **It seems to me that**…\n- **I’m convinced that**… / **I doubt that**…\n- **To be honest**, … / **Personally**, …","en":"I reckon it's a good idea. As far as I'm concerned, it's unfair. It seems to me that..."},{"id":"ph48","t":"fiche","s":"ph","l":"4","tags":["liaisons"],"h":"Les enchaînements : les mots se collent","b":"À l’oral, la consonne finale s’accroche à la voyelle suivante :\n- an‿apple → « a-napple »\n- turn‿it‿off → « tur-ni-toff »\n- look‿at‿it → « loo-ka-tit »\n> Si tu ne comprends pas un mot à l’écoute, c’est souvent à cause d’un enchaînement.","en":"An apple. Turn it off. Look at it. Pick it up."},{"id":"ph49","t":"fiche","s":"ph","l":"4","tags":["voyelles"],"h":"/ɜː/ et /ʌ/","b":"- **/ɜː/** long, bouche détendue : b**ir**d, w**or**d, g**ir**l, h**er**, t**ur**n\n- **/ʌ/** court : b**u**s, l**o**ve, m**o**ney, c**ou**ntry\n> Work /wɜːk/ (travail) ≠ walk /wɔːk/ (marcher) : attention !","en":"Bird, word, girl, her, turn. Bus, love, money."},{"id":"cu422","t":"repere","s":"cu","l":"4","tags":["Irlande du Nord"],"h":"Axe 6 : l’Irlande du Nord et la paix","b":"- Depuis la partition de 1921, l’Irlande du Nord reste dans le Royaume-Uni.\n- **The Troubles** (fin des années 1960-1998) : un conflit violent entre unionistes, majoritairement protestants, attachés au Royaume-Uni, et républicains, majoritairement catholiques, favorables à l’unité de l’Irlande. Plus de 3 500 morts.\n- **1998** : l’**accord du Vendredi saint** (Good Friday Agreement) ramène la paix.","en":"The Troubles. The Good Friday Agreement, 1998."},{"id":"cu423","t":"fiche","s":"cu","l":"4","tags":["Dublin"],"h":"Axe 6 : Dublin en 5 lieux","b":"- **Trinity College** (fondé en 1592), qui abrite le **Book of Kells**, manuscrit enluminé d’environ 800.\n- **Temple Bar** : quartier animé de musique traditionnelle.\n- Le **Ha’penny Bridge** sur la rivière **Liffey**.\n- **O’Connell Street**, la grande avenue de la ville.","en":"Trinity College. The Book of Kells. Temple Bar. The Ha'penny Bridge. The River Liffey."},{"id":"cu424","t":"fiche","s":"cu","l":"4","tags":["Halloween","Irlande"],"h":"Axe 6 : Halloween est né en Irlande","b":"- Halloween vient de **Samhain**, fête celte qui marquait la fin des récoltes et le début de l’hiver : la frontière entre les vivants et les morts devenait mince.\n- En Irlande, on creusait des **navets** (turnips) pour faire des lanternes.\n- Les émigrés irlandais ont emporté la fête en Amérique, où la **citrouille** a remplacé le navet.","en":"Halloween comes from Samhain, an old Celtic festival."},{"id":"cu425","t":"fiche","s":"cu","l":"4","tags":["musique irlandaise"],"h":"Axe 6 : la musique irlandaise","b":"- Musique traditionnelle (**trad**) : le **fiddle** (violon), le **tin whistle** (flûte), le **bodhrán** (tambour), la harpe.\n- Les **sessions** : des musiciens jouent ensemble, souvent dans un pub.\n- Des groupes irlandais connus dans le monde entier : **U2**, **The Cranberries**, **The Dubliners**.","en":"Traditional Irish music. The fiddle, the tin whistle and the bodhrán."},{"id":"cu426","t":"fiche","s":"cu","l":"4","tags":["légendes irlandaises"],"h":"Axe 6 : mythes et légendes d’Irlande","b":"- **Les enfants de Lir** : une belle-mère jalouse transforme quatre enfants en **cygnes** pour 900 ans.\n- **Tír na nÓg** : la terre de l’éternelle jeunesse, où le héros Oisín part vivre avec Niamh.\n- **Le leprechaun** et la **banshee**, dont le cri annonce une mort.","en":"The Children of Lir. Tír na nÓg, the land of eternal youth."},{"id":"cu427","t":"fiche","s":"cu","l":"4","tags":["langue irlandaise"],"h":"Axe 6 : l’irlandais, une langue vivante","b":"- L’irlandais (**Gaeilge**) est une langue **celtique**, cousine du gaélique écossais et du breton.\n- On l’apprend à l’école en Irlande ; les panneaux routiers sont bilingues.\n- Le **Gaeltacht** : régions surtout à l’ouest où l’irlandais est la langue du quotidien.\n- Bonjour : **Dia duit** (« Dieu avec toi »).","en":"Dia duit! Hello in Irish. The Gaeltacht."},{"id":"cu428","t":"fiche","s":"cu","l":"4","tags":["sport","axe 1"],"h":"Axe 1 : des compétitions légendaires","b":"- **Wimbledon** (Londres, depuis 1877) : le plus ancien tournoi de tennis, sur gazon, tenue blanche obligatoire, fraises à la crème.\n- **La FA Cup** (depuis 1871) : la plus ancienne compétition de football au monde.\n- **Baseball** : la finale du championnat nord-américain s’appelle les **World Series**.","en":"Wimbledon. The FA Cup. Baseball and the World Series."},{"id":"cu429","t":"fiche","s":"cu","l":"4","tags":["Paralympiques","axe 1"],"h":"Axe 1 : les Jeux paralympiques sont nés en Angleterre","b":"- En **1948**, le médecin Ludwig Guttmann organise des jeux pour des soldats blessés en fauteuil, à l’hôpital de **Stoke Mandeville**.\n- En **1960**, à Rome, ont lieu les premiers Jeux paralympiques.\n- Le sport comme outil d’**inclusion** et de reconstruction.","en":"The Paralympic Games started at Stoke Mandeville in England."},{"id":"cu430","t":"fiche","s":"cu","l":"4","tags":["explorations","axe 2"],"h":"Axe 2 : d’autres grands explorateurs","b":"- **Lewis et Clark** (1804-1806) : traversée de l’Amérique du Nord jusqu’au Pacifique, guidés en partie par Sacagawea, une Amérindienne Shoshone.\n- **Amelia Earhart** : première femme à traverser l’Atlantique seule en avion (1932).\n- **Edmund Hillary** (Néo-Zélandais) et **Tenzing Norgay** (Sherpa népalais) : premiers au sommet de l’**Everest**, le 29 mai 1953.","en":"Lewis and Clark. Amelia Earhart. Edmund Hillary and Tenzing Norgay climbed Everest in 1953."},{"id":"cu431","t":"fiche","s":"cu","l":"4","tags":["villes","axe 3"],"h":"Axe 3 : New York, ville de quartiers","b":"- Cinq **boroughs** : **Manhattan**, **Brooklyn**, **Queens**, **the Bronx**, **Staten Island**.\n- Des quartiers à identité forte : Harlem, Chinatown, Little Italy.\n- **Central Park** : un immense parc au cœur de Manhattan.\n- Surnom : **the Big Apple**.","en":"New York has five boroughs: Manhattan, Brooklyn, Queens, the Bronx and Staten Island."},{"id":"cu432","t":"fiche","s":"cu","l":"4","tags":["villes","axe 3"],"h":"Axe 3 : vivre ensemble dans les villes anglophones","b":"- **Sydney** : son opéra aux toits en forme de voiles (inauguré en 1973).\n- Au Royaume-Uni, les quartiers ont leur **pub**, leur **high street** (rue commerçante) et leur **corner shop**.\n- Aux États-Unis, beaucoup de familles vivent en **suburbs** : maisons avec jardin, et voiture indispensable.","en":"The Sydney Opera House. Cities in Australia. Living together."},{"id":"cu433","t":"fiche","s":"cu","l":"4","tags":["innovation","axe 4"],"h":"Axe 4 : inventer, innover, créer (suite)","b":"- **Rosalind Franklin** : sa célèbre **Photo 51** (1952) a été décisive pour découvrir la structure de l’**ADN**.\n- **Mary Quant** : la styliste londonienne qui popularise la **minijupe** dans les années 1960.\n- **Steve Jobs** présente l’**iPhone** en 2007 : le smartphone change nos vies.","en":"Rosalind Franklin. Photo 51. Mary Quant and the miniskirt. Steve Jobs presented the iPhone in 2007."},{"id":"cu434","t":"fiche","s":"cu","l":"4","tags":["art","axe 5"],"h":"Axe 5 : langages artistiques (suite)","b":"- **Andy Warhol** et le **pop art** : ses boîtes de soupe Campbell (1962) font des objets de consommation des œuvres d’art.\n- **The Beatles**, groupe de **Liverpool**, ont changé la musique pop dans les années 1960.\n- **Broadway** (New York) et le **West End** (Londres) : les capitales de la comédie musicale.","en":"Andy Warhol and pop art. The Beatles came from Liverpool. Broadway musicals."},{"id":"cu435","t":"fiche","s":"cu","l":"4","tags":["art","axe 5"],"h":"Axe 5 : Shakespeare, le génie du théâtre","b":"- **William Shakespeare** (1564-1616), né à **Stratford-upon-Avon**.\n- Comédies, tragédies, pièces historiques : **Romeo and Juliet**, **Hamlet**, **Macbeth**, **A Midsummer Night’s Dream**.\n- Il a inventé ou popularisé des centaines de mots et d’expressions encore utilisés.\n> « To be or not to be » : la question d’Hamlet.","en":"Romeo and Juliet. Hamlet. To be or not to be."},{"id":"co44","t":"methode","s":"co","l":"4","tags":["dictée préparée"],"h":"Préparer une écoute comme une dictée","b":"Pour un passage difficile à entendre :\n1. Lis d’abord la transcription à trous : devine les mots manquants.\n2. Écoute en te concentrant **seulement** sur les trous.\n3. Vérifie la grammaire : le mot trouvé va-t-il dans la phrase ?\n> C’est un entraînement redoutable pour la discrimination auditive."},{"id":"ex46","t":"methode","s":"ex","l":"4","tags":["journal de bord"],"h":"Écrire un journal de bord d’explorateur","b":"- Date ou jour : **Day 3** / **15th March**\n- Ce qui s’est passé (prétérit) : We **left** the camp at dawn.\n- Le décor (prétérit BE + -ing) : The wind **was blowing**.\n- Les émotions : I **was terrified**, but…\n- Les projets : Tomorrow, we**’re going to**…","en":"Day 3. We left the camp at dawn. The ice was cracking. I was terrified, but we kept going."},{"id":"ex47","t":"methode","s":"ex","l":"4","tags":["présenter une invention"],"h":"Présenter une invention","b":"1. **Quoi ?** This is the… / It’s a device which…\n2. **Qui, quand ?** It was invented by… in…\n3. **Comment ça marche / à quoi ça sert ?** It is used to…\n4. **Pourquoi c’est important ?** It changed our lives because…\n5. **Ton avis :** In my opinion, it’s the most useful invention ever.","en":"The telephone was invented by Alexander Graham Bell in 1876. It's useful because..."},{"id":"ex48","t":"methode","s":"ex","l":"4","tags":["comparer"],"h":"Comparer deux lieux, deux sports, deux œuvres","b":"- **Points communs** : Both… / …as… as…\n- **Différences** : …than…, whereas…, while…\n- **Préférence** : I prefer… because… / I’d rather…\n- **Nuance** : much / far + comparatif","en":"Dublin is smaller than London, but it's just as lively. I prefer Dublin because it's less crowded."},{"id":"gr332","t":"fiche","s":"gr","l":"3","tags":["passif","modaux"],"h":"Le passif avec les modaux et le futur","b":"modal + **be** + participe passé :\n- Phones **must be switched** off.\n- The work **can be done** tomorrow.\n- The museum **will be opened** next year.\n- It **should be recycled**.\n> Très fréquent dans les règlements et les consignes.","en":"Phones must be switched off. The work can be done tomorrow. The museum will be opened next year."},{"id":"gr333","t":"fiche","s":"gr","l":"3","tags":["faire faire"],"h":"HAVE SOMETHING DONE : faire faire par quelqu’un","b":"**have** + objet + **participe passé**\n> I **had my hair cut**. (je me suis fait couper les cheveux… par un coiffeur)\n> She’s **having her car repaired**.\nPlus familier : **get** something done.","en":"I had my hair cut. She's having her car repaired. We got the house painted."},{"id":"gr334","t":"fiche","s":"gr","l":"3","tags":["discours indirect","verbes"],"h":"Rapporter avec le bon verbe","b":"Au lieu de répéter said, varie :\n- **promise to** + BV : He promised to help me.\n- **advise / tell / ask** + personne + **to** + BV : She advised me to rest.\n- **explain that**, **admit that**, **claim that**\n- **deny** + -ing : They denied stealing it.\n> Ordre rapporté : He **told me to** sit down. Interdiction : He told me **not to** move.","en":"He promised to help me. She advised me to rest. He explained that the road was closed. They denied stealing it."},{"id":"gr335","t":"fiche","s":"gr","l":"3","tags":["conditions"],"h":"Exprimer la condition : au-delà de IF","b":"- **as long as** / **provided that** = à condition que\n- **unless** = à moins que\n- **in case** = au cas où\n- **otherwise** = sinon → Hurry up, **otherwise** you’ll be late.","en":"You can go out as long as you're back by ten. Provided that it doesn't rain, we'll go. In case it rains, take an umbrella."},{"id":"gr336","t":"fiche","s":"gr","l":"3","tags":["regret","reproche"],"h":"SHOULD HAVE, COULD HAVE : regretter le passé","b":"modal + **have** + **participe passé**\n- **should have** = j’aurais dû → I **should have studied** harder.\n- **shouldn’t have** = tu n’aurais pas dû → You **shouldn’t have said** that.\

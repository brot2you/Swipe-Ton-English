"b":"","q":"She enjoyed ___ at the party.","o":["herself","himself","her","itself"],"a":0,"e":"She → herself.","en":"She enjoyed herself at the party."},{"id":"gr531","t":"quiz","s":"gr","l":"5","tags":["hypothèse","if"],"h":"Quiz","b":"","q":"If it ___ tomorrow, we will stay at home.","o":["rains","will rain","rain","rained"],"a":0,"e":"Après if : présent, jamais will. It → rains.","en":"If it rains tomorrow, we will stay at home."},{"id":"gr532","t":"quiz","s":"gr","l":"5","tags":["fréquence"],"h":"Quiz","b":"","q":"Quelle phrase est correcte ?","o":["He is never late.","He never is late.","He is late never.","Never he is late."],"a":0,"e":"Avec BE, l’adverbe de fréquence se place après : is never.","en":"He is never late."},{"id":"gr533","t":"quiz","s":"gr","l":"5","tags":["opinion"],"h":"Quiz","b":"","q":"« Je suis d’accord avec toi » :","o":["I agree with you.","I am agree with you.","I’m agree to you.","I agreeing you."],"a":0,"e":"Agree est un verbe : pas de be devant.","en":"I agree with you."},{"id":"vo51","t":"fiche","s":"vo","l":"5","tags":["école"],"h":"L’école et l’emploi du temps","b":"- **subjects** : maths, English, history, geography, science, **P.E.** (sport), art, music, **I.T.** (informatique)\n- **timetable** (emploi du temps), **break** (récré), **canteen**, **homework** (indénombrable !)\n- **classmate**, **teacher**, **headteacher** (principal)\n- **club** : I’m a **member of** the chess club.\n> What’s your favourite subject? — My favourite subject is history because it’s fascinating.","en":"My favourite subject is history. We have maths on Monday. At break, I play basketball. I'm a member of the chess club.","p":[["➗","maths","maths"],["🌍","geography","géographie"],["🏛️","history","histoire"],["🔬","science","sciences"],["🏃","P.E.","sport"],["🎨","art","arts plastiques"],["🎵","music","musique"],["💻","I.T.","informatique"],["💬","English","anglais"],["🔔","break","récréation"]]},{"id":"vo52","t":"fiche","s":"vo","l":"5","tags":["transports"],"h":"Les transports","b":"- **by** + transport : by bus, by car, by bike, by train, by plane\n- mais : **on foot** (à pied)\n- **the Tube** / the Underground (métro de Londres) = **subway** (US)\n- **a journey** : un trajet ; **a trip** : un voyage, une sortie ; **to travel** : voyager\n> Combien de temps ? It takes twenty minutes.","en":"I go to school by bus. I walk to school. I go on foot. We took the Tube. It's a long journey.","p":[["🚌","bus","bus"],["🚗","car","voiture"],["🚲","bike","vélo"],["🚆","train","train"],["✈️","plane","avion"],["🚇","underground","métro"],["⛴️","ferry","ferry"],["🚶","on foot","à pied"],["🚕","taxi","taxi"]]},{"id":"vo53","t":"fiche","s":"vo","l":"5","tags":["météo","saisons"],"h":"La météo et les saisons","b":"- What’s the weather like? — It’s **sunny / cloudy / windy / foggy / rainy / snowy**.\n- Maintenant : It’s **raining**. It’s **snowing**.\n- spring, summer, **autumn** (UK) = **fall** (US), winter\n- hot, warm, cool, cold ; a **storm**, a **hurricane**, a **flood**\n> Les Britanniques parlent beaucoup de la météo : c’est le sujet de conversation parfait.","en":"What's the weather like? It's sunny. It's raining. It's cloudy and windy. In autumn, the leaves fall.","p":[["⛈️","storm","orage"],["🌈","rainbow","arc-en-ciel"],["🌪️","tornado","tornade"],["☔","umbrella","parapluie"],["🌡️","temperature","température"],["🍂","autumn","automne"],["🌷","spring","printemps"],["⛄","snowman","bonhomme de neige"]]},{"id":"vo54","t":"fiche","s":"vo","l":"5","tags":["ville","directions"],"h":"La ville et les directions","b":"- Lieux : museum, library, **town hall**, station, post office, hospital, shopping centre, **city centre** (UK) = **downtown** (US)\n- **Go straight on.** Turn **left** / **right**. Take the second street on the left.\n- **next to** (à côté de), **opposite** (en face de), **between** (entre), **behind**, **in front of**\n> Excuse me, how can I get to the station?","en":"Go straight on. Turn left. The museum is next to the station, opposite the park. It's between the bank and the library.","p":[["🏛️","museum","musée"],["📚","library","bibliothèque"],["🚉","station","gare"],["🏥","hospital","hôpital"],["🏦","bank","banque"],["🏤","post office","bureau de poste"],["⬅️","turn left","tourner à gauche"],["➡️","turn right","tourner à droite"],["⬆️","go straight on","aller tout droit"]]},{"id":"vo55","t":"fiche","s":"vo","l":"5","tags":["repas","cuisine"],"h":"À table !","b":"- **lay the table** (mettre la table), **cutlery** (couverts) : knife, fork, spoon, plate, glass\n- **a dish** (un plat), **a recipe** (une recette), ingredients\n- **starter**, **main course**, dessert\n- Goûts : sweet, salty, **spicy** (épicé), **sour** (acide), **bitter** (amer), delicious, disgusting\n> Yummy! / Yuk!","en":"Can you lay the table? It's a traditional dish. It's spicy. The starter, the main course and the dessert.","p":[["🍴","fork","fourchette"],["🔪","knife","couteau"],["🥄","spoon","cuillère"],["🍽️","plate","assiette"],["🥛","glass","verre"],["🌶️","spicy","épicé"],["🍋","sour","acide"],["🍬","sweet","sucré"],["🧂","salty","salé"]]},{"id":"vo56","t":"fiche","s":"vo","l":"5","tags":["caractère"],"h":"Le caractère","b":"- **shy** (timide) ≠ **outgoing** (sociable)\n- **friendly**, kind, **generous**, **honest**, **polite** ≠ **rude** (impoli)\n- funny, clever, **lazy**, hard-working, brave, **proud** (fier)\n- **selfish** (égoïste), **clumsy** (maladroit)","en":"She is shy but very friendly. He is generous and honest. Don't be rude!","p":[["😊","friendly","sympathique"],["🙈","shy","timide"],["😎","outgoing","sociable"],["🎁","generous","généreux"],["😇","honest","honnête"],["😤","proud","fier"],["🦥","lazy","paresseux"],["🤓","clever","intelligent"]]},{"id":"vo57","t":"fiche","s":"vo","l":"5","tags":["anglais britannique et américain"],"h":"Anglais britannique ou américain ?","b":"- **flat** (UK) / **apartment** (US)\n- lift / elevator ; holiday / vacation\n- biscuit / cookie ; **crisps** (UK) / **chips** (US)\n- **chips** (UK) / **French fries** (US)\n- trousers / pants ; rubber / eraser ; mum / mom\n- football / soccer ; autumn / fall\n- Orthographe : colo**u**r / color ; centr**e** / center ; travel**l**ing / traveling","en":"flat, apartment. Lift, elevator. Holiday, vacation. Biscuits, cookies. Crisps, chips. Chips, fries.","p":[["🏢","flat / apartment","appartement"],["🛗","lift / elevator","ascenseur"],["🍪","biscuit / cookie","biscuit"],["🍟","chips / French fries","frites"],["🥔","crisps / chips","chips"],["⚽","football / soccer","football"],["🍂","autumn / fall","automne"],["👖","trousers / pants","pantalon"]]},{"id":"vo58","t":"quiz","s":"vo","l":"5","tags":["transports"],"h":"Quiz","b":"","q":"« Je vais à l’école à pied » :","o":["I go to school on foot.","I go to school by foot.","I go to school with feet.","I go to school in foot."],"a":0,"e":"By bus, by car… mais on foot.","en":"I go to school on foot."},{"id":"vo59","t":"quiz","s":"vo","l":"5","tags":["anglais britannique et américain"],"h":"Quiz","b":"","q":"Un Américain dit « chips ». Un Britannique dit…","o":["crisps","chips","fries","biscuits"],"a":0,"e":"Les chips sont des crisps au Royaume-Uni ; les frites, des chips."},{"id":"vo510","t":"quiz","s":"vo","l":"5","tags":["anglais britannique et américain"],"h":"Quiz","b":"","q":"« Fall », en anglais américain, c’est…","o":["l’automne","l’hiver","une chute de neige","les vacances"],"a":0,"e":"Autumn (UK) = fall (US)."},{"id":"vo511","t":"quiz","s":"vo","l":"5","tags":["caractère"],"h":"Quiz","b":"","q":"« Rude » veut dire…","o":["impoli","rude, difficile","rouge","timide"],"a":0,"e":"Faux ami : rude = impoli. Le contraire : polite."},{"id":"vo512","t":"quiz","s":"vo","l":"5","tags":["ville","directions"],"h":"Quiz","b":"","q":"« The bank is opposite the park » : la banque est…","o":["en face du parc","à côté du parc","derrière le parc","dans le parc"],"a":0,"e":"Opposite = en face de ; next to = à côté de."},{"id":"vo513","t":"quiz","s":"vo","l":"5","tags":["météo"],"h":"Quiz","b":"","q":"« It’s foggy » :","o":["il y a du brouillard","il y a du vent","il fait beau","il y a de l’orage"],"a":0,"e":"Fog = brouillard. Windy = venteux."},{"id":"vo514","t":"quiz","s":"vo","l":"5","tags":["école"],"h":"Quiz","b":"","q":"« P.E. » sur un emploi du temps, c’est…","o":["le sport","la physique","l’anglais","la récréation"],"a":0,"e":"Physical Education = EPS."},{"id":"ph51","t":"fiche","s":"ph","l":"5","tags":["-ed"],"h":"Le -ED : 3 prononciations","b":"- **/t/** après un son sourd (p, k, f, s, sh, ch) : stopped, watched, liked\n- **/d/** après un son voisé : played, cleaned, lived\n- **/ɪd/** après t ou d : want**ed**, visit**ed**, need**ed**\n> On n’ajoute une syllabe que dans le 3e cas. « Watched » ne se dit pas « watch-ed ».","en":"Played. Watched. Wanted. Visited. Cleaned. Stopped."},{"id":"ph52","t":"fiche","s":"ph","l":"5","tags":["voyelles"],"h":"Voyelles courtes et longues","b":"Changer la longueur, c’est changer le mot !\n- **/ɪ/** ship, live, sit ≠ **/iː/** sheep, leave, seat\n- **/ʊ/** full, good ≠ **/uː/** fool, blue\n- **/æ/** cat, hat ≠ **/ɑː/** car, heart\n> Les deux-points ː dans l’alphabet phonétique = son long.","en":"Ship, sheep. Full, fool. Cat, car. Live, leave."},{"id":"ph53","t":"fiche","s":"ph","l":"5","tags":["intonation"],"h":"L’intonation : ça monte ou ça descend ?","b":"- **↗ monte** : questions fermées (réponse oui / non) → Do you like tea↗?\n- **↘ descend** : questions ouvertes (wh-), affirmations, ordres, exclamations → Where do you live↘?\n> Une intonation trop plate donne l’air de s’ennuyer. Exagère un peu : c’est plus naturel qu’on ne croit.","en":"Do you like tea? Where do you live? What a nice day!"},{"id":"ph54","t":"fiche","s":"ph","l":"5","tags":["formes faibles"],"h":"Les formes faibles : les petits mots qui s’effacent","b":"Les mots grammaticaux non accentués se réduisent en **/ə/** :\n- **of** /əv/ : a cup of tea\n- **to** /tə/ : I want to go\n- **at** /ət/, **from** /frəm/, **and** /ən/, **can** /kən/\n> Mais **can’t** reste fort et long : I can’t /kɑːnt/ swim.","en":"A cup of tea. I want to go. Look at this. From London."},{"id":"ph55","t":"fiche","s":"ph","l":"5","tags":["the"],"h":"THE : /ðə/ ou /ði/ ?","b":"- Devant un **son consonne** : /ðə/ → the dog, the cat\n- Devant un **son voyelle** : /ði/ → the owl, the apple, the end\n> Même logique que a / an : c’est le son qui suit qui décide.","en":"The dog. The cat. The owl. The apple. The end."},{"id":"ph56","t":"quiz","s":"ph","l":"5","tags":["-ed"],"h":"Quiz","b":"","q":"Le -ed de « visited » se prononce…","o":["/ɪd/","/t/","/d/","il est muet"],"a":0,"e":"Après t ou d : /ɪd/, une syllabe en plus."},{"id":"ph57","t":"quiz","s":"ph","l":"5","tags":["-ed"],"h":"Quiz","b":"","q":"Le -ed de « watched » se prononce…","o":["/t/","/d/","/ɪd/","/ed/"],"a":0,"e":"Après le son ch (sourd) : /t/. On dit « watcht »."},{"id":"ph58","t":"quiz","s":"ph","l":"5","tags":["the"],"h":"Quiz","b":"","q":"Dans « the apple », the se prononce…","o":["/ði/","/ðə/","/tə/","/θe/"],"a":0,"e":"Devant un son voyelle : /ði/."},{"id":"ph59","t":"quiz","s":"ph","l":"5","tags":["intonation"],"h":"Quiz","b":"","q":"« Where do you live? » : l’intonation…","o":["descend à la fin","monte à la fin","reste plate","monte puis remonte"],"a":0,"e":"Question ouverte (en wh-) : l’intonation descend."},{"id":"ph510","t":"quiz","s":"ph","l":"5","tags":["voyelles"],"h":"Quiz","b":"","q":"Quel mot a un son long /iː/ ?","o":["sheep","ship","sit","live"],"a":0,"e":"Sheep /ʃiːp/. Ship /ʃɪp/ a un son court."},{"id":"cu51","t":"fiche","s":"cu","l":"5","tags":["Royaume-Uni","axe 6"],"h":"Axe 6 : l’Union Jack, un drapeau en 3 croix","b":"L’Union Flag (Union Jack) superpose :\n- la croix rouge de **saint Georges** (Angleterre),\n- la croix blanche en X de **saint André** (Écosse),\n- la croix rouge en X de **saint Patrick** (Irlande).\n> Le **pays de Galles** n’y figure pas : il a son propre drapeau, avec le dragon rouge.","en":"The Union Jack. The cross of Saint George, the cross of Saint Andrew and the cross of Saint Patrick."},{"id":"cu52","t":"fiche","s":"cu","l":"5","tags":["Royaume-Uni","institutions"],"h":"Axe 6 : le roi, le Parlement, le Premier ministre","b":"- Le Royaume-Uni est une **monarchie constitutionnelle** : le monarque règne mais ne gouverne pas. **Charles III** est roi depuis septembre 2022.\n- Le **Parlement**, à Westminster : la **House of Commons** (députés élus, les MPs) et la **House of Lords**.\n- Le **Prime Minister** dirige le gouvernement et vit au **10 Downing Street**.","en":"The King. Parliament. The House of Commons and the House of Lords. The Prime Minister lives at 10 Downing Street."},{"id":"cu53","t":"fiche","s":"cu","l":"5","tags":["Londres"],"h":"Axe 6 : Londres en 6 lieux","b":"- **Tower of London** : forteresse où sont gardés les **joyaux de la Couronne**.\n- **Big Ben** : c’est le nom de la **cloche** ; la tour s’appelle Elizabeth Tower depuis 2012.\n- **Tower Bridge** : le pont qui se lève.\n- **Buckingham Palace** : résidence officielle du monarque à Londres.\n- **The Tube** : ouvert en 1863, c’est le plus ancien métro du monde.\n- **Trafalgar Square**, avec la National Gallery et la National Portrait Gallery juste à côté.","en":"The Tower of London. Big Ben. Tower Bridge. Buckingham Palace. The Tube."},{"id":"cu54","t":"fiche","s":"cu","l":"5","tags":["BBC","National Trust"],"h":"Axe 6 : deux institutions britanniques","b":"- **La BBC** (British Broadcasting Corporation), créée en **1922** : radio et télévision publiques, financées par une redevance, la **licence fee**. Les Britanniques la surnomment « Auntie », la tata.\n- **Le National Trust**, fondé en **1895** : une association qui protège des châteaux, des jardins, des côtes et des paysages pour que tout le monde puisse les visiter.","en":"The BBC is a public broadcaster. The National Trust protects historic houses and gardens."},{"id":"cu55","t":"fiche","s":"cu","l":"5","tags":["portrait","axe 1"],"h":"Axe 1 : yearbooks et portraits","b":"- **Yearbook** : le livre de fin d’année des écoles américaines, avec photos de chaque élève, des clubs, des événements… et des « superlatives » votés par les élèves : **Most likely to succeed**, Best smile, Class clown.\n- **National Portrait Gallery** (Londres, fondée en **1856**) : l’histoire britannique racontée en portraits, des Tudors aux célébrités d’aujourd’hui.","en":"Yearbooks are a popular tradition in American schools. Most likely to succeed. The National Portrait Gallery."},{"id":"cu56","t":"fiche","s":"cu","l":"5","tags":["réel et imaginaire","axe 3"],"h":"Axe 3 : quand le réel nourrit l’imaginaire","b":"- **Roald Dahl**, né au pays de Galles en 1916 : élève à Repton, il testait les nouveaux chocolats que la marque **Cadbury** envoyait à l’école. Des années plus tard : **Charlie and the Chocolate Factory** (1964).\n- **Cadbury** a construit pour ses ouvriers un village modèle, **Bournville**, près de Birmingham, avec parcs et maisons à jardin.\n- **Mark Twain** a été pilote de bateau sur le Mississippi. Son nom de plume vient d’un cri de marinier qui annonce la profondeur de l’eau. Ses héros : **Tom Sawyer** (1876) et **Huckleberry Finn** (1884).","en":"Roald Dahl wrote Charlie and the Chocolate Factory. Mark Twain wrote The Adventures of Tom Sawyer."},{"id":"cu57","t":"fiche","s":"cu","l":"5","tags":["langues","axe 5"],"h":"Axe 5 : l’anglais, une langue qui emprunte partout","b":"- **1066** : Guillaume le Conquérant envahit l’Angleterre. Le français devient la langue des seigneurs : l’animal vivant garde son nom anglais (cow, pig, sheep), mais la viande servie à table prend un nom français : **beef** (bœuf), **pork** (porc), **mutton** (mouton).\n- De l’Inde : shampoo, bungalow, pyjamas.\n- D’Australie : **kangaroo**, d’une langue aborigène.\n- On estime que près d’un tiers du vocabulaire anglais vient du français.","en":"Beef, pork, mutton. Shampoo, bungalow, pyjamas. Kangaroo. Robot."},{"id":"cu58","t":"fiche","s":"cu","l":"5","tags":["fêtes","axe 5"],"h":"Axe 5 : trois fêtes américaines, trois histoires","b":"- **Thanksgiving** : 4e jeudi de novembre, repas de dinde en souvenir d’une récolte partagée en 1621 par les colons du Mayflower et les Wampanoag.\n- **Columbus Day** : 2e lundi d’octobre ; de plus en plus d’États fêtent ce jour-là **Indigenous Peoples’ Day**.\n- **Juneteenth** : le **19 juin** ; il rappelle le jour de 1865 où les derniers esclaves du Texas ont appris leur libération. Jour férié fédéral depuis 2021.","en":"Thanksgiving. Columbus Day. Juneteenth."},{"id":"cu59","t":"fiche","s":"cu","l":"5","tags":["quotidien","axe 2"],"h":"Axe 2 : à table au Royaume-Uni","b":"- **Full English breakfast** : œufs, bacon, saucisses, haricots à la tomate (**baked beans**), champignons, toasts.\n- **Afternoon tea** : thé, sandwichs, **scones** avec crème et confiture.\n- **Sunday roast** : rôti du dimanche avec Yorkshire pudding.\n- **Fish and chips** : poisson pané et frites, souvent à emporter.","en":"A full English breakfast. Afternoon tea with scones. A Sunday roast. Fish and chips."},{"id":"cu510","t":"fiche","s":"cu","l":"5","tags":["école","axe 4"],"h":"Axe 4 : l’école chez les anglophones","b":"- **Angleterre** : Year 7 à 11 ans ; examens des **GCSEs** à 16 ans ; ensuite **sixth form** (≈ lycée).\n- **États-Unis** : **middle school**, puis **high school** (freshman, sophomore, junior, senior) ; bal de fin d’année : le **prom**.\n- Après les cours : beaucoup de **clubs** et de sport à l’école.","en":"Year 7. GCSEs. Middle school, high school. Prom."},{"id":"cu511","t":"quiz","s":"cu","l":"5","tags":["Royaume-Uni"],"h":"Quiz","b":"","q":"Quelle nation n’est pas représentée sur l’Union Jack ?","o":["le pays de Galles","l’Écosse","l’Angleterre","l’Irlande (du Nord)"],"a":0,"e":"Le pays de Galles a son propre drapeau, avec le dragon rouge."},{"id":"cu512","t":"quiz","s":"cu","l":"5","tags":["Royaume-Uni","institutions"],"h":"Quiz","b":"","q":"Le Premier ministre britannique habite…","o":["au 10 Downing Street","à Buckingham Palace","à la Tour de Londres","à Westminster Abbey"],"a":0,"e":"Buckingham Palace est la résidence du monarque."},{"id":"cu513","t":"quiz","s":"cu","l":"5","tags":["Londres"],"h":"Quiz","b":"","q":"« Big Ben », c’est…","o":["la grande cloche de la tour","le palais du roi","le pont de Londres","le métro"],"a":0,"e":"La tour s’appelle Elizabeth Tower ; Big Ben est la cloche."},{"id":"cu514","t":"quiz","s":"cu","l":"5","tags":["BBC"],"h":"Quiz","b":"","q":"La BBC a été créée en…","o":["1922","1066","1856","1969"],"a":0,"e":"1922, ce qui en fait une des plus anciennes radios publiques du monde."},{"id":"cu515","t":"quiz","s":"cu","l":"5","tags":["langues"],"h":"Quiz","b":"","q":"« Beef » (la viande de bœuf) vient…","o":["du français","de l’allemand","d’une langue indienne","du latin directement"],"a":0,"e":"Après 1066, la viande servie aux seigneurs normands porte un nom français."},{"id":"cu516","t":"quiz","s":"cu","l":"5","tags":["fêtes"],"h":"Quiz","b":"","q":"Juneteenth commémore…","o":["la fin de l’esclavage au Texas en 1865","l’arrivée du Mayflower","l’indépendance des États-Unis","la découverte de l’Amérique"],"a":0,"e":"Le 19 juin 1865 ; jour férié fédéral depuis 2021."},{"id":"cu517","t":"quiz","s":"cu","l":"5","tags":["réel et imaginaire"],"h":"Quiz","b":"","q":"Quel auteur testait des chocolats Cadbury quand il était élève ?","o":["Roald Dahl","Mark Twain","J. K. Rowling","Arthur Conan Doyle"],"a":0,"e":"Une expérience qui a inspiré Charlie and the Chocolate Factory."},{"id":"cu518","t":"quiz","s":"cu","l":"5","tags":["Londres"],"h":"Quiz","b":"","q":"Le métro de Londres (the Tube) a ouvert en…","o":["1863","1900","1950","1789"],"a":0,"e":"C’est le plus ancien métro du monde."},{"id":"cu519","t":"quiz","s":"cu","l":"5","tags":["école"],"h":"Quiz","b":"","q":"En Angleterre, les GCSEs se passent vers…","o":["16 ans","11 ans","13 ans","21 ans"],"a":0,"e":"Ce sont les examens de fin de scolarité obligatoire."},{"id":"co51","t":"methode","s":"co","l":"5","tags":["compréhension de l’oral","prise de notes"],"h":"Prendre des notes pendant l’écoute","b":"1. Prépare **5 colonnes** : Who? What? Where? When? Why?\n2. N’écris que des **mots-clés**, jamais de phrases.\n3. Abréviations : & (and), w/ (with), → (donc), + (plus), = (est).\n4. Après chaque écoute, relie tes notes : qu’est-ce qui se répète ?\n> Les **chiffres, noms propres, dates** sont faciles à attraper : note-les toujours."},{"id":"co52","t":"methode","s":"co","l":"5","tags":["compréhension","indices"],"h":"Les indices qui t’aident à comprendre","b":"- **Indices visuels et sonores** : musique, bruitages, images, gestes.\n- **Indices culturels** : un drapeau, une fête, un lieu connu.\n- **Le type de document** : un bulletin météo, une pub, une interview n’ont pas la même forme.\n- **Les champs lexicaux** : plusieurs mots sur la nourriture → on parle d’un repas."},{"id":"co53","t":"quiz","s":"co","l":"5","tags":["prise de notes"],"h":"Quiz","b":"","q":"Pendant l’écoute, tu notes…","o":["des mots-clés, chiffres et noms propres","des phrases complètes","tout ce que tu entends","rien, tu notes après"],"a":0,"e":"Les phrases complètes te font rater la suite."},{"id":"ex51","t":"methode","s":"ex","l":"5","tags":["raconter","passé"],"h":"Raconter un souvenir au passé","b":"1. **Quand ? Où ? Avec qui ?** Last summer, I went to London with my family.\n2. **Les étapes** avec des connecteurs : First, … Then, … After that, … Finally, …\n3. **Tes impressions** : It was amazing! / I was a bit tired.\n> Vérifie chaque verbe : est-il bien au prétérit ? Les irréguliers sont-ils justes ?","en":"Last summer, I went to London with my family. First, we visited the Tower of London. Then, we took the Tube to Camden. After that, we ate fish and chips. Finally, we went back to the hotel. It was amazing!"},{"id":"ex52","t":"methode","s":"ex","l":"5","tags":["opinion","argumenter"],"h":"Donner son avis et le justifier","b":"- Annonce : I really like… / I don’t like… / What I prefer is…\n- Justifie : **because** + raison\n- Nuance : **However**, … / but…\n- Compare : He is **funnier than**…\n> Un avis sans « because », c’est la moitié des points.","en":"I really like Tom Sawyer because he is funny and brave. However, I prefer Huck because he is free."},{"id":"ex53","t":"methode","s":"ex","l":"5","tags":["écrire","e-mail"],"h":"Écrire un e-mail à un correspondant","b":"- **Hi** Jake, / **Dear** Jake,\n- How are you? Thanks for your e-mail!\n- Le corps : réponds à ses questions, puis donne tes nouvelles.\n- Pose-lui une question : What about you?\n- **Write back soon!** / **Best wishes,** + prénom","en":"Hi Jake, how are you? Thanks for your e-mail. I'm writing to tell you about my school. Write back soon! Best wishes, Léa"},{"id":"ex54","t":"fiche","s":"ex","l":"5","tags":["interaction"],"h":"Faire vivre une conversation","b":"- Montrer que tu suis : **Really?** **I see.** Oh, nice!\n- Relancer : **Can you tell me more?** **And?** **What about you?**\n- Demander de répéter : **Sorry, what did you say?** Could you speak more slowly, please?\n> Un bon interlocuteur pose des questions, il ne fait pas que répondre.","en":"Really? Can you tell me more? What about you? I see. Sorry, what did you say?"},{"id":"ex55","t":"quiz","s":"ex","l":"5","tags":["écrire"],"h":"Quiz","b":"","q":"Pour finir un e-mail amical, on écrit…","o":["Best wishes,","Dear,","Yours faithfully,","Hello,"],"a":0,"e":"Yours faithfully est réservé aux lettres très formelles."},{"id":"ex56","t":"quiz","s":"ex","l":"5","tags":["interaction"],"h":"Quiz","b":"","q":"Pour relancer ton interlocuteur, tu dis…","o":["Can you tell me more?","Shut up.","I don’t know.","Goodbye."],"a":0,"e":"Une relance montre que tu t’intéresses à ce qu’il dit.","en":"Can you tell me more?"},{"id":"gr41","t":"fiche","s":"gr","l":"4","tags":["prétérit be + ing"],"h":"Le prétérit BE + -ING : le décor en cours","b":"WAS / WERE + verbe en **-ing** : une action **en cours** à un moment du passé.\n> I **was reading** when the phone **rang**.\n- Le prétérit BE + -ing pose le **décor** (l’action longue).\n- Le prétérit simple raconte l’**événement** qui l’interrompt.\n- **while** + action longue : While we **were walking**, it started to rain.","en":"I was reading when the phone rang. While we were walking, it started to rain. What were you doing at eight?"},{"id":"gr42","t":"fiche","s":"gr","l":"4","tags":["present perfect"],"h":"Le present perfect : faire le bilan","b":"HAVE / HAS + **participe passé** (played, seen, been…).\nIl relie un fait passé au **présent** : on fait le **bilan**, sans date précise.\n- Expérience : Have you **ever** eaten sushi? I’ve **never** been to Dublin.\n- Tout juste : I’ve **just** finished.\n- Déjà / pas encore : She has **already** left. They haven’t arrived **yet**.\n> just, already, ever, never se placent avant le participe ; yet à la fin.","en":"I have visited Ireland. She has never seen the sea. Have you ever eaten sushi? I've just finished. They haven't arrived yet."},{"id":"gr43","t":"fiche","s":"gr","l":"4","tags":["present perfect","prétérit"],"h":"Present perfect ou prétérit ?","b":"- **Date ou moment précis passé** → prétérit : I **went** to London **last year** / **in 2024** / **two days ago**.\n- **Pas de date, on fait un bilan** → present perfect : I**’ve been** to London (expérience, ça compte aujourd’hui).\n> Yesterday, last, ago, in + année, When…? → prétérit, toujours.","en":"I have been to London. I went to London last year."},{"id":"gr44","t":"piege","s":"gr","l":"4","tags":["present perfect"],"h":"« I have seen him yesterday » : FAUX","b":"Dès qu’il y a un **repère passé précis** (yesterday, last week, in 2020, ago), le present perfect est interdit.\n- I have seen him yesterday ✗\n- I **saw** him yesterday ✓\n- When **did** you **see** him? ✓ (pas « When have you seen… »)","en":"I saw him yesterday."},{"id":"gr45","t":"fiche","s":"gr","l":"4","tags":["have to","must"],"h":"HAVE TO, MUST, MUSTN’T, DON’T HAVE TO","b":"- **must** : obligation ressentie par celui qui parle → I **must** call my gran.\n- **have to** : obligation qui vient de l’extérieur (règle) → I **have to** wear a uniform. Au passé : I **had to**.\n- **mustn’t** : **interdit** → You mustn’t use your phone.\n- **don’t have to** : **pas obligé** → You don’t have to come.\n> Mustn’t et don’t have to n’ont pas du tout le même sens !","en":"I have to wear a uniform. You mustn't use your phone. You don't have to come."},{"id":"gr46","t":"fiche","s":"gr","l":"4","tags":["may","might"],"h":"MAY / MIGHT : peut-être","b":"- **may** : c’est possible → She **may** be at home.\n- **might** : possible, mais moins sûr → It **might** rain later.\n- **may** sert aussi à demander poliment : **May** I come in?\n> Même famille que can, must, should : base verbale juste après.","en":"It might rain later. She may be at home. I'm not sure, perhaps."},{"id":"gr47","t":"fiche","s":"gr","l":"4","tags":["relatifs"],"h":"WHO, WHICH, THAT : relier deux phrases","b":"- **who** : pour une **personne** → The man **who** lives next door is Irish.\n- **which** : pour une **chose**, un animal → The book **which** I’m reading is great.\n- **that** : personne ou chose, à l’oral surtout → The film **that** we saw was funny.\n> Quand le relatif est complément, on peut l’effacer : The film (that) we saw.","en":"The man who lives next door is Irish. The book which I'm reading is great. The film that we saw was funny."},{"id":"gr48","t":"fiche","s":"gr","l":"4","tags":["comparaison"],"h":"Comparer avec nuance","b":"- Supériorité renforcée : **much** / **far** + comparatif → **much** funnier than\n- Infériorité : **less** … **than** → less popular than\n- Égalité : **as** … **as** ; négative : **not as** … **as**\n- Évolution : **more and more** popular, bigger **and** bigger\n> Plus… plus… : **The more** you practise, **the better** you speak.","en":"Chaplin is much funnier than Keaton. Tennis is less popular than football. It's not as expensive as I thought."},{"id":"gr49","t":"fiche","s":"gr","l":"4","tags":["used to"],"h":"USED TO : « avant, c’était différent »","b":"USED TO + base verbale : une habitude ou un état **passé qui n’existe plus**.\n> When I was little, I **used to** play with dolls.\n- Négation : I **didn’t use to** like vegetables.\n- Question : **Did** you **use to** live in London?\n> Ça se traduit souvent par l’imparfait : « avant, je jouais… ».","en":"When I was a child, I used to play with dolls. I didn't use to like vegetables. Did you use to live in London?"},{"id":"gr410","t":"fiche","s":"gr","l":"4","tags":["verbe + ing","verbe + to"],"h":"Verbe + -ING ou verbe + TO ?","b":"- Après **enjoy, love, like, hate, don’t mind, can’t stand, finish, stop** : **-ing** → I enjoy **reading**.\n- Après **want, would like, decide, hope, learn, need, plan** : **to** + base verbale → I want **to travel**.\n- Après une **préposition**, toujours **-ing** : good **at** drawing, interested **in** learning.","en":"I enjoy reading. I don't mind waiting. I want to travel. She decided to stay."},{"id":"gr411","t":"fiche","s":"gr","l":"4","tags":["futur"],"h":"Le futur : trois façons de le dire","b":"- **will** : prédiction, décision sur le moment, promesse → I**’ll** call you.\n- **be going to** : intention, projet décidé → I**’m going to** study medicine.\n- **BE + -ing** : rendez-vous fixé, organisé → I**’m meeting** Sam at five.\n> Le temps et les marqueurs (tonight, tomorrow, next week) disent que c’est le futur.","en":"I'll call you tonight. I'm going to study medicine. I'm meeting Sam at five."},{"id":"gr412","t":"fiche","s":"gr","l":"4","tags":["conditionnel"],"h":"WOULD et IF + prétérit : imaginer","b":"Pour une situation **imaginaire** ou peu probable :\n> **If** I **had** more money, I **would travel** around the world.\n- Après **if** : prétérit (même si on parle du présent).\n- Dans l’autre partie : **would** + base verbale.\n- Conseil : **If I were you**, I would… (were à toutes les personnes)\n> If + présent, will = probable. If + prétérit, would = imaginé.","en":"If I had more money, I would travel around the world. If we all lived in gated communities, life would be boring."},{"id":"gr413","t":"fiche","s":"gr","l":"4","tags":["phrasal verbs"],"h":"Les phrasal verbs indispensables","b":"Verbe + petit mot (up, off, for…) = **nouveau sens** :\n- **get up** (se lever), **wake up** (se réveiller)\n- **look for** (chercher), **look after** (s’occuper de), **look forward to** (avoir hâte de)\n- **give up** (abandonner), **find out** (découvrir)\n- **turn on / turn off** (allumer / éteindre), **put on** (mettre un vêtement)\n> I’m looking forward **to seeing** you! (to + -ing ici)","en":"Get up! Look for your keys. Look after your sister. I gave up. Turn off the light. Find out the answer."},{"id":"gr414","t":"fiche","s":"gr","l":"4","tags":["connecteurs","récit"],"h":"Les connecteurs du récit","b":"- **when** (quand), **while** (pendant que), **as soon as** (dès que)\n- **suddenly** (soudain), **then**, **after that**, **later**\n- **in the end** / **eventually** (finalement, au bout du compte)\n- **meanwhile** (pendant ce temps)\n> Eventually ≠ éventuellement ! Éventuellement se dit possibly.","en":"When I arrived, they were eating. As soon as he saw me, he smiled. Suddenly, the lights went out. Eventually, they found the way."},{"id":"gr415","t":"quiz","s":"gr","l":"4","tags":["present perfect"],"h":"Quiz","b":"","q":"I’ve never ___ to Ireland.","o":["been","went","go","be"],"a":0,"e":"Present perfect : have + participe passé. Go → went → gone, mais « avoir déjà été quelque part » se dit been.","en":"I've never been to Ireland."},{"id":"gr416","t":"quiz","s":"gr","l":"4","tags":["present perfect"],"h":"Quiz","b":"","q":"Have you ever ___ sushi?","o":["eaten","ate","eat","eating"],"a":0,"e":"Eat, ate, eaten : le participe passé après have.","en":"Have you ever eaten sushi?"},{"id":"gr417","t":"quiz","s":"gr","l":"4","tags":["prétérit be + ing"],"h":"Quiz","b":"","q":"She ___ TV when I arrived.","o":["was watching","watched","is watching","has watched"],"a":0,"e":"Action en cours (le décor) interrompue par une autre : was + -ing.","en":"She was watching TV when I arrived."},{"id":"gr418","t":"quiz","s":"gr","l":"4","tags":["present perfect","prétérit"],"h":"Quiz","b":"","q":"I ___ him yesterday at the station.","o":["saw","have seen","has seen","see"],"a":0,"e":"Yesterday = moment précis passé → prétérit.","en":"I saw him yesterday at the station."},{"id":"gr419","t":"quiz","s":"gr","l":"4","tags":["present perfect"],"h":"Quiz","b":"","q":"Have you finished your homework ___ ?","o":["yet","already","just","ever"],"a":0,"e":"Yet se place en fin de question ou de phrase négative.","en":"Have you finished your homework yet?"},{"id":"gr420","t":"quiz","s":"gr","l":"4","tags":["have to","must"],"h":"Quiz","b":"","q":"You ___ come if you don’t want to. It’s optional.","o":["don’t have to","mustn’t","must","have to"],"a":0,"e":"Don’t have to = pas obligé. Mustn’t = interdit.","en":"You don't have to come if you don't want to. It's optional."},{"id":"gr421","t":"quiz","s":"gr","l":"4","tags":["may","might"],"h":"Quiz","b":"","q":"Take an umbrella. It ___ rain this afternoon.","o":["might","must to","can’t","is"],"a":0,"e":"Might = peut-être, c’est possible.","en":"Take an umbrella. It might rain this afternoon."},{"id":"gr422","t":"quiz","s":"gr","l":"4","tags":["relatifs"],"h":"Quiz","b":"","q":"The girl ___ won the race is my cousin.","o":["who","which","what","whose"],"a":0,"e":"Une personne : who.","en":"The girl who won the race is my cousin."},{"id":"gr423","t":"quiz","s":"gr","l":"4","tags":["used to"],"h":"Quiz","b":"","q":"When I was a child, I ___ play with Lego every day.","o":["used to","use to","was used","am used to"],"a":0,"e":"Habitude passée terminée : used to + base verbale.","en":"When I was a child, I used to play with Lego every day."},{"id":"gr424","t":"quiz","s":"gr","l":"4","tags":["verbe + ing"],"h":"Quiz","b":"","q":"I really enjoy ___ in the sea.","o":["swimming","to swim","swim","swam"],"a":0,"e":"Après enjoy : -ing.","en":"I really enjoy swimming in the sea."},{"id":"gr425","t":"quiz","s":"gr","l":"4","tags":["verbe + to"],"h":"Quiz","b":"","q":"She decided ___ in Dublin for another week.","o":["to stay","staying","stay","stayed"],"a":0,"e":"Après decide : to + base verbale.","en":"She decided to stay in Dublin for another week."},{"id":"gr426","t":"quiz","s":"gr","l":"4","tags":["conditionnel"],"h":"Quiz","b":"","q":"If I ___ you, I would apologise.","o":["were","am","will be","would be"],"a":0,"e":"If I were you… : le conseil classique, avec were.","en":"If I were you, I would apologise."},{"id":"gr427","t":"quiz","s":"gr","l":"4","tags":["comparaison"],"h":"Quiz","b":"","q":"Chaplin is ___ funnier than Keaton, in my opinion.","o":["much","very","more","most"],"a":0,"e":"Pour renforcer un comparatif : much ou far. « Very funnier » n’existe pas.","en":"Chaplin is much funnier than Keaton, in my opinion."},{"id":"gr428","t":"quiz","s":"gr","l":"4","tags":["phrasal verbs"],"h":"Quiz","b":"","q":"« S’occuper de » se dit…","o":["look after","look for","look at","look up"],"a":0,"e":"Look for = chercher ; look at = regarder."},{"id":"gr429","t":"quiz","s":"gr","l":"4","tags":["connecteurs"],"h":"Quiz","b":"","q":"« Eventually » veut dire…","o":["finalement","éventuellement","évidemment","souvent"],"a":0,"e":"Faux ami classique : éventuellement = possibly."},{"id":"vo41","t":"fiche","s":"vo","l":"4","tags":["sport"],"h":"Le sport","b":"- a **team**, a **player**, a **coach** (entraîneur), a **referee** (arbitre), the **fans**\n- a **match** / a game, a **tournament**, the **final**, a **trophy**\n- **score** a goal, **win** a match, **beat** a team, **lose**, a **draw** (match nul)\n> On **win** un match, mais on **beat** un adversaire : We **beat** Ireland!","en":"Our team won the match. We beat them 3-1. The referee. The coach. The fans cheered.","p":[["⚽","football","foot"],["🏉","rugby","rugby"],["🏏","cricket","cricket"],["⚾","baseball","baseball"],["🏒","ice hockey","hockey sur glace"],["🏆","trophy","trophée"],["🥇","gold medal","médaille d’or"],["🧑‍⚖️","referee","arbitre"],["📣","fans","supporters"]]},{"id":"vo42","t":"fiche","s":"vo","l":"4","tags":["voyages"],"h":"Voyager","b":"- **travel** (voyager, verbe), a **journey** (un trajet), a **trip** (un voyage court, une sortie), a **voyage** (en bateau, une grande expédition)\n- **luggage** (bagages, indénombrable !), a **suitcase**, a **passport**\n- **flight**, **board** (embarquer), **abroad** (à l’étranger)\n- **explore**, an **explorer**, an **expedition**, to **discover**","en":"I love travelling. It was a long journey. We went on a school trip. My luggage is heavy. We boarded the plane.","p":[["✈️","flight","vol"],["🛂","passport","passeport"],["🧳","luggage","bagages"],["🎒","backpack","sac à dos"],["🗺️","abroad","à l’étranger"],["🧭","compass","boussole"],["🚢","ship","navire"],["🏕️","expedition","expédition"]]},{"id":"vo43","t":"fiche","s":"vo","l":"4","tags":["ville"],"h":"Villes, villages, quartiers","b":"- a **neighbourhood** (quartier), the **suburbs** (banlieue résidentielle), the **countryside**\n- **downtown** (centre-ville, US), **inhabitants** (habitants)\n- **lively** (animé), **crowded** (bondé), **quiet**, **noisy**, **safe** ≠ **dangerous**\n- a **neighbour**, a **community**, to **live together**","en":"It's a lively neighbourhood. The suburbs are quiet. The city centre is crowded. About five million inhabitants.","p":[["🏙️","city","grande ville"],["🏘️","neighbourhood","quartier"],["🏡","suburbs","banlieue"],["🌄","countryside","campagne"],["🚦","traffic","circulation"],["👥","crowded","bondé"],["🎉","lively","animé"],["🤫","quiet","calme"]]},{"id":"vo44","t":"fiche","s":"vo","l":"4","tags":["innovation"],"h":"Inventer, innover, créer","b":"- **invent** → an **inventor** → an **invention**\n- a **device** (un appareil), a **tool**, a **gadget**, an **app**\n- a **breakthrough** (une avancée majeure), a **discovery**\n- to **design** (concevoir), to **create**, to **improve** (améliorer), **innovative**","en":"He invented the telephone. A new device. An app. A breakthrough. To design.","p":[["💡","invention","invention"],["🧑‍🔬","inventor","inventeur"],["📱","device","appareil"],["🤖","robot","robot"],["⚙️","machine","machine"],["🔭","discovery","découverte"],["📞","telephone","téléphone"],["🔋","battery","batterie"]]},{"id":"vo45","t":"fiche","s":"vo","l":"4","tags":["art"],"h":"L’art et le spectacle","b":"- a **painting**, a **drawing**, a **masterpiece** (chef-d’œuvre), an **exhibition**\n- the **stage** (la scène), a **play** (une pièce), the **audience** (le public), to **clap**\n- **lyrics** (paroles), a **band**, a **songwriter**\n- a **gag**, **slapstick** (le comique burlesque), a **silent film**","en":"It's a masterpiece. A painting. A street artist. On stage. The audience clapped.","p":[["🎭","play","pièce de théâtre"],["🎬","film","film"],["🎟️","ticket","billet"],["👏","clap","applaudir"],["🎤","singer","chanteur"],["🖼️","masterpiece","chef-d’œuvre"],["🤡","clown","clown"],["🎪","circus","cirque"]]},{"id":"vo46","t":"fiche","s":"vo","l":"4","tags":["adjectifs -ed","-ing"],"h":"-ED ou -ING ? Bored ou boring ?","b":"- **-ing** : ce qui **provoque** l’émotion → The film was **boring**.\n- **-ed** : ce que **ressent** la personne → I was **bored**.\nMême chose avec : interesting / interested, exciting / excited, tiring / tired, frightening / frightened, amazing / amazed.\n> « I am boring » = je suis ennuyeux… Pas ce que tu voulais dire !","en":"The film was boring. I was bored. The trip was exciting. I was excited."},{"id":"vo47","t":"quiz","s":"vo","l":"4","tags":["sport"],"h":"Quiz","b":"","q":"We ___ Scotland 2-0!","o":["beat","won","gained","winned"],"a":0,"e":"On beat un adversaire, on win un match.","en":"We beat Scotland 2-0!"},{"id":"vo48","t":"quiz","s":"vo","l":"4","tags":["voyages"],"h":"Quiz","b":"","q":"Quelle phrase est correcte ?","o":["My luggage is very heavy.","My luggages are very heavy.","My luggage are very heavy.","A luggage is heavy."],"a":0,"e":"Luggage est indénombrable : pas de -s, verbe au singulier.","en":"My luggage is very heavy."},{"id":"vo49","t":"quiz","s":"vo","l":"4","tags":["adjectifs -ed","-ing"],"h":"Quiz","b":"","q":"The documentary was so long. I was ___ .","o":["bored","boring","bore","boredom"],"a":0,"e":"Ce que je ressens : -ed.","en":"The documentary was so long. I was bored."},{"id":"vo410","t":"quiz","s":"vo","l":"4","tags":["art"],"h":"Quiz","b":"","q":"« The audience », c’est…","o":["le public","l’audience au tribunal","le son","la salle vide"],"a":0,"e":"The audience clapped = le public a applaudi."},{"id":"vo411","t":"quiz","s":"vo","l":"4","tags":["ville"],"h":"Quiz","b":"","q":"« The suburbs », ce sont…","o":["les quartiers résidentiels autour de la ville","les sous-sols","les bus de la ville","le centre historique"],"a":0,"e":"Suburbs = banlieue, souvent résidentielle et calme."},{"id":"ph41","t":"fiche","s":"ph","l":"4","tags":["th"],"h":"TH : deux sons, et aucun n’est « s » ni « z »","b":"Langue entre les dents, on souffle :\n- **/θ/** sourd : **th**ink, **th**ank you, **th**ree, ba**th**\n- **/ð/** voisé (ça vibre) : **th**is, **th**at, mo**th**er, bro**th**er\n> « I sink » = je coule. « I think » = je pense. Ça vaut la peine de sortir la langue !","en":"Think. Thank you. Three. This. That. Mother. Brother."},{"id":"ph42","t":"fiche","s":"ph","l":"4","tags":["accent de phrase"],"h":"L’accent de phrase : le rythme de l’anglais","b":"On accentue les mots **porteurs de sens** (noms, verbes, adjectifs, adverbes, négations). Les petits mots s’écrasent.\n> I **WANT** to **GO** to **LON**don **NEXT SUM**mer.\nL’anglais a un rythme « en battements » : les syllabes fortes tombent à intervalles réguliers.","en":"I want to go to London next summer."},{"id":"ph43","t":"fiche","s":"ph","l":"4","tags":["accent de mot"],"h":"-TION, -IC : l’accent juste avant","b":"- Mots en **-tion** : l’accent tombe sur la syllabe **juste avant** -tion → in**VEN**tion, infor**MA**tion, explo**RA**tion.\n- Mots en **-ic** : même règle → fan**TAS**tic, e**LEC**tric, eco**NO**mic.\n> Ce sont des règles fiables : profites-en.","en":"Invention. Information. Fantastic. Electric. Photography."},{"id":"ph44","t":"fiche","s":"ph","l":"4","tags":["contractions"],"h":"Les formes contractées","b":"- **’ve** = have : I’ve seen it.\n- **’s** = is **ou** has : She’s tired (is). She’s got a dog (has). She’s been to Dublin (has).\n- **’d** = would **ou** had : We’d like to come (would).\n- **’ll** = will ; **n’t** = not\n> À l’oral, les contractions sont la norme. Les repérer change tout à l’écoute.","en":"I've seen it. She's got a dog. She's tired. We'd like to come. They'll be late."},{"id":"ph45","t":"quiz","s":"ph","l":"4","tags":["th"],"h":"Quiz","b":"","q":"Dans « this » et « mother », le th se prononce…","o":["/ð/ (ça vibre)","/θ/ (souffle sourd)","/z/","/d/"],"a":0,"e":"/ð/ est voisé. /θ/ s’entend dans think, three."},{"id":"ph46","t":"quiz","s":"ph","l":"4","tags":["accent de mot"],"h":"Quiz","b":"","q":"Où est l’accent dans « fantastic » ?","o":["fan-TAS-tic","FAN-tas-tic","fan-tas-TIC","aucun accent"],"a":0,"e":"Mots en -ic : accent sur la syllabe juste avant."},{"id":"ph47","t":"quiz","s":"ph","l":"4","tags":["contractions"],"h":"Quiz","b":"","q":"Dans « She’s been to Dublin », ’s veut dire…","o":["has","is","was","us"],"a":0,"e":"Been est un participe passé : she has been (present perfect)."},{"id":"cu41","t":"repere","s":"cu","l":"4","tags":["Irlande","axe 6"],"h":"Axe 6 : l’Irlande en repères","b":"- Capitale : **Dublin**. Monnaie : l’**euro**.\n- **Indépendante depuis 1922** (État libre d’Irlande), république proclamée en 1949.\n- Membre de l’Union européenne (alors CEE) depuis **1973**.\n- Deux langues officielles : l’**irlandais** (Gaeilge) et l’anglais.\n- L’**Irlande du Nord** (capitale Belfast) fait partie du Royaume-Uni.\n> « **Céad míle fáilte** » : cent mille fois bienvenue, en irlandais.","en":"Ireland. Dublin. The Irish language. Céad míle fáilte!"},{"id":"cu42","t":"fiche","s":"cu","l":"4","tags":["Irlande","histoire"],"h":"Axe 6 : la Grande Famine (1845-1849)","b":"Une maladie détruit les récoltes de **pommes de terre**, la nourriture de base des paysans irlandais.\n- Environ **un million de morts**.\n- Plus d’un million de personnes **émigrent**, surtout vers les **États-Unis**.\n> C’est pourquoi des millions d’Américains ont aujourd’hui des ancêtres irlandais, et pourquoi la Saint-Patrick est si fêtée à New York ou Boston.","en":"The Great Famine. Potatoes. Emigration to America."},{"id":"cu43","t":"fiche","s":"cu","l":"4","tags":["Irlande","symboles"],"h":"Axe 6 : symboles et traditions irlandaises","b":"- **St Patrick’s Day**, le 17 mars : saint patron de l’Irlande, parades, tout en vert.\n- **Shamrock** : le trèfle à trois feuilles.\n- **La harpe** : emblème officiel, sur les pièces irlandaises en euros.\n- **Sports gaéliques** : le **hurling** (crosse et petite balle) et le **Gaelic football**, organisés par la GAA depuis 1884, joués par des amateurs.\n- **Riverdance** (1994) a fait connaître la danse irlandaise dans le monde entier.","en":"St Patrick's Day is on the 17th of March. The shamrock. The harp. Hurling and Gaelic football."},{"id":"cu44","t":"fiche","s":"cu","l":"4","tags":["Irlande","paysages"],"h":"Axe 6 : The Wild Atlantic Way","b":"Une route touristique d’environ **2 500 km** le long de la côte ouest de l’Irlande, face à l’Atlantique : falaises, plages, phares, villages de pêcheurs.\n- Les **Cliffs of Moher** : des falaises d’environ 200 m au-dessus de l’océan.\n- Les **îles d’Aran**, où l’on parle encore irlandais au quotidien.","en":"The Wild Atlantic Way. The Cliffs of Moher."},{"id":"cu45","t":"fiche","s":"cu","l":"4","tags":["Irlande","littérature"],"h":"Axe 6 : une petite île, de très grands écrivains","b":"- **Bram Stoker**, né à Dublin, auteur de **Dracula** (1897).\n- **Oscar Wilde** : The Picture of Dorian Gray, The Canterville Ghost.\n- **W. B. Yeats**, poète, prix Nobel de littérature 1923.\n- **James Joyce** : Ulysses (1922), dont l’action se déroule à Dublin en une seule journée.\n- **Samuel Beckett** (Nobel 1969) et **Seamus Heaney** (Nobel 1995).","en":"Oscar Wilde. W. B. Yeats. James Joyce. Samuel Beckett. Bram Stoker wrote Dracula."},{"id":"cu46","t":"fiche","s":"cu","l":"4","tags":["sport","axe 1"],"h":"Axe 1 : sport et société","b":"- **États-Unis** : le sport universitaire (**NCAA**) remplit des stades ; le tournoi de basket **March Madness** passionne le pays. Le **Super Bowl**, finale du football américain, est l’émission la plus regardée de l’année.\n- **Canada** : le **hockey sur glace**, sport national d’hiver ; la **Stanley Cup** est le trophée de la ligue professionnelle.\n- **Cricket** : sport du Commonwealth ; **The Ashes**, la série entre l’Angleterre et l’Australie depuis 1882.\n- **Australie** : l’**Aussie Rules football** (AFL).","en":"The Super Bowl. March Madness. The Stanley Cup. The Ashes. Aussie Rules football."},{"id":"cu47","t":"fiche","s":"cu","l":"4","tags":["explorations","axe 2"],"h":"Axe 2 : voyages et explorations","b":"- **Captain James Cook** : trois grands voyages entre 1768 et 1779 ; à bord de l’Endeavour, il cartographie la Nouvelle-Zélande et atteint la côte est de l’Australie en 1770.\n- **Stanley et Livingstone** : en 1871, le journaliste Stanley retrouve l’explorateur écossais Livingstone en Afrique de l’Est et l’aurait salué d’un célèbre « Dr. Livingstone, I presume? ».\n- **Ernest Shackleton** : son navire, l’**Endurance**, est pris dans les glaces de l’Antarctique en 1915 puis écrasé. Après des mois de survie, les 28 hommes sont sauvés. L’épave a été retrouvée en 2022.","en":"Ernest Shackleton and the Endurance. Captain Cook. Dr. Livingstone, I presume?"},{"id":"cu48","t":"fiche","s":"cu","l":"4","tags":["espace","axe 2"],"h":"Axe 2 : la conquête spatiale","b":"- **20 juillet 1969**, mission **Apollo 11** : Neil Armstrong puis Buzz Aldrin marchent sur la Lune ; Michael Collins reste en orbite.\n- La phrase d’Armstrong : « That’s one small step for man, one giant leap for mankind. »\n- Contexte : la **course à l’espace** entre les États-Unis et l’URSS pendant la guerre froide.","en":"On the 20th of July 1969, Neil Armstrong walked on the Moon. That's one small step for man, one giant leap for mankind."},{"id":"cu49","t":"fiche","s":"cu","l":"4","tags":["villes","axe 3"],"h":"Axe 3 : villes, villages, quartiers","b":"- **Soweto** (Johannesburg) : township où, en 1976, des élèves se soulèvent contre l’apartheid. **Nelson Mandela** y a vécu ; libéré en 1990 après 27 ans de prison, il devient président de l’Afrique du Sud en 1994.\n- **Melbourne**, surnommée **the Garden City** pour ses grands parcs.\n- **Poundbury** (Dorset) : ville nouvelle construite à partir de 1993 selon les idées de Charles, alors prince de Galles.\n- **Gated communities** (États-Unis) : quartiers fermés et surveillés. Sécurité, ou nouvelle forme de séparation ?","en":"Soweto. Nelson Mandela. Apartheid. Melbourne, the Garden City. Poundbury. Gated communities."},{"id":"cu410","t":"fiche","s":"cu","l":"4","tags":["inventeurs","axe 4"],"h":"Axe 4 : inventer, innover, créer","b":"- **Ada Lovelace** (1815-1852) : mathématicienne britannique, elle écrit dès 1843 ce qu’on considère comme le premier programme informatique.\n- **Alexander Graham Bell**, né à Édimbourg : brevet du **téléphone** en 1876.\n- **Les frères Wright** : premier vol motorisé en 1903, aux États-Unis.\n- **Tim Berners-Lee**, Britannique : il invente le **World Wide Web** en 1989.","en":"Alexander Graham Bell invented the telephone. Ada Lovelace. Tim Berners-Lee invented the World Wide Web."},{"id":"cu411","t":"fiche","s":"cu","l":"4","tags":["art","axe 5"],"h":"Axe 5 : langages et messages artistiques","b":"- **Charlie Chaplin**, né à Londres en 1889 : génie du cinéma muet et du gag. Dans **Modern Times** (1936), il se moque du travail à la chaîne ; dans **The Great Dictator** (1940), d’Hitler.\n- **Banksy** : street artist anonyme venu de Bristol, dont les pochoirs portent des messages politiques.\n- **Shakespeare** (1564-1616) : ses pièces étaient jouées au **Globe Theatre**, reconstruit à Londres en 1997.\n- **La musique engagée** : des chansons qui ont accompagné des combats, comme celles de Bob Dylan (prix Nobel de littérature 2016).","en":"Charlie Chaplin. Silent films. Banksy. Shakespeare's Globe."},{"id":"cu412","t":"quiz","s":"cu","l":"4","tags":["Irlande"],"h":"Quiz","b":"","q":"L’Irlande est indépendante depuis…","o":["1922","1798","1973","1998"],"a":0,"e":"1922. Elle rejoint la CEE en 1973."},{"id":"cu413","t":"quiz","s":"cu","l":"4","tags":["Irlande"],"h":"Quiz","b":"","q":"La Grande Famine irlandaise est due…","o":["à une maladie de la pomme de terre","à une guerre avec la France","à une sécheresse au Sahara","à un tremblement de terre"],"a":0,"e":"La maladie détruit les récoltes de 1845 à 1849 ; un million de morts et un million d’émigrés."},{"id":"cu414","t":"quiz","s":"cu","l":"4","tags":["Irlande"],"h":"Quiz","b":"","q":"Quel emblème figure sur les euros irlandais ?","o":["une harpe","un trèfle","un lutin","une couronne"],"a":0,"e":"La harpe est l’emblème officiel de l’Irlande."},{"id":"cu415","t":"quiz","s":"cu","l":"4","tags":["Irlande","littérature"],"h":"Quiz","b":"","q":"Bram Stoker, né à Dublin, a écrit…","o":["Dracula","Frankenstein","Sherlock Holmes","Harry Potter"],"a":0,"e":"Dracula, en 1897."},{"id":"cu416","t":"quiz","s":"cu","l":"4","tags":["explorations"],"h":"Quiz","b":"","q":"Le navire d’Ernest Shackleton s’appelait…","o":["l’Endurance","le Titanic","l’Endeavour","le Mayflower"],"a":0,"e":"L’Endeavour était le navire de Cook ; le Mayflower, celui des Pèlerins."},{"id":"cu417","t":"quiz","s":"cu","l":"4","tags":["espace"],"h":"Quiz","b":"","q":"Le premier pas sur la Lune date de…","o":["1969","1957","1975","1989"],"a":0,"e":"Le 20 juillet 1969, mission Apollo 11."},{"id":"cu418","t":"quiz","s":"cu","l":"4","tags":["villes"],"h":"Quiz","b":"","q":"Nelson Mandela devient président de l’Afrique du Sud en…","o":["1994","1976","1990","2004"],"a":0,"e":"Libéré en 1990, élu en 1994 lors des premières élections ouvertes à tous."},{"id":"cu419","t":"quiz","s":"cu","l":"4","tags":["inventeurs"],"h":"Quiz","b":"","q":"Qui a inventé le World Wide Web ?","o":["Tim Berners-Lee","Alexander Graham Bell","Ada Lovelace","Thomas Edison"],"a":0,"e":"En 1989, au CERN."},{"id":"cu420","t":"quiz","s":"cu","l":"4","tags":["sport"],"h":"Quiz","b":"","q":"« The Ashes » oppose en cricket…","o":["l’Angleterre et l’Australie","l’Irlande et l’Écosse","les États-Unis et le Canada","l’Inde et le Kenya"],"a":0,"e":"Une série mythique qui existe depuis 1882."},{"id":"cu421","t":"quiz","s":"cu","l":"4","tags":["art"],"h":"Quiz","b":"","q":"Dans « Modern Times », Chaplin se moque…","o":["du travail à la chaîne","de la royauté","du football","de la télévision"],"a":0,"e":"1936 : Charlot pris dans les engrenages de l’usine."},{"id":"co41","t":"methode","s":"co","l":"4","tags":["compréhension","hiérarchiser"],"h":"Hiérarchiser : l’essentiel avant les détails","b":"1. **1re écoute ou lecture** : le thème général et le type de document. Résume-le en une phrase.\n2. **2e** : les informations principales (qui, quoi, où, quand).\n3. **3e** : les détails, les chiffres, les opinions.\n4. Fais des **bilans** entre chaque étape : tes hypothèses sont-elles confirmées ?\n> Une digression n’est pas l’idée principale : cherche ce qui revient et ce qui est accentué."},{"id":"co42","t":"methode","s":"co","l":"4","tags":["compréhension","opinion"],"h":"Repérer l’opinion et les sentiments","b":"Les mots qui trahissent ce que pense la personne :\n- **Opinion** : I think, I reckon, in my opinion, to be honest, I’m convinced\n- **Positif** : amazing, brilliant, fortunately, I love\n- **Négatif** : unfortunately, awful, sadly, disappointing\n- **Opposition** : but, however, although, on the other hand\n> L’intonation compte aussi : une voix qui monte, un rire, un soupir disent beaucoup.","en":"In my opinion. Unfortunately. Amazing. I can't believe it. To be honest."},{"id":"co43","t":"quiz","s":"co","l":"4","tags":["compréhension","opinion"],"h":"Quiz","b":"","q":"Lequel de ces mots signale une opinion négative ?","o":["unfortunately","amazing","fortunately","brilliant"],"a":0,"e":"Unfortunately = malheureusement."},{"id":"ex41","t":"methode","s":"ex","l":"4","tags":["exposé"],"h":"Faire un exposé de 2 minutes","b":"1. **Annonce** : Today, I’m going to talk about…\n2. **Plan** en 2 ou 3 parties : First, … Then, … Finally, …\n3. **Ton avis** : What I find fascinating is…\n4. **Conclusion** : To conclude, … Thank you for listening!\n> Note des **mots-clés**, pas des phrases : lire son texte, c’est perdre son public.","en":"Today, I'm going to talk about Ernest Shackleton. First, ... Then, ... To conclude, ..."},{"id":"ex42","t":"methode","s":"ex","l":"4","tags":["récit"],"h":"Écrire un récit au passé","b":"- **Le décor** au prétérit BE + -ing : It was raining. I was walking home…\n- **L’événement** au prétérit simple : …when suddenly I **heard** a noise.\n- **Les connecteurs** : when, while, suddenly, then, in the end.\n- **Les émotions** : I was terrified. I felt relieved.\n> Ce qui fait la différence : des détails (couleurs, sons) et des émotions.","en":"It was a cold winter night. I was walking home when suddenly I heard a strange noise."},{"id":"ex43","t":"methode","s":"ex","l":"4","tags":["critique"],"h":"Écrire une critique (review)","b":"1. **Présente** : titre, type (film, livre, série), auteur ou réalisateur.\n2. **Résume** l’histoire en 2 ou 3 phrases, sans dévoiler la fin (no spoilers!).\n3. **Donne ton avis** argumenté : The acting is brilliant, but the ending is disappointing.\n4. **Note et conseil** : I’d give it 4 stars. I recommend it to…","en":"I'd give it four stars. The acting is brilliant. I recommend it."},{"id":"ex44","t":"quiz","s":"ex","l":"4","tags":["exposé"],"h":"Quiz","b":"","q":"Pour annoncer le sujet de ton exposé, tu dis…","o":["Today, I’m going to talk about…","Finally, I talk…","Thank you for listening.","I am agree that…"],"a":0,"e":"On annonce le sujet au début, avec be going to.","en":"Today, I'm going to talk about"},{"id":"ex45","t":"quiz","s":"ex","l":"4","tags":["critique"],"h":"Quiz","b":"","q":"« No spoilers! » veut dire…","o":["ne dévoile pas la fin","ne critique pas le film","n’arrive pas en retard","ne parle pas pendant le film"],"a":0,"e":"Spoiler = révéler un élément clé de l’intrigue."},{"id":"gr31","t":"fiche","s":"gr","l":"3","tags":["present perfect","for","since"],"h":"FOR / SINCE : « depuis » avec le present perfect","b":"L’action a commencé dans le passé et **dure encore** : present perfect (le français utilise le présent !).\n- **for** + **durée** : I’ve lived here **for** five years.\n- **since** + **point de départ** : I’ve known her **since** 2020 / since Monday / since I was six.\n- Question : **How long** have you lived here?\n> « J’habite ici depuis 5 ans » ≠ « I live here since 5 years » ✗ → I**’ve lived** here **for** 5 years ✓","en":"I have lived in Perpignan for five years. I have known her since 2020. How long have you been here?"},{"id":"gr32","t":"fiche","s":"gr","l":"3","tags":["present perfect be + ing"],"h":"Le present perfect BE + -ING : ça dure… et ça se voit","b":"HAVE / HAS + **been** + verbe en **-ing**.\n- Insiste sur la **durée** d’une activité qui continue : I**’ve been waiting** for an hour!\n- Explique un **résultat visible** : You look tired. **Have** you **been running**?\n> Avec know, like, want, believe : present perfect simple seulement (I’ve known him for years).","en":"I've been waiting for an hour! She has been learning English since 2019. You look tired. Have you been running?"},{"id":"gr33","t":"fiche","s":"gr","l":"3","tags":["past perfect"],"h":"Le past perfect : le passé du passé","b":"HAD + **participe passé**. Il marque une action **antérieure** à une autre action passée.\n> When I **arrived**, the film **had** already **started**.\n(d’abord le film commence, ensuite j’arrive)\n- Il se traduit souvent par le plus-que-parfait : « avait commencé ».\n- Il est très fréquent dans les récits : She **had never seen** the sea before.","en":"When I arrived, the film had already started. She had never seen the sea before that trip."},{"id":"gr34","t":"fiche","s":"gr","l":"3","tags":["voix passive"],"h":"La voix passive : mettre l’accent sur ce qui subit","b":"BE (au bon temps) + **participe passé** (+ **by** + l’auteur si utile).\n- Actif : France **gave** the statue to the USA.\n- Passif : The statue **was given** to the USA **by** France.\n- Présent : English **is spoken** all over the world.\n> Le temps se lit sur BE : is made (présent), was made (passé), has been made (present perfect), will be made (futur).","en":"The Statue of Liberty was given by France. English is spoken all over the world. The bridge was built in 1894. Mobile phones are made in China."},{"id":"gr35","t":"fiche","s":"gr","l":"3","tags":["discours indirect"],"h":"Le discours indirect : rapporter des paroles","b":"- **say** (that) : She **said** (that) she **was** tired.\n- **tell** + personne : He **told me** (that)…\n- Question fermée : She **asked** me **if** I liked jazz.\n- Question ouverte : He asked **where I lived** (pas « where did I live »).\nAprès un verbe au passé, les temps **reculent** : présent → prétérit, will → would, prétérit → past perfect.\n> « I am tired. » → She said she **was** tired.","en":"She said that she was tired. He told me that he had lost his keys. She asked me if I liked jazz. He asked where I lived."},{"id":"gr36","t":"fiche","s":"gr","l":"3","tags":["conditionnel"],"h":"IF : le réel, l’imaginé, le regret","b":"- **Probable** : If + présent, **will** → If it rains, I**’ll** stay home.\n- **Imaginé (irréel du présent)** : If + **prétérit**, **would** + BV → If I **were** rich, I **would buy** an island.\n- **Irréel du passé (regret)** : If + **past perfect**, **would have** + participe → If I **had known**, I **would have come**.\n> Jamais de would juste après if.","en":"If I were rich, I would buy an island. If I had wings, I would fly. If I had known, I would have come."},{"id":"gr37","t":"fiche","s":"gr","l":"3","tags":["wish"],"h":"I WISH / IF ONLY : exprimer un regret, un souhait","b":"Pour un souhait **impossible ou irréel** dans le présent : **I wish** + **prétérit**.\n> I wish I **had** a dog. (je n’en ai pas)\n> I wish I **were** taller.\n> **If only** I could fly!\n> Le prétérit ici ne parle pas du passé : il marque l’irréel.","en":"I wish I had a dog. I wish I were taller. If only I could fly!"},{"id":"gr38","t":"fiche","s":"gr","l":"3","tags":["modaux","probabilité"],"h":"MUST, CAN’T, MIGHT : dire si c’est sûr","b":"Les modaux disent ton **degré de certitude** :\n- **must** = c’est presque certain → The light is on: she **must** be at home.\n- **can’t** = c’est impossible → He **can’t** be French: he doesn’t speak a word of it.\n- **may / might / could** = c’est possible → It **might** be true.\n> Parfait pour décrire une image : The man in the background **must** be a journalist.","en":"She must be at home: the light is on. He can't be French: he doesn't speak a word. It might be true."},{"id":"gr39","t":"fiche","s":"gr","l":"3","tags":["relatifs"],"h":"WHOSE, WHERE, WHEN : les relatifs avancés","b":"- **whose** = dont (possession) : The woman **whose** bag was stolen…\n- **where** = où (lieu) : This is the town **where** I was born.\n- **when** = où (temps) : the day **when** we met.\n> Rappel : who (personne), which (chose), that (les deux).","en":"The woman whose bag was stolen called the police. This is the town where I was born. I remember the day when we met."},{"id":"gr310","t":"fiche","s":"gr","l":"3","tags":["make","let","want"],"h":"MAKE, LET, WANT : faire faire","b":"- **make** + personne + **BV** = obliger : They **make me tidy** my room.\n- **let** + personne + **BV** = permettre : They **let me go** out.\n- **want** + personne + **to** + BV = vouloir que : I want **you to listen**.\n> « Je veux que tu viennes » → I want you to come (jamais « I want that you come »).","en":"My parents make me tidy my room. They let me go out on Saturdays. I want you to listen."},{"id":"gr311","t":"fiche","s":"gr","l":"3","tags":["question tags"],"h":"Les question tags : « n’est-ce pas ? »","b":"On reprend **l’auxiliaire** et le **sujet**, en inversant positif / négatif :\n- It’s cold, **isn’t it**?\n- You like jazz, **don’t you**? (présent simple → do)\n- She can swim, **can’t she**?\n- They didn’t come, **did they**?\n> Intonation descendante : tu attends juste une confirmation. Montante : c’est une vraie question.","en":"It's cold, isn't it? You like jazz, don't you? She can swim, can't she? They didn't come, did they?"},{"id":"gr312","t":"fiche","s":"gr","l":"3","tags":["concession"],"h":"ALTHOUGH, EVEN THOUGH, DESPITE : bien que, malgré","b":"- **although** / **even though** + **phrase** : Although it was raining, we went out.\n- **despite** / **in spite of** + **nom** ou **-ing** : Despite the rain… / Despite being tired…\n- **however** en début de phrase : However, they lost.\n> Even though est plus fort : « même si, et pourtant ».","en":"Although it was raining, we went out. Even though he was tired, he kept running. Despite the rain, the match went on."},{"id":"gr313","t":"fiche","s":"gr","l":"3","tags":["but"],"h":"Exprimer le but","b":"- **to** + BV : I saved money **to buy** a bike. (jamais « for buy »)\n- **in order to** + BV (plus formel) : in order to become a doctor\n- **so that** + sujet + can / could : Speak louder **so that** everyone **can** hear you.","en":"I saved money to buy a bike. She studies hard in order to become a doctor. Speak louder so that everyone can hear you."},{"id":"gr314","t":"fiche","s":"gr","l":"3","tags":["gérondif"],"h":"Le gérondif : le verbe qui devient nom","b":"Le verbe en **-ing** peut jouer le rôle d’un **nom** :\n- sujet : **Reading** is my favourite hobby. **Smoking** is dangerous.\n- après une **préposition** : interested **in learning**, good **at drawing**, thank you **for helping**.\n> Après une préposition, jamais de « to + verbe ».","en":"Reading is my favourite hobby. I'm interested in learning Japanese. Thank you for helping me."},{"id":"gr315","t":"piege","s":"gr","l":"3","tags":["used to","be used to"],"h":"USED TO ou BE USED TO ?","b":"- **used to** + BV = habitude **passée terminée** : I **used to live** in London. (avant, j’habitais à Londres)\n- **be used to** + **-ing** = **être habitué à** : I**’m used to getting** up early.\n> Le petit « be » change tout le sens.","en":"I used to live in London. I'm used to getting up early."},{"id":"gr316","t":"quiz","s":"gr","l":"3","tags":["for","since"],"h":"Quiz","b":"","q":"I have lived in this town ___ 2015.","o":["since","for","during","ago"],"a":0,"e":"Point de départ (une date) : since.","en":"I have lived in this town since 2015."},{"id":"gr317","t":"quiz","s":"gr","l":"3","tags":["for","since"],"h":"Quiz","b":"","q":"« J’apprends l’anglais depuis 5 ans » :","o":["I have been learning English for five years.","I learn English since five years.","I am learning English since five years.","I learnt English for five years ago."],"a":0,"e":"Durée qui continue : present perfect (ici BE + -ing) + for.","en":"I have been learning English for five years."},{"id":"gr318","t":"quiz","s":"gr","l":"3","tags":["past perfect"],"h":"Quiz","b":"","q":"When we got to the station, the train ___ .","o":["had already left","has already left","already leaves","was already leave"],"a":0,"e":"Le train est parti avant notre arrivée : past perfect.","en":"When we got to the station, the train had already left."},{"id":"gr319","t":"quiz","s":"gr","l":"3","tags":["voix passive"],"h":"Quiz","b":"","q":"The Statue of Liberty ___ by Bartholdi.","o":["was designed","designed","is designing","has design"],"a":0,"e":"Passif au passé : was + participe passé, + by l’auteur.","en":"The Statue of Liberty was designed by Bartholdi."},{"id":"gr320","t":"quiz","s":"gr","l":"3","tags":["voix passive"],"h":"Quiz","b":"","q":"English ___ in more than 50 countries.","o":["is spoken","speaks","is speaking","spoken"],"a":0,"e":"Présent passif : is + participe passé (speak, spoke, spoken).","en":"English is spoken in more than 50 countries."},{"id":"gr321","t":"quiz","s":"gr","l":"3","tags":["discours indirect"],"h":"Quiz","b":"","q":"« I am tired », she said. → She said that she ___ tired.","o":["was","is","were","has"],"a":0,"e":"Après said, le présent recule au prétérit.","en":"She said that she was tired."},{"id":"gr322","t":"quiz","s":"gr","l":"3","tags":["discours indirect"],"h":"Quiz","b":"","q":"He asked me ___ .","o":["where I lived","where did I live","where do I live","where I live?"],"a":0,"e":"Question indirecte : pas d’inversion, pas de do / did.","en":"He asked me where I lived."},{"id":"gr323","t":"quiz","s":"gr","l":"3","tags":["conditionnel"],"h":"Quiz","b":"","q":"If I ___ rich, I would buy a house in Ireland.","o":["were","will be","would be","am"],"a":0,"e":"Irréel du présent : if + prétérit (were à toutes les personnes).","en":"If I were rich, I would buy a house in Ireland."},{"id":"gr324","t":"quiz","s":"gr","l":"3","tags":["conditionnel"],"h":"Quiz","b":"","q":"If I had known, I ___ you.","o":["would have helped","would help","will help","had helped"],"a":0,"e":"Irréel du passé : if + past perfect, would have + participe passé.","en":"If I had known, I would have helped you."},{"id":"gr325","t":"quiz","s":"gr","l":"3","tags":["modaux","probabilité"],"h":"Quiz","b":"","q":"The lights are off and nobody answers. They ___ be on holiday.","o":["must","can’t","mustn’t","should to"],"a":0,"e":"Déduction presque certaine : must.","en":"The lights are off and nobody answers. They must be on holiday."},{"id":"gr326","t":"quiz","s":"gr","l":"3","tags":["modaux","probabilité"],"h":"Quiz","b":"","q":"That ___ be Tom: he’s in London today!","o":["can’t","must","might","has to"],"a":0,"e":"Impossible : can’t.","en":"That can't be Tom: he's in London today!"},{"id":"gr327","t":"quiz","s":"gr","l":"3","tags":["relatifs"],"h":"Quiz","b":"","q":"This is the singer ___ songs I love.","o":["whose","who","which","where"],"a":0,"e":"Possession (ses chansons) : whose.","en":"This is the singer whose songs I love."},{"id":"gr328","t":"quiz","s":"gr","l":"3","tags":["make","let","want"],"h":"Quiz","b":"","q":"My parents want me ___ harder.","o":["to work","work","that I work","working"],"a":0,"e":"Want + personne + to + base verbale.","en":"My parents want me to work harder."},{"id":"gr329","t":"quiz","s":"gr","l":"3","tags":["question tags"],"h":"Quiz","b":"","q":"You like jazz, ___ ?","o":["don’t you","isn’t it","do you","aren’t you"],"a":0,"e":"Présent simple affirmatif → tag négatif avec do : don’t you?","en":"You like jazz, don't you?"},{"id":"gr330","t":"quiz","s":"gr","l":"3","tags":["concession"],"h":"Quiz","b":"","q":"___ the rain, the concert went on.","o":["Despite","Although","Even though","However"],"a":0,"e":"Despite + nom. Although serait suivi d’une phrase complète.","en":"Despite the rain, the concert went on."},{"id":"gr331","t":"quiz","s":"gr","l":"3","tags":["but"],"h":"Quiz","b":"","q":"I went to the library ___ a book about Ellis Island.","o":["to borrow","for borrow","for borrowing","that I borrow"],"a":0,"e":"Le but : to + base verbale.","en":"I went to the library to borrow a book about Ellis Island."},{"id":"vo31","t":"fiche","s":"vo","l":"3","tags":["travail"],"h":"Le monde du travail","b":"- a **job** (un emploi, dénombrable) ≠ **work** (le travail, indénombrable)\n- **apply for** a job (postuler), a **CV** (UK) / **résumé** (US), a **job interview**\n- an **employer** ≠ an **employee**, a **salary** / **wages**, **unemployment** (chômage)\n- **skills** (compétences), **experience**, an **internship** (stage)\n> What do you want to be? — I’d like to **be** a nurse. / I’d like to **work** in a hospital.","en":"I'd like to work in a hospital. She applied for a job. Skills. A salary. Unemployment.","p":[["💼","job","emploi"],["👩‍💼","employer","employeur"],["🧑‍🏭","employee","employé"],["💰","salary","salaire"],["📄","CV","CV"],["🤝","job interview","entretien d’embauche"],["🧰","skills","compétences"],["🏢","office","bureau"]]},{"id":"vo32","t":"fiche","s":"vo","l":"3","tags":["migrations"],"h":"Voyages et migrations","b":"- to **emigrate** (quitter son pays) / to **immigrate** (s’installer dans un pays)\n- an **immigrant**, a **migrant**, a **refugee** (réfugié), **the border** (la frontière)\n- to **settle** (s’installer), to **flee** (fuir), to **hope for a better life**\n- **the melting pot** : la société où les cultures se mélangent ; **the salad bowl** : elles cohabitent sans se fondre.","en":"Immigrants arrived at Ellis Island. They hoped for a better life. They settled in New York.","p":[["🚢","ship","navire"],["🛂","border","frontière"],["🧳","suitcase","valise"],["🏠","settle","s’installer"],["🗽","Statue of Liberty","statue de la Liberté"],["🌎","the New World","le Nouveau Monde"],["🏃","flee","fuir"],["🤲","welcome","accueillir"]]},{"id":"vo33","t":"fiche","s":"vo","l":"3","tags":["médias"],"h":"Langages et médias","b":"- the **news** (les infos, indénombrable : the news **is**), a **headline** (gros titre), an **article**, a **journalist**\n- **social media**, a **post**, to **share**, an **influencer**\n- a **source**, **reliable** (fiable), to **check** facts, **fake news**, **misleading** (trompeur)\n- **the press**, **freedom of speech** (liberté d’expression)","en":"Is this source reliable? Fake news spreads fast on social media. The headline.","p":[["📰","newspaper","journal"],["📺","TV news","journal télévisé"],["📻","radio","radio"],["🎙️","journalist","journaliste"],["📱","social media","réseaux sociaux"],["🔍","check","vérifier"],["❌","fake news","fausse information"],["✅","reliable","fiable"]]},{"id":"vo34","t":"fiche","s":"vo","l":"3","tags":["engagement"],"h":"Formes de l’engagement","b":"- to **fight for** (se battre pour), to **stand up for** (défendre)\n- a **right** (un droit), **equality**, **freedom**, **justice**\n- a **protest**, a **march**, a **boycott**, a **campaign**, a **petition**\n- to **raise awareness** (sensibiliser), to **volunteer** (faire du bénévolat), an **activist**","en":"They fought for equal rights. They marched in the streets. She campaigned for the right to vote.","p":[["✊","fight for","se battre pour"],["📢","protest","manifestation"],["🪧","placard","pancarte"],["🗳️","vote","voter"],["✍️","petition","pétition"],["🤝","volunteer","bénévole"],["⚖️","justice","justice"],["🕊️","peace","paix"]]},{"id":"vo35","t":"piege","s":"vo","l":"3","tags":["faux amis"],"h":"Les faux amis qui piègent en 3e","b":"- **actually** = en fait (pas actuellement → currently)\n- **eventually** = finalement (pas éventuellement → possibly)\n- **sensible** = raisonnable (pas sensible → sensitive)\n- **to attend** = assister à (pas attendre → to wait)\n- **to pretend** = faire semblant (pas prétendre → to claim)\n- **sympathetic** = compatissant (pas sympa → nice)","en":"Actually, I'm French. Eventually, they won. Be sensible. I attended the meeting."},{"id":"vo36","t":"quiz","s":"vo","l":"3","tags":["faux amis"],"h":"Quiz","b":"","q":"« Actually » veut dire…","o":["en fait","actuellement","activement","exactement"],"a":0,"e":"Actuellement = currently, nowadays."},{"id":"vo37","t":"quiz","s":"vo","l":"3","tags":["faux amis"],"h":"Quiz","b":"","q":"« She’s very sensible » : elle est…","o":["raisonnable","sensible, émotive","sensuelle","sympathique"],"a":0,"e":"Sensible (FR) = sensitive (EN)."},{"id":"vo38","t":"quiz","s":"vo","l":"3","tags":["travail"],"h":"Quiz","b":"","q":"« Postuler à un emploi » :","o":["apply for a job","postulate a job","ask a work","candidate to a job"],"a":0,"e":"To apply for + le poste visé."},{"id":"vo39","t":"quiz","s":"vo","l":"3","tags":["migrations"],"h":"Quiz","b":"","q":"Une personne qui quitte son pays part pour…","o":["emigrate","immigrate","settle","welcome"],"a":0,"e":"Emigrate = partir ; immigrate = arriver et s’installer."},{"id":"vo310","t":"quiz","s":"vo","l":"3","tags":["médias"],"h":"Quiz","b":"","q":"Quelle phrase est correcte ?","o":["The news is good today.","The news are good today.","The new is good today.","A news is good today."],"a":0,"e":"News est indénombrable : verbe au singulier.","en":"The news is good today."},{"id":"vo311","t":"quiz","s":"vo","l":"3","tags":["engagement"],"h":"Quiz","b":"","q":"« Raise awareness » signifie…","o":["sensibiliser","lever la main","se réveiller","augmenter les prix"],"a":0,"e":"To raise awareness of an issue = sensibiliser à un problème."},{"id":"ph31","t":"fiche","s":"ph","l":"3","tags":["intonation","question tags"],"h":"L’intonation des question tags","b":"- **↘ descendante** : tu es sûr, tu attends juste un « oui » → It’s cold, isn’t it↘?\n- **↗ montante** : tu as un vrai doute, c’est une vraie question → You’re coming, aren’t you↗?\n> La même phrase change de sens selon la mélodie.","en":"It's cold, isn't it? You're coming, aren't you?"},{"id":"ph32","t":"fiche","s":"ph","l":"3","tags":["homophones"],"h":"Les homophones : même son, sens différent","b":"- **write** / **right** /raɪt/\n- **there** / **their** / **they’re** /ðeə/\n- **hear** / **here** /hɪə/\n- **weather** / **whether** /ˈweðə/\n- **know** / **no** /nəʊ/ ; **two** / **too** / **to**\n> À l’écoute, c’est le contexte qui tranche. À l’écrit, c’est toi !","en":"Write, right. There, their, they're. Hear, here. Weather, whether. Know, no."},{"id":"ph33","t":"fiche","s":"ph","l":"3","tags":["accent de mot"],"h":"L’accent qui se déplace dans une famille de mots","b":"- **PHO**tograph → pho**TO**grapher → photo**GRA**phic\n- **PO**litics → po**LI**tical → poli**TI**cian\n- e**CO**nomy → eco**NO**mic\n> Les suffixes -ic, -ical, -ian, -tion attirent l’accent juste avant eux.","en":"Photograph. Photographer. Photographic. Politics. Political."},{"id":"ph34","t":"fiche","s":"ph","l":"3","tags":["ough"],"h":"-OUGH : le casse-tête de l’orthographe anglaise","b":"- **though** /ðəʊ/ (bien que)\n- **through** /θruː/ (à travers)\n- **tough** /tʌf/ (dur) ; **enough** /ɪˈnʌf/\n- **cough** /kɒf/ (toux)\n- **thought** /θɔːt/ (pensée)\n> Pas de règle magique : apprends-les avec le son, à voix haute.","en":"Though, through, tough, cough, thought, enough."},{"id":"ph35","t":"quiz","s":"ph","l":"3","tags":["homophones"],"h":"Quiz","b":"","q":"Complète : ___ going to the cinema tonight.","o":["They’re","Their","There","Theyre"],"a":0,"e":"They’re = they are.","en":"They're going to the cinema tonight."},{"id":"ph36","t":"quiz","s":"ph","l":"3","tags":["accent de mot"],"h":"Quiz","b":"","q":"Où est l’accent dans « photographer » ?","o":["pho-TO-gra-pher","PHO-to-gra-pher","pho-to-GRA-pher","pho-to-gra-PHER"],"a":0,"e":"L’accent se déplace : PHOtograph, phoTOgrapher, photoGRAphic."},{"id":"ph37","t":"quiz","s":"ph","l":"3","tags":["ough"],"h":"Quiz","b":"","q":"Quel mot se prononce /tʌf/ ?","o":["tough","though","through","thought"],"a":0,"e":"Tough rime avec stuff."},{"id":"ph38","t":"quiz","s":"ph","l":"3","tags":["intonation"],"h":"Quiz","b":"","q":"« It’s a nice day, isn’t it↘ » avec une intonation descendante :","o":["tu attends simplement qu’on confirme","tu poses une vraie question, tu doutes","tu es en colère","tu te trompes de phrase"],"a":0,"e":"Descendante = confirmation ; montante = vrai doute."},{"id":"cu31","t":"repere","s":"cu","l":"3","tags":["États-Unis","axe 6"],"h":"Axe 6 : les États-Unis en repères","b":"- **50 États**, capitale : **Washington, D.C.** (pas New York).\n- **4 juillet 1776** : Déclaration d’indépendance, rédigée surtout par Thomas Jefferson.\n- **1787** : la Constitution, toujours en vigueur (avec des amendements).\n- Le drapeau : **50 étoiles** (les États) et **13 bandes** (les 13 colonies d’origine).\n- Devise : « In God We Trust » ; hymne : The Star-Spangled Banner.","en":"The United States of America. Fifty states. Washington, D.C. The 4th of July 1776."},{"id":"cu32","t":"fiche","s":"cu","l":"3","tags":["États-Unis","institutions"],"h":"Axe 6 : comment fonctionnent les États-Unis","b":"- **Le président** : élu pour **4 ans**, **deux mandats maximum** ; il dirige le pouvoir exécutif depuis la Maison-Blanche.\n- **Le Congrès** vote les lois : le **Sénat** (100 sénateurs, 2 par État) et la **Chambre des représentants** (435 membres, selon la population).\n- **La Cour suprême** : 9 juges nommés à vie.\n- **Checks and balances** : chaque pouvoir limite les autres.\n> C’est un État **fédéral** : chaque État a ses propres lois, sa police, son gouverneur.","en":"The President. Congress: the Senate and the House of Representatives. The Supreme Court."},{"id":"cu33","t":"fiche","s":"cu","l":"3","tags":["migrations","axe 3"],"h":"Axe 3 : une nation d’immigrants","b":"- **1620** : le **Mayflower** débarque des colons anglais, les Pèlerins, à Plymouth (Massachusetts). Des peuples amérindiens vivaient là depuis des millénaires.\n- **1886** : la **statue de la Liberté**, cadeau de la France, sculptée par Bartholdi, structure de Gustave Eiffel.\n- **Ellis Island** (1892-1954) : environ **12 millions** d’immigrants passent par ce centre d’accueil de New York. Européens, Irlandais, Italiens, Juifs d’Europe de l’Est…\n> Melting pot ou salad bowl : les cultures se fondent-elles, ou cohabitent-elles ?","en":"Ellis Island. The Statue of Liberty. The Mayflower."},{"id":"cu34","t":"fiche","s":"cu","l":"3","tags":["droits civiques","axe 5"],"h":"Axe 5 : le mouvement des droits civiques","b":"Dans le Sud des États-Unis, la **ségrégation** sépare Noirs et Blancs (écoles, bus, restaurants).\n- **1er décembre 1955** : à Montgomery (Alabama), **Rosa Parks** refuse de céder sa place à un Blanc dans un bus. Le boyco

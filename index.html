<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Swipe ton English : révisions, quiz, prononciation et défis en anglais pour la 6e, la 5e, la 4e et la 3e, d’après les programmes 2025. Gratuit, sans compte.">
<title>Swipe ton English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FFFFFF; --bg2:#F1F1F2; --surface:#F1F1F2; --surface2:#E3E3E6;
  --text:#161823; --muted:#62646C; --line:rgba(22,24,35,.12);
  --cyan:#4FA3FF; --pink:#E8112D; --cyan-ink:#0B4FC4; --pink-ink:#C8102E;
  --ok:#14B87A; --font:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs:1; background:#161823;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#06112B; --bg2:#040B1E; --surface:#13244A; --surface2:#1E3260;
    --text:#FFFFFF; --muted:#A1A2A8; --line:rgba(255,255,255,.13);
    --cyan-ink:#4FA3FF; --pink-ink:#E8112D; --ok:#4FA3FF;
  }
}
:root[data-theme="dark"]{
  --bg:#06112B; --bg2:#040B1E; --surface:#13244A; --surface2:#1E3260;
  --text:#FFFFFF; --muted:#A1A2A8; --line:rgba(255,255,255,.13);
  --cyan-ink:#4FA3FF; --pink-ink:#E8112D; --ok:#4FA3FF;
}
:root.dys{--font:"Lexend",system-ui,sans-serif}
/* Scène (fil, défi, cartes) : nuit par défaut */
:root{--st-bg:#06112B;--st-text:#fff;--st-soft:rgba(255,255,255,.92);--st-muted:rgba(255,255,255,.68);--st-glass:rgba(255,255,255,.12);--st-glass2:rgba(255,255,255,.08);--st-line:rgba(255,255,255,.2);--st-eq:rgba(255,255,255,.07);--st-shadow:0 1px 2px rgba(0,0,0,.6);--st-fade:linear-gradient(#06112B 0%,rgba(6,17,43,.55) 60%,transparent);--st-ok:var(--cyan);--st-save:#0B4FC4}
/* Ambiance jour : clair et chatoyant */
:root.pop{--st-bg:#FFFFFF;--st-text:#161823;--st-soft:rgba(22,24,35,.86);--st-muted:rgba(22,24,35,.6);--st-glass:rgba(255,255,255,.78);--st-glass2:rgba(255,255,255,.62);--st-line:rgba(22,24,35,.14);--st-eq:rgba(255,255,255,.7);--st-shadow:0 1px 0 rgba(255,255,255,.7);--st-fade:linear-gradient(rgba(255,255,255,.94) 0%,rgba(255,255,255,.55) 60%,transparent);--st-ok:#0B4FC4;--st-save:#0B4FC4}
*,*:before,*:after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--bg2);color:var(--text);font-family:var(--font);font-size:calc(16px * var(--fs));line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden}
.dys body{letter-spacing:.02em;word-spacing:.08em;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:520px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
#views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view.on{display:block}
#v-feed{overflow:hidden;background:var(--st-bg);color:var(--st-text)}
.irid{background:radial-gradient(120% 70% at 85% 8%,rgba(var(--rgb),.42) 0%,transparent 60%),radial-gradient(90% 60% at 0% 100%,rgba(var(--rgb),.18) 0%,transparent 70%),var(--st-bg)}
.pop .irid{background:radial-gradient(110% 65% at 85% 6%,rgba(var(--rgb),.5) 0%,transparent 62%),radial-gradient(90% 55% at 0% 100%,rgba(var(--rgb),.28) 0%,transparent 70%),radial-gradient(60% 40% at 8% 18%,rgba(79,163,255,.22) 0%,transparent 70%),radial-gradient(55% 40% at 95% 70%,rgba(232,17,45,.14) 0%,transparent 70%),linear-gradient(160deg,#FFF1F2 0%,#FFFFFF 50%,#EEF3FF 100%)}
.pop .card .bgc:after{content:"";position:absolute;inset:0;background:linear-gradient(118deg,transparent 30%,rgba(255,255,255,.55) 46%,rgba(255,255,255,0) 60%)}

/* ---------- Glitch: la signature ---------- */
.glitch{text-shadow:-2px -1px 0 var(--cyan),2px 1px 0 var(--pink)}
.glitch-sm{text-shadow:-1px 0 0 var(--cyan),1px 0 0 var(--pink)}
.wide{font-stretch:125%;font-variation-settings:"wdth" 125;font-weight:900;letter-spacing:-.01em}
.dys .wide{font-variation-settings:normal;font-stretch:100%;font-weight:800}

/* ---------- Feed ---------- */
.feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.card{touch-action:manipulation;position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.card .bgc{position:absolute;inset:0;pointer-events:none}
.card .inner{position:relative;max-height:100%;overflow-y:auto;padding:98px 76px 22px 18px;-webkit-overflow-scrolling:touch}
.pill{display:inline-block;font-size:.78em;font-weight:700;padding:3px 10px;border-radius:4px;background:var(--st-glass);color:var(--st-text);margin-bottom:10px}
.pop .pill{background:#161823;color:#fff}
.pill.quiz,.pop .pill.quiz{background:var(--pink);color:#fff}
.pill.piege{background:#fff;color:#000}
.pop .pill.piege{background:#0B4FC4;color:#fff}
.hook{font-size:clamp(1.3em,6.2vw,1.6em);font-stretch:112%;font-variation-settings:"wdth" 112;line-height:1.08;margin:0 0 14px;overflow-wrap:break-word}
.body{font-size:1em;color:var(--st-soft);max-width:62ch}
.body p{margin:0 0 .6em}
.body ul,.body ol{margin:0 0 .7em;padding-left:1.2em}
.body li{margin:.25em 0}
.body strong{color:var(--st-text);font-weight:800}
.body .eq{display:block;margin:.4em 0 .8em;padding:.55em .75em;border-left:3px solid var(--cyan);background:var(--st-eq);font-weight:600}
.pop .body .eq{border-left-color:var(--pink);box-shadow:0 1px 6px rgba(22,24,35,.06)}
.meta{margin-top:14px;font-size:.95em}
.meta .who{font-weight:800}
.meta .tags{color:var(--st-muted);margin-top:2px}
.rail{position:absolute;right:8px;bottom:26px;display:flex;flex-direction:column;align-items:center;gap:18px;z-index:2}
.rbtn{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--st-text);font-size:.72em;font-weight:700;text-shadow:var(--st-shadow)}
.rbtn .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--st-glass)}
.pop .rbtn .ic{box-shadow:0 3px 10px rgba(22,24,35,.12)}
.rbtn svg{width:26px;height:26px}
.rbtn.on.like .ic{color:var(--pink)}
.rbtn.on.save .ic{color:var(--st-save)}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#000;border:2px solid #fff;font-size:.95em}
.pop .avatar{box-shadow:0 3px 10px rgba(22,24,35,.18)}
.feedtop{position:absolute;top:0;left:0;right:0;z-index:5;padding:8px 10px 16px 0;background:var(--st-fade);display:flex;flex-direction:column;align-items:stretch;gap:6px}
.ftrow{display:flex;align-items:center;gap:4px}
.feedtop .chips{flex:1;min-width:0}
.vibe{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--st-glass);color:var(--st-text)}
.pop .vibe{box-shadow:0 3px 10px rgba(22,24,35,.14);color:#0B4FC4}
.vibe svg{width:22px;height:22px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:transparent;color:var(--st-muted);font-weight:700;padding:6px 8px;font-size:.95em;position:relative}
.chip.on{color:var(--st-text)}
.chip.on:after{content:"";position:absolute;left:30%;right:30%;bottom:0;height:3px;border-radius:2px;background:var(--st-text)}
.pop .chip.on:after{background:linear-gradient(90deg,var(--cyan),var(--pink))}
.burst{position:absolute;pointer-events:none;width:96px;height:96px;margin:-48px 0 0 -48px;color:var(--pink);animation:burst .7s ease-out forwards;z-index:4}
@keyframes burst{0%{transform:scale(.2) rotate(-12deg);opacity:0}25%{transform:scale(1.15) rotate(6deg);opacity:1}60%{transform:scale(1) rotate(0)}100%{transform:scale(1.4) translateY(-40px);opacity:0}}
.opts{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
.opt{text-align:left;border:2px solid var(--st-line);background:var(--st-glass2);color:var(--st-text);border-radius:12px;padding:11px 14px;font-weight:600;font-size:1em}
.opt.ok{border-color:var(--st-ok);background:rgba(79,163,255,.22)}
.opt.ko{border-color:var(--pink);background:rgba(232,17,45,.2)}
.opt[disabled]{cursor:default}
.expl{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--st-glass2);font-size:.95em}
.expl b{display:block;margin-bottom:2px}
.endcard{display:flex;align-items:center;justify-content:center;text-align:center}
.endcard .inner{padding:40px 24px}

/* ---------- Pages claires ---------- */
.page{padding:16px 16px 28px}
.ptitle{font-size:1.7em;line-height:1.05;margin:6px 0 4px}
.psub{color:var(--muted);margin:0 0 16px}
.search{width:100%;border:0;border-radius:6px;background:var(--surface);color:var(--text);padding:12px 14px;font:inherit;font-size:1em}
.lchips{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.lchips::-webkit-scrollbar{display:none}
.lchip{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 12px;font-weight:700;font-size:.9em;display:flex;align-items:center;gap:6px}
.lchip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto;border:1px solid rgba(128,128,128,.5)}
.row{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:13px 2px}
.row .tx{flex:1;min-width:0}
.row .t1{font-weight:700}
.row .t2{color:var(--muted);font-size:.85em;margin-top:2px}
.row .st{font-size:.8em;color:var(--muted);white-space:nowrap}
.empty{padding:30px 6px;color:var(--muted)}
.btn{border:0;border-radius:6px;padding:13px 18px;font-weight:800;font-size:1em;background:var(--pink);color:#fff}
.btn.alt{background:var(--surface);color:var(--text)}
.btn.cy{background:var(--cyan);color:#000}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.block{border-top:8px solid var(--surface);margin:18px -16px 0;padding:16px 16px 4px}
.block h3{margin:0 0 10px;font-size:1.15em}
.small{font-size:.85em;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.prog{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;margin:9px 0;font-size:.92em}
.prog b{font-weight:700}
.prog .pc{text-align:right;color:var(--muted)}

/* Profil */
.prof{text-align:center;padding-top:10px}
.bigav{width:96px;height:96px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:2.4em;font-weight:900;background:var(--surface);box-shadow:-3px -2px 0 var(--cyan),3px 2px 0 var(--pink)}
.pseudo{border:0;background:transparent;color:var(--text);font:inherit;font-weight:800;font-size:1.2em;text-align:center;width:100%;padding:4px}
.lvl{color:var(--muted);font-size:.92em}
.stats{display:flex;justify-content:center;margin:16px 0 6px}
.stat{flex:1;max-width:120px}
.stat b{display:block;font-size:1.35em;font-weight:900}
.stat span{font-size:.82em;color:var(--muted)}
.count{display:flex;align-items:baseline;gap:10px;margin:4px 0 2px}
.count .n{font-size:4.2em;line-height:.95}
.count .u{font-weight:700;color:var(--muted)}

/* Simulateur */
.simg{display:grid;grid-template-columns:1fr 84px 54px;gap:8px 10px;align-items:center}
.simg label{font-weight:600;font-size:.95em}
.simg input{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);padding:8px;font:inherit;text-align:center}
.simg .cf{font-size:.8em;color:var(--muted)}
.result{margin-top:14px;padding:14px;border-radius:8px;background:var(--surface)}
.result .big{font-size:2.2em;line-height:1}
.seg{display:flex;background:var(--surface);border-radius:6px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:5px;font-weight:700;font-size:.9em}
.seg button.on{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0}

/* Épreuves */
.exam{display:flex;gap:14px;align-items:stretch;width:100%;border:0;background:var(--surface);border-radius:8px;padding:0;margin:0 0 10px;text-align:left;overflow:hidden}
.exam .stripe{width:8px;flex:0 0 8px}
.exam .ex{padding:13px 14px 13px 0;flex:1}
.exam .exn{font-weight:900;font-size:1.1em}
.exam .exw{color:var(--muted);font-size:.86em;margin-top:2px}
.exam .exc{font-weight:800;font-size:.85em;align-self:center;padding-right:14px;white-space:nowrap}
.parts{border-collapse:collapse;width:100%;font-size:.93em}
.parts td{border-bottom:1px solid var(--line);padding:9px 4px;vertical-align:top}
.parts td.r{text-align:right;white-space:nowrap;font-weight:700}
.olist{padding-left:1.3em;margin:0}
.olist li{margin:.45em 0}
.ulist{padding-left:1.1em;margin:0}
.ulist li{margin:.4em 0}

/* Défi */
.defi-run{min-height:100%;color:var(--st-text);--rgb:79,163,255;padding:18px 16px 24px;display:flex;flex-direction:column}
.dots{display:flex;gap:4px;margin-bottom:12px}
.dots i{flex:1;height:4px;border-radius:2px;background:var(--st-line)}
.dots i.ok{background:var(--st-ok)}
.dots i.ko{background:var(--pink)}
.dots i.cur{background:var(--st-text)}
.tbar{height:6px;border-radius:3px;background:var(--st-line);overflow:hidden;margin-bottom:18px}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));transform-origin:left}
.dq{font-size:clamp(1.25em,5.8vw,1.45em);line-height:1.15;margin:8px 0 16px}
.dsub{color:var(--st-muted);font-weight:700;font-size:.9em}
.score{font-size:5em;line-height:1;margin:20px 0 6px}

/* Overlay */
#ov{position:absolute;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column}
#ov.on{display:flex}
#ov.dark{background:var(--st-bg);color:var(--st-text)}
.btn.ghost{background:var(--st-glass);color:var(--st-text)}
.pop .btn.ghost{box-shadow:inset 0 0 0 1px var(--st-line)}
.ovtop{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 6px 14px;border-bottom:1px solid var(--line)}
#ov.dark .ovtop{border-color:var(--st-line)}
.ovtop b{font-size:1em}
.x{border:0;background:none;width:44px;height:44px;display:grid;place-items:center}
.x svg{width:24px;height:24px}
.ovbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.solo{min-height:100%;position:relative;display:flex;flex-direction:column;justify-content:center}
.solo .inner{padding:24px 18px 28px}
.solobar{display:flex;gap:8px;padding:0 18px 22px;flex-wrap:wrap}
.solobar .btn{flex:1}

/* Chrono */
.chr{text-align:center;padding:22px 18px}
.chr .ph{font-weight:700;color:var(--st-muted);min-height:2.6em}
.chr .tm{font-size:5.2em;line-height:1;margin:16px 0 8px;font-variant-numeric:tabular-nums}
.chr .tot{color:var(--st-muted);font-size:.9em}
.chr .plist{text-align:left;margin:22px 0 18px;padding:0;list-style:none}
.chr .plist li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--st-line);color:var(--st-muted)}
.chr .plist li.cur{color:var(--st-text);font-weight:800}
.chr .plist li.done{text-decoration:line-through}
.chr .btns{display:flex;gap:8px;flex-wrap:wrap}
.chr .btns .btn{flex:1}
.flash{animation:flash .9s ease-out 2}
@keyframes flash{0%{background:var(--pink)}100%{background:transparent}}
.chr .small{color:var(--st-muted)}

/* Tabbar */
.pop .view:not(#v-feed):not(#v-defi){background:radial-gradient(80% 240px at 100% 0%,rgba(232,17,45,.12),transparent 70%),radial-gradient(70% 220px at 0% 0%,rgba(79,163,255,.16),transparent 70%),var(--bg)}
.pop .bigav{background:linear-gradient(135deg,#E8FEFD,#FFE8EE)}
#tabbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-around;border-top:1px solid var(--line);background:var(--bg);padding:5px 0 4px}
#tabbar.dark{background:#06112B;border-color:rgba(255,255,255,.12);color:#fff}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.66em;font-weight:700;color:var(--muted);padding:4px 8px;min-width:56px;position:relative}
#tabbar.dark .tab{color:rgba(255,255,255,.6)}
.tab.on{color:var(--text)}
#tabbar.dark .tab.on{color:#fff}
.tab svg{width:25px;height:25px}
.tab .badge{position:absolute;top:0;right:8px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--pink);color:#fff;font-size:10px;line-height:17px;text-align:center}
.plus{border:0;background:none;padding:4px 6px}
.plus span{display:block;width:44px;height:30px;border-radius:9px;position:relative;background:var(--text);box-shadow:-4px 0 0 var(--cyan),4px 0 0 var(--pink)}
#tabbar.dark .plus span{background:#fff}
.plus svg{position:absolute;inset:0;margin:auto;width:20px;height:20px;color:var(--bg)}
#tabbar.dark .plus svg{color:#000}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:rgba(22,24,35,.94);color:#fff;padding:10px 16px;border-radius:8px;font-weight:700;font-size:.9em;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.feed{scroll-behavior:auto}}

/* ---------- Swipe ton English : ajouts ---------- */
.lvb{width:auto;min-width:40px;padding:0 10px;border-radius:20px;font-weight:900;font-size:.92em;letter-spacing:-.01em}
.pop .lvb{color:#161823}
.avatar{font-size:.86em;letter-spacing:-.02em}
.rbtn.say.on .ic{color:var(--cyan)}
.pop .rbtn.say.on .ic{color:var(--cyan-ink)}
.saybtn{display:inline-flex;align-items:center;gap:6px;margin-top:8px;border:0;border-radius:6px;padding:7px 11px;font-weight:800;font-size:.88em;background:var(--st-glass);color:var(--st-text)}
.saybtn svg{width:18px;height:18px}
.lvgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 8px}
.lvopt{border:2px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:16px 10px 12px;text-align:center}
.lvopt b{display:block;font-size:2.1em;line-height:1}
.lvopt span{display:block;margin-top:6px;font-size:.82em;color:var(--muted);font-weight:700}
.lvopt.on{border-color:var(--pink);box-shadow:-3px -2px 0 var(--cyan),3px 2px 0 var(--pink)}
.axes{margin:4px 0 0;padding-left:1.1em}
.axes li{margin:.3em 0}
.selfg{display:grid;grid-template-columns:1fr 96px 46px;gap:8px 10px;align-items:center}
.selfg label{font-weight:600;font-size:.95em}
.selfg select{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);padding:8px 6px;font:inherit;font-weight:700}
.selfg .cf{font-size:.8em;color:var(--muted);text-align:right}
.selfg .cf.ok{color:var(--ok);font-weight:800}
.lvline{text-align:center;margin-top:4px}
.count .n{white-space:nowrap}
.linkbtn{border:0;background:none;padding:2px 4px;font-weight:800;color:var(--pink-ink);text-decoration:underline;text-underline-offset:3px}
.target{margin:0 0 14px;padding:12px 14px;border-radius:8px;background:var(--surface);font-size:.93em}
.target b{font-weight:800}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px;margin:2px 0 6px}
.pic{border:0;border-radius:14px;background:var(--st-glass);color:var(--st-text);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;text-align:center;min-height:96px;transition:transform .15s}
.pic:active{transform:scale(.94)}
.pop .pic{background:rgba(255,255,255,.85);box-shadow:0 3px 10px rgba(22,24,35,.1)}
.pic .em{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:2.1em;line-height:1.15}
.pic .w{font-weight:800;font-size:.84em;line-height:1.15;overflow-wrap:anywhere}
.pic .fr{font-size:.74em;line-height:1.15;color:var(--st-muted);opacity:0;transition:opacity .15s}
.pic.show .fr{opacity:1}
.pic.show{box-shadow:inset 0 0 0 2px var(--cyan)}
.pop .pic.show{box-shadow:inset 0 0 0 2px var(--pink),0 3px 10px rgba(22,24,35,.1)}
.pichint{font-size:.8em;color:var(--st-muted);margin:0 0 12px}
.qem .hook{font-size:clamp(1.3em,6.2vw,1.6em)}
.bigem{display:block;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:3.4em;line-height:1.1;margin-bottom:6px;text-shadow:none}

.brand{display:flex;align-items:center;gap:8px;padding:0 0 0 14px;min-height:24px}
.brand .flag{display:inline-flex;gap:3px;flex:0 0 auto}
.brand .flag i{width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 1px rgba(6,17,43,.18)}
.brand .flag i:nth-child(1){background:#2F6BFF}.brand .flag i:nth-child(2){background:#fff}.brand .flag i:nth-child(3){background:#E8112D}
.brand .bname{font-weight:900;font-size:1.02em;letter-spacing:-.01em;color:var(--st-text);white-space:nowrap}
.brand .bname b{color:var(--pink)}
.brand .bby{margin-left:auto;font-size:.72em;font-weight:800;letter-spacing:.08em;color:var(--st-muted);text-decoration:none;white-space:nowrap;padding-right:6px}
.brand .bby strong{color:var(--st-text)}
.pbrand{padding:0;margin:0 0 10px}
.pbrand .bname{color:var(--text)}
.pbrand .bby{color:var(--muted)}
.pbrand .bby strong{color:var(--text)}
</style>

<script type="application/json" id="data">{"subjects":[{"k":"gr","n":"Grammaire","a":"Gr","h":"grammar","c":"#E8112D"},{"k":"vo","n":"Vocabulaire","a":"Vo","h":"vocab","c":"#1F5BD8"},{"k":"ph","n":"Prononciation","a":"Ph","h":"pronunciation","c":"#7FB8FF"},{"k":"cu","n":"Culture","a":"Cu","h":"culture","c":"#012169"},{"k":"co","n":"Comprendre","a":"Co","h":"listening_reading","c":"#FF6B6B"},{"k":"ex","n":"S’exprimer","a":"Ex","h":"speaking_writing","c":"#9DB4FF"},{"k":"me","n":"Méthode","a":"Mé","h":"methode","c":"#FFFFFF"}],"items":[{"id":"mex1","t":"repere","s":"me","l":"*","tags":["CECRL","niveaux"],"h":"Le CECRL en 1 minute : où tu dois arriver","b":"Le CECRL est l’échelle européenne des langues : A1, A2 (utilisateur élémentaire), B1, B2 (indépendant), C1, C2 (expérimenté). Un « + » veut dire que tu as atteint le niveau suivant dans au moins une activité.\nNiveaux visés en anglais LVA, fin d’année :\n- **6e** : A1+\n- **5e** : A2\n- **4e** : A2+\n- **3e** : B1\n> B1 en fin de 3e = tu te débrouilles seul dans la plupart des situations du quotidien."},{"id":"mex2","t":"methode","s":"me","l":"*","tags":["vocabulaire","mémoire"],"h":"Apprendre ses mots : la méthode qui marche vraiment","b":"1. Apprends le mot **dans une phrase**, pas tout seul : « I’m **thirsty**, can I have some water? »\n2. **Dis-le à voix haute** : un mot que tu ne sais pas prononcer, tu ne le reconnaîtras pas à l’écoute.\n3. Teste-toi **dans les deux sens** : anglais → français, puis français → anglais (le plus dur, et le plus utile).\n4. Reviens dessus le lendemain, puis 3 jours après, puis une semaine après.\n> Lire sa liste dix fois donne l’impression de savoir. Se tester, c’est savoir."},{"id":"mex3","t":"methode","s":"me","l":"*","tags":["verbes irréguliers"],"h":"Les verbes irréguliers : apprends-les par familles","b":"Ils se ressemblent par groupes. Apprends un groupe à la fois :\n- **i / a / u** : sing, sang, sung ; drink, drank, drunk ; swim, swam, swum ; begin, began, begun\n- **-ought / -aught** : buy, bought ; think, thought ; bring, brought ; teach, taught ; catch, caught\n- **trois fois pareil** : cut, cut, cut ; put, put, put ; let, let, let ; hit, hit, hit\n- **-ew / -own** : know, knew, known ; grow, grew, grown ; fly, flew, flown\n> Récite-les en rythme, comme une chanson : base, prétérit, participe passé."},{"id":"mex4","t":"methode","s":"me","l":"*","tags":["mémoire"],"h":"Se tester bat relire","b":"Relire donne l’illusion de savoir. **Se tester** (quiz, flashcards, cacher la traduction, refaire un exercice sans la correction) force ton cerveau à **aller chercher** l’information : c’est ce qui la fixe.\n> Règle : 1/3 du temps à lire ta leçon, 2/3 à te tester."},{"id":"mex5","t":"methode","s":"me","l":"*","tags":["mémoire"],"h":"La répétition espacée","b":"Revois une notion à **J+1, J+3, J+7, J+15, J+30**. Chaque rappel arrive juste avant l’oubli et allonge la mémoire.\nC’est ce que fait la pile « À revoir » de l’appli : marque une carte, elle revient au bon moment."},{"id":"mex6","t":"conseil","s":"me","l":"*","tags":["séries","écoute"],"h":"Séries et vidéos en VO : la méthode sans souffrir","b":"1. Commence par un épisode **que tu as déjà vu** en français : tu connais l’histoire, ton cerveau se concentre sur la langue.\n2. Mets les **sous-titres en anglais**, pas en français.\n3. Mets pause et **répète** une réplique qui te plaît, avec le même ton.\n> 15 minutes par jour valent mieux qu’un film entier une fois par mois."},{"id":"mex7","t":"conseil","s":"me","l":"*","tags":["oral","confiance"],"h":"Oser parler : l’erreur fait partie du jeu","b":"Les programmes officiels le disent : **l’erreur est normale**, elle fait partie de l’apprentissage. Celui qui ne parle jamais ne fait pas d’erreur… et ne progresse pas.\n- Un mot te manque ? Explique-le autrement : « It’s a thing for… », « It’s like a… ».\n- Tu bloques ? Gagne du temps : « Well… », « Let me think… »."},{"id":"mex8","t":"methode","s":"me","l":"*","tags":["cahier","organisation"],"h":"Ton cahier d’anglais, c’est ton meilleur outil","b":"Le cahier garde la **trace** de ce que tu as compris en classe. Pour qu’il serve :\n- Une couleur pour le **vocabulaire**, une pour la **grammaire**.\n- Recopie chaque nouveau mot avec **un exemple**.\n- Avant une évaluation, cache la page et redis ce qu’elle contient."},{"id":"mex9","t":"methode","s":"me","l":"*","tags":["outils","IA"],"h":"Dictionnaire, traducteur, IA : s’en servir sans se faire piéger","b":"- Un traducteur traduit **mot à mot** et se trompe sur le contexte. Vérifie toujours dans un dictionnaire bilingue (WordReference, par exemple) : il donne plusieurs sens et des exemples.\n- Une IA peut inventer des choses. Garde ton **esprit critique** : vérifie ce qu’elle dit.\n- Un texte que tu n’as pas écrit toi-même ne t’apprend rien… et ton professeur le voit."},{"id":"mex10","t":"fiche","s":"me","l":"*","tags":["classroom English","oral"],"h":"Classroom English : les phrases de survie","b":"- **Can you repeat, please?** Tu peux répéter ?\n- **How do you say … in English?** Comment on dit … en anglais ?\n- **What does … mean?** Que veut dire … ?\n- **How do you spell it?** Comment ça s’écrit ?\n- **Sorry, I don’t understand.** Désolé, je ne comprends pas.\n- **Can I go to the toilet, please?** Je peux aller aux toilettes ?\n- **I’ve forgotten my book.** J’ai oublié mon livre.","en":"Can you repeat, please? How do you say this in English? What does it mean? Can I go to the toilet, please? Sorry, I don't understand."},{"id":"mex11","t":"quiz","s":"me","l":"*","tags":["mémoire"],"h":"Quiz","b":"","q":"La technique la plus efficace pour retenir du vocabulaire :","o":["se tester dans les deux sens","relire sa liste dix fois","surligner tous les mots","recopier la leçon"],"a":0,"e":"La récupération active (se tester) est ce qui fixe la mémoire, surtout dans le sens français → anglais."},{"id":"mex12","t":"quiz","s":"me","l":"*","tags":["CECRL"],"h":"Quiz","b":"","q":"Quel niveau du CECRL est visé en fin de 3e (anglais LVA) ?","o":["B1","A1","A2","C1"],"a":0,"e":"A1+ en 6e, A2 en 5e, A2+ en 4e, B1 en 3e."},{"id":"mex13","t":"quiz","s":"me","l":"*","tags":["classroom English"],"h":"Quiz","b":"","q":"Pour demander à quelqu’un de répéter, tu dis…","o":["Can you repeat, please?","Can you repeat me please?","You can repeat?","Do you repeat, please?"],"a":0,"e":"« Can you repeat, please? » : can + base verbale, et « please » pour la politesse.","en":"Can you repeat, please?"},{"id":"mex14","t":"quiz","s":"me","l":"*","tags":["verbes irréguliers"],"h":"Quiz","b":"","q":"Lequel de ces verbes reste identique aux trois formes ?","o":["cut","buy","sing","know"],"a":0,"e":"Cut, cut, cut. Buy, bought, bought ; sing, sang, sung ; know, knew, known."},{"id":"mex15","t":"quiz","s":"me","l":"*","tags":["outils","IA"],"h":"Quiz","b":"","q":"Un traducteur automatique te donne une phrase bizarre. Le bon réflexe :","o":["vérifier les mots dans un dictionnaire bilingue avec des exemples","la recopier telle quelle","demander à un deuxième traducteur et prendre la plus longue","abandonner l’exercice"],"a":0,"e":"Le dictionnaire bilingue donne plusieurs sens et des exemples en contexte : tu choisis le bon."},{"id":"gr61","t":"fiche","s":"gr","l":"6","tags":["be","bases"],"h":"BE au présent : le verbe de base","b":"- I **am** → I’m\n- you **are** → you’re\n- he / she / it **is** → he’s, she’s, it’s\n- we / you / they **are** → we’re, they’re\nNégation : I’m **not**, she **isn’t**, they **aren’t**.\nQuestion : on inverse ! **Are** you French? **Is** he eleven?\n> En anglais, on « est » son âge : I **am** eleven. Jamais « I have eleven ».","en":"I am eleven. You are my friend. She is British. We are in class 6B. They aren't at home. Are you French?"},{"id":"gr62","t":"fiche","s":"gr","l":"6","tags":["have","possession"],"h":"HAVE (GOT) : avoir, posséder, décrire","b":"- I **have** two brothers. / I’**ve got** two brothers.\n- She **has** blue eyes. / She’**s got** blue eyes.\nAvec he, she, it : **has**, jamais « haves ».\nNégation et question :\n> I **don’t have** a pet. / I **haven’t got** a pet.\n> **Do** you **have** a pet? / **Have** you **got** a pet?","en":"I have two brothers. She has got blue eyes. Do you have a pet? He hasn't got a phone."},{"id":"gr63","t":"fiche","s":"gr","l":"6","tags":["présent simple"],"h":"Le présent simple : habitudes, goûts, vérités","b":"Il sert à parler de ce que tu fais **d’habitude**, de ce que tu aimes, de ce qui est toujours vrai.\n> I **play** football every Saturday.\n> She **plays** the piano.\n> The Earth **goes** around the Sun.\nMots qui l’accompagnent : every day, on Mondays, usually, often, sometimes, never.","en":"I play football every Saturday. She plays the piano. They live in London."},{"id":"gr64","t":"piege","s":"gr","l":"6","tags":["présent simple","3e personne"],"h":"He, she, it… S !","b":"Avec **he, she, it** (ou un nom singulier), le verbe prend un **-s** au présent simple.\n- he play**s**, she like**s**\n- après -s, -sh, -ch, -x, -o : **-es** → she watche**s**, he go**es**, it fix**es**\n- consonne + y : **-ies** → it fl**ies**, she stud**ies**\n> Moyen mnémo : « He, she, it, le S y tient. »","en":"He goes to school by bus. She watches TV. It flies. My dad works in Perpignan."},{"id":"gr65","t":"fiche","s":"gr","l":"6","tags":["présent simple","questions"],"h":"DO / DOES : poser une question, dire non","b":"- Négation : I **don’t** like spinach. She **doesn’t** like spinach.\n- Question : **Do** you play the guitar? **Does** she live in London?\n- Réponse courte : Yes, she **does**. / No, she **doesn’t**.\n> Avec does, le -s est déjà dans l’auxiliaire : Does she **live**… ? She doesn’t **live**… (pas de -s sur le verbe !)","en":"I don't like spinach. Does she live in London? Yes, she does. Do you play the guitar?"},{"id":"gr66","t":"fiche","s":"gr","l":"6","tags":["modaux"],"h":"CAN et MUST : pouvoir et devoir","b":"- **can** = savoir / pouvoir / avoir le droit : I **can** swim. Can I open the window?\n- **can’t** = ne pas pouvoir / interdit : You **can’t** use your phone.\n- **must** = obligation : You **must** wear a uniform.\n- **mustn’t** = interdiction : You **mustn’t** run.\n> Ils ne prennent **jamais de -s**, **jamais de to** après : she can swim (pas « cans », pas « can to swim »).","en":"I can swim. You can't use your phone. You must wear a uniform. You mustn't run in the corridor."},{"id":"gr67","t":"fiche","s":"gr","l":"6","tags":["impératif","consignes"],"h":"L’impératif : les consignes de classe","b":"On prend la base verbale, sans sujet :\n> **Open** your book! **Listen!** **Come** to the board!\nPour interdire : **Don’t** + verbe → **Don’t** forget your homework!\nPour proposer : **Let’s** + verbe → **Let’s** go!\nPanneaux : **No** running! **No** cheating! (no + verbe en -ing)","en":"Open your book! Listen! Don't forget your homework! Let's go!"},{"id":"gr68","t":"fiche","s":"gr","l":"6","tags":["be + ing"],"h":"BE + -ING : ce qui se passe en ce moment","b":"BE + verbe en **-ing** : l’action est **en cours**.\n> Look! The baby **is sleeping**.\n> I**’m reading** a book right now.\nIl sert aussi pour un **projet tout proche** : I**’m visiting** my gran this weekend.\nMots repères : now, right now, at the moment, Look! Listen!","en":"Look! The baby is sleeping. I'm reading a book. They are making a blueberry pie. I'm visiting my gran this weekend."},{"id":"gr69","t":"fiche","s":"gr","l":"6","tags":["there is","there are"],"h":"THERE IS / THERE ARE : il y a","b":"- **There is** + singulier : There is a dragon in the castle.\n- **There are** + pluriel : There are two cats in the garden.\n- Négation : There **isn’t** a pool. There **aren’t** any shops.\n- Question : **Is there** a library? **Are there** any parks?","en":"There is a dragon in the castle. There are two cats in the garden. Is there a library?"},{"id":"gr610","t":"fiche","s":"gr","l":"6","tags":["pluriels"],"h":"Les pluriels irréguliers à connaître","b":"Règle générale : **-s** (a cat → cats). Mais :\n- child → **children** ; man → **men** ; woman → **women**\n- foot → **feet** ; tooth → **teeth** ; mouse → **mice**\n- person → **people**\n- knife → **knives** ; wolf → **wolves**\n- box → **boxes** ; witch → **witches** (-es après s, x, ch, sh)\n> « People » est déjà un pluriel : people **are** nice.","en":"One child, two children. One man, two men. One foot, two feet. One mouse, three mice. A person, many people."},{"id":"gr611","t":"fiche","s":"gr","l":"6","tags":["possessifs"],"h":"My, your, his, her… : à qui c’est ?","b":"- I → **my** ; you → **your**\n- he → **his** (à lui) ; she → **her** (à elle) ; it → **its**\n- we → **our** ; they → **their**\n> Tom and **his** sister. Lisa and **her** brother.\nLe possessif s’accorde avec le **propriétaire**, pas avec l’objet. C’est l’inverse du français !","en":"This is Tom. His dog is called Max. This is Lisa. Her cat is black. Their house is big."},{"id":"gr612","t":"fiche","s":"gr","l":"6","tags":["génitif"],"h":"Le génitif ’s : la possession","b":"Propriétaire + **’s** + objet :\n> **Harry’s** wand = la baguette de Harry\n- Pluriel en -s : on ajoute juste l’apostrophe → the girls**’** bags\n- Deux propriétaires ensemble : Tom and Sarah**’s** house\n> On ne dit pas « the wand of Harry ». C’est le possesseur qui passe devant.","en":"This is Harry's wand. My sister's friend. The girls' bags. Tom and Sarah's house."},{"id":"gr613","t":"fiche","s":"gr","l":"6","tags":["pronoms"],"h":"Les pronoms : sujet, complément, possessif","b":"- Sujet : I, you, he, she, it, we, they\n- Complément : me, you, **him**, **her**, it, us, **them**\n- Possessif : **mine**, yours, his, hers, ours, theirs\n> **She** helps **me**. I like **him**. This pen is **mine**.","en":"I like him. She helps me. This book is mine. Is it yours?"},{"id":"gr614","t":"fiche","s":"gr","l":"6","tags":["questions"],"h":"Les mots interrogatifs","b":"- **What** : quoi, quel → What’s your name?\n- **Who** : qui → Who is she?\n- **Where** : où → Where do you live?\n- **When** : quand → When is your birthday?\n- **Why** : pourquoi → Why are you sad?\n- **How** : comment → How are you?\n- **How old** (âge), **How many** (combien, + pluriel), **Which** (lequel)","en":"What's your name? Where do you live? How old are you? Who is she? When is your birthday? Why are you sad?"},{"id":"gr615","t":"fiche","s":"gr","l":"6","tags":["adjectifs"],"h":"L’adjectif : toujours avant le nom, jamais de -s","b":"> a **big black** dog ; two **funny** monkeys\n- Il se place **avant** le nom.\n- Il ne s’accorde **jamais** : two funny**s** monkeys est faux.\n- Plusieurs adjectifs : l’opinion avant la taille, la taille avant la couleur → a **beautiful big red** car.","en":"A big black dog. A beautiful old castle. Two funny little monkeys."},{"id":"gr616","t":"fiche","s":"gr","l":"6","tags":["articles"],"h":"A ou AN ? C’est le son qui décide","b":"- **a** devant un **son** consonne : a cat, a **u**niform (on dit « you »)\n- **an** devant un **son** voyelle : an apple, an elephant, an **h**our (h muet)\n> C’est la prononciation qui compte, pas la lettre écrite.","en":"A cat, an apple, an hour, a uniform, an elephant."},{"id":"gr617","t":"fiche","s":"gr","l":"6","tags":["heure"],"h":"Dire l’heure","b":"- 7:00 → It’s seven **o’clock**.\n- 2:30 → It’s **half past** two. (ou two thirty)\n- 3:15 → It’s a **quarter past** three.\n- 4:45 → It’s a **quarter to** five.\n- 5:50 → It’s ten **to** six. / 6:10 → It’s ten **past** six.\n> **past** = après l’heure, **to** = avant l’heure suivante.","en":"It's seven o'clock. It's half past two. It's a quarter past three. It's a quarter to five. It's ten to six."},{"id":"gr618","t":"fiche","s":"gr","l":"6","tags":["dates","prépositions"],"h":"Dates et prépositions de temps","b":"- **at** + heure : at seven, at half past two\n- **on** + jour / date : on Monday, on the 5th of May\n- **in** + mois, saison, année : in June, in winter, in 2026\nOrdinaux : 1st **first**, 2nd **second**, 3rd **third**, 4th fourth, 5th **fifth**, 12th **twelfth**, 21st twenty-first.\n> Jours et mois prennent une **majuscule** : Monday, June.","en":"Today is Monday, the third of June. My birthday is on the fifth of May. I get up at seven. In 2026."},{"id":"gr619","t":"fiche","s":"gr","l":"6","tags":["prétérit","passé"],"h":"Reconnaître le passé (prétérit)","b":"- BE au passé : I / he / she **was** ; you / we / they **were**.\n- Verbes réguliers : + **-ed** → I play**ed**, we visit**ed**.\n- Quelques irréguliers fréquents : go → **went**, see → **saw**, do → **did**, have → **had**.\n> Mots repères : yesterday, last weekend, last year.","en":"I was in London. They were happy. I played rugby. I went to the cinema. I saw my friends."},{"id":"gr620","t":"fiche","s":"gr","l":"6","tags":["goûts"],"h":"Dire ce que tu aimes (ou pas)","b":"Du plus positif au plus négatif :\n- I **love** / I **really like** / I’m **fond of**\n- I **like**\n- I **don’t really like**\n- I **hate** / I **can’t stand**\nAprès ces verbes : un nom (I like **pizza**) ou un verbe en **-ing** (I love **dancing**).\n> What’s your **favourite** colour? (favourite en anglais britannique, favorite en américain)","en":"I love dancing. I like reading. I don't like football. I hate spinach. I can't stand Christmas carols. My favourite singer is…"},{"id":"gr621","t":"fiche","s":"gr","l":"6","tags":["connecteurs"],"h":"Les petits mots qui relient tes phrases","b":"- **and** (et), **but** (mais), **or** (ou)\n- **because** (parce que), **so** (donc)\n- **first**, **then**, **finally** (d’abord, ensuite, enfin)\n- **for example**, **like** (par exemple, comme)\n> Un texte avec des connecteurs, c’est un texte qui se lit facilement… et qui rapporte des points.","en":"I like cats and dogs. I like tea but I don't like coffee. First, then, finally."},{"id":"gr622","t":"quiz","s":"gr","l":"6","tags":["be"],"h":"Quiz","b":"","q":"She ___ eleven.","o":["is","are","am","has"],"a":0,"e":"Avec she : is. Et on « est » son âge en anglais.","en":"She is eleven."},{"id":"gr623","t":"quiz","s":"gr","l":"6","tags":["présent simple"],"h":"Quiz","b":"","q":"My brother ___ football every Saturday.","o":["plays","play","playing","is play"],"a":0,"e":"« My brother » = he → -s au présent simple : plays.","en":"My brother plays football every Saturday."},{"id":"gr624","t":"quiz","s":"gr","l":"6","tags":["présent simple","questions"],"h":"Quiz","b":"","q":"___ your sister like pizza?","o":["Does","Do","Is","Are"],"a":0,"e":"Your sister = she → auxiliaire does, puis base verbale like.","en":"Does your sister like pizza?"},{"id":"gr625","t":"quiz","s":"gr","l":"6","tags":["présent simple"],"h":"Quiz","b":"","q":"He doesn’t ___ in London.","o":["live","lives","living","to live"],"a":0,"e":"Après doesn’t, le verbe reste à la base verbale : le -s est déjà dans does.","en":"He doesn't live in London."},{"id":"gr626","t":"quiz","s":"gr","l":"6","tags":["modaux"],"h":"Quiz","b":"","q":"You ___ run in the corridor. It’s dangerous!","o":["mustn’t","can","must","don’t must"],"a":0,"e":"Mustn’t exprime l’interdiction. « Don’t must » n’existe pas.","en":"You mustn't run in the corridor. It's dangerous!"},{"id":"gr627","t":"quiz","s":"gr","l":"6","tags":["pluriels"],"h":"Quiz","b":"","q":"Le pluriel de « child » est…","o":["children","childs","childrens","childes"],"a":0,"e":"Child → children, un pluriel irrégulier à savoir par cœur."},{"id":"gr628","t":"quiz","s":"gr","l":"6","tags":["génitif"],"h":"Quiz","b":"","q":"« La baguette de Harry » se dit…","o":["Harry’s wand","the wand of Harry","Harry wand","the Harry’s wand"],"a":0,"e":"Possesseur + ’s + objet, sans « the » devant le possesseur."},{"id":"gr629","t":"quiz","s":"gr","l":"6","tags":["be + ing"],"h":"Quiz","b":"","q":"Shh! The baby ___ .","o":["is sleeping","sleeps","sleep","are sleeping"],"a":0,"e":"L’action est en cours : BE + -ing. The baby = it → is.","en":"Shh! The baby is sleeping."},{"id":"gr630","t":"quiz","s":"gr","l":"6","tags":["there is","there are"],"h":"Quiz","b":"","q":"___ two cats in the garden.","o":["There are","There is","It is","They is"],"a":0,"e":"Deux chats = pluriel → there are.","en":"There are two cats in the garden."},{"id":"gr631","t":"quiz","s":"gr","l":"6","tags":["articles"],"h":"Quiz","b":"","q":"Complète : I eat ___ orange every day.","o":["an","a","ans","un"],"a":0,"e":"« Orange » commence par un son voyelle : an orange.","en":"I eat an orange every day."},{"id":"gr632","t":"quiz","s":"gr","l":"6","tags":["heure"],"h":"Quiz","b":"","q":"2:45, c’est…","o":["It’s a quarter to three.","It’s a quarter past two.","It’s half past two.","It’s three to quarter."],"a":0,"e":"Il reste un quart d’heure avant trois heures : a quarter to three.","en":"It's a quarter to three."},{"id":"gr633","t":"quiz","s":"gr","l":"6","tags":["possessifs"],"h":"Quiz","b":"","q":"This is Lisa. ___ dog is called Max.","o":["Her","His","She","Its"],"a":0,"e":"Le chien appartient à Lisa (une fille) : her dog.","en":"This is Lisa. Her dog is called Max."},{"id":"gr634","t":"quiz","s":"gr","l":"6","tags":["questions"],"h":"Quiz","b":"","q":"« ___ do you live? — In Perpignan. »","o":["Where","What","Who","When"],"a":0,"e":"On répond par un lieu : where.","en":"Where do you live? — In Perpignan."},{"id":"gr635","t":"quiz","s":"gr","l":"6","tags":["goûts"],"h":"Quiz","b":"","q":"I love ___ comics.","o":["reading","read","reads","readed"],"a":0,"e":"Après love, like, hate : verbe en -ing.","en":"I love reading comics."},{"id":"gr636","t":"quiz","s":"gr","l":"6","tags":["prétérit"],"h":"Quiz","b":"","q":"Yesterday, I ___ to the cinema.","o":["went","go","goes","goed"],"a":0,"e":"Yesterday = passé. Go est irrégulier : went.","en":"Yesterday, I went to the cinema."},{"id":"vo61","t":"fiche","s":"vo","l":"6","tags":["famille"],"h":"La famille","b":"- mother, father → **parents**\n- brother, sister → **siblings** (frères et sœurs)\n- grandmother, grandfather → **grandparents**\n- uncle (oncle), aunt (tante), cousin\n- son (fils), daughter (fille), child / **children**\n> Do you have any brothers or sisters? — Yes, I have one sister.","en":"This is my family. My mother, my father, my brother and my sister. My grandparents. My uncle and my aunt. My cousins.","p":[["👩","mother","mère"],["👨","father","père"],["👦","brother","frère"],["👧","sister","sœur"],["👵","grandmother","grand-mère"],["👴","grandfather","grand-père"],["👶","baby","bébé"],["👪","family","famille"]]},{"id":"vo62","t":"fiche","s":"vo","l":"6","tags":["apparence"],"h":"Décrire l’apparence","b":"- Taille : **tall** (grand), **short** (petit)\n- Cheveux : long / short, **curly** (frisés), **wavy** (ondulés), **straight** (raides), blond, brown, red\n- Visage : blue eyes, **freckles** (taches de rousseur), a beard, **glasses**\n> She has got **long curly** hair. Ordre : longueur, forme, couleur, puis hair (toujours au singulier !).","en":"He is tall. She has got long curly hair. He has got short black hair and blue eyes. She has got freckles. He wears glasses.","p":[["🧍","tall","grand"],["👱","blond hair","cheveux blonds"],["👩‍🦱","curly hair","cheveux frisés"],["👨‍🦰","red hair","cheveux roux"],["🧔","a beard","une barbe"],["👓","glasses","lunettes"],["👁️","eyes","yeux"],["👩‍🦳","white hair","cheveux blancs"]]},{"id":"vo63","t":"fiche","s":"vo","l":"6","tags":["vêtements"],"h":"Les vêtements","b":"- t-shirt, shirt (chemise), **jumper** / pullover (pull), coat (manteau), jacket (veste)\n- **trousers** (pantalon UK), **pants** (pantalon US… et slip en UK !), jeans, skirt (jupe), dress (robe)\n- **trainers** (baskets UK) = **sneakers** (US), shoes, boots, socks, cap, hat\n> I’m **wearing** a uniform : wear = porter un vêtement.","en":"I'm wearing jeans, a t-shirt and trainers. A school uniform with a tie and a jumper.","p":[["👕","T-shirt","tee-shirt"],["👖","jeans","jean"],["👗","dress","robe"],["🧥","coat","manteau"],["👟","trainers","baskets"],["🧦","socks","chaussettes"],["🧢","cap","casquette"],["👔","shirt and tie","chemise et cravate"],["👢","boots","bottes"]]},{"id":"vo64","t":"fiche","s":"vo","l":"6","tags":["routine"],"h":"La routine du quotidien","b":"- **wake up** (se réveiller), **get up** (se lever)\n- have a shower, have breakfast / lunch / dinner\n- brush my teeth, get dressed\n- go to school, do my homework\n- **go to bed** (se coucher)\n> On dit « have breakfast », pas « eat breakfast » dans la routine.","en":"I wake up at seven. I get up, I have a shower and I have breakfast. I brush my teeth. I go to school. I do my homework. I go to bed at nine.","p":[["⏰","wake up","se réveiller"],["🚿","have a shower","prendre une douche"],["🥣","have breakfast","petit-déjeuner"],["🪥","brush my teeth","se brosser les dents"],["🚌","go to school","aller à l’école"],["📝","do my homework","faire mes devoirs"],["🛏️","go to bed","se coucher"],["😴","sleep","dormir"]]},{"id":"vo65","t":"fiche","s":"vo","l":"6","tags":["nourriture"],"h":"La nourriture et les repas","b":"- **breakfast** (petit-déjeuner), **lunch** (déjeuner), **dinner** (dîner)\n- fruit : apple, pear, banana, strawberry ; vegetables : carrot, tomato, peas\n- meat, fish, chicken, bread, cheese, eggs, cake\n- I’m **hungry** (j’ai faim) / I’m **thirsty** (j’ai soif)\n> **packed lunch** : le repas qu’on apporte à l’école dans une lunch box.","en":"I'm hungry. I'm thirsty. For breakfast, I have cereal and orange juice. A packed lunch. Baked beans.","p":[["🍎","apple","pomme"],["🍐","pear","poire"],["🍌","banana","banane"],["🍓","strawberry","fraise"],["🥕","carrot","carotte"],["🍞","bread","pain"],["🧀","cheese","fromage"],["🥚","eggs","œufs"],["🍗","chicken","poulet"],["🐟","fish","poisson"],["🍰","cake","gâteau"],["🥤","drink","boisson"]]},{"id":"vo66","t":"fiche","s":"vo","l":"6","tags":["maison"],"h":"La maison","b":"- house, **flat** (appartement UK) = apartment (US)\n- **semi-detached house** (maison jumelée, très courante au Royaume-Uni), terraced house (maison mitoyenne en rangée)\n- kitchen, **living room**, bedroom, bathroom, garden\n- **neighbour** (voisin), neighbourhood (quartier)","en":"I live in a semi-detached house. There is a kitchen, a living room and three bedrooms. We have a garden.","p":[["🏠","house","maison"],["🏢","flat","appartement"],["🛏️","bedroom","chambre"],["🛁","bathroom","salle de bains"],["🍳","kitchen","cuisine"],["🛋️","living room","salon"],["🌳","garden","jardin"],["🚪","door","porte"],["🪟","window","fenêtre"]]},{"id":"vo67","t":"fiche","s":"vo","l":"6","tags":["émotions"],"h":"Les émotions","b":"- happy, sad, **angry** (en colère), **scared** / afraid (qui a peur), tired, surprised, bored\n- I’m scared **of** spiders.\n- Réactions : Great! Wonderful! I’m glad! **What a shame!** (dommage !)\n> How are you? — I’m fine, thanks. / I’m so so. / I’m tired.","en":"I'm happy. She is sad. He is angry. I'm scared of spiders. I'm tired. What a shame!","p":[["😀","happy","content"],["😢","sad","triste"],["😠","angry","en colère"],["😨","scared","effrayé"],["😴","tired","fatigué"],["😲","surprised","surpris"],["🥱","bored","qui s’ennuie"],["😍","in love","amoureux"]]},{"id":"vo68","t":"fiche","s":"vo","l":"6","tags":["loisirs"],"h":"Les loisirs","b":"- **play** + sport : play tennis, play football\n- **play the** + instrument : play **the** guitar, play **the** piano\n- **go** + activité en -ing : go swimming, go horse-riding\n- listen **to** music, read, draw, dance\n> **at the weekend** (UK) = on the weekend (US). Once a week = une fois par semaine.","en":"In my free time, I play tennis, I listen to music and I go swimming. I play the guitar.","p":[["⚽","play football","jouer au foot"],["🎾","play tennis","jouer au tennis"],["🎸","play the guitar","jouer de la guitare"],["🎹","play the piano","jouer du piano"],["🏊","go swimming","nager"],["🐎","go horse-riding","faire du cheval"],["🎧","listen to music","écouter de la musique"],["📚","read","lire"],["🎨","draw","dessiner"],["💃","dance","danser"]]},{"id":"vo69","t":"fiche","s":"vo","l":"6","tags":["animaux"],"h":"Les animaux","b":"- Domestiques : dog, cat, rabbit, **guinea pig** (cochon d’Inde), hamster, horse\n- Ferme : cow, sheep (invariable !), pig, hen (poule)\n- Sauvages : lion, zebra, giraffe, **owl** (hibou), fox (renard), snake, tiger, rhino\n> Do you have any **pets**? — Yes, a cat. (pet = animal de compagnie)","en":"A dog, a cat, a rabbit, a horse, a hamster. Wild animals: a lion, a zebra, a giraffe, an owl, a fox.","p":[["🐶","dog","chien"],["🐱","cat","chat"],["🐰","rabbit","lapin"],["🐴","horse","cheval"],["🐹","hamster","hamster"],["🐄","cow","vache"],["🐑","sheep","mouton"],["🐷","pig","cochon"],["🐔","hen","poule"],["🦁","lion","lion"],["🦓","zebra","zèbre"],["🦒","giraffe","girafe"],["🦉","owl","hibou"],["🦊","fox","renard"],["🐍","snake","serpent"],["🦏","rhino","rhinocéros"]]},{"id":"vo610","t":"quiz","s":"vo","l":"6","tags":["famille"],"h":"Quiz","b":"","q":"Le frère de ta mère, c’est ton…","o":["uncle","aunt","cousin","nephew"],"a":0,"e":"Uncle = oncle. Aunt = tante."},{"id":"vo611","t":"quiz","s":"vo","l":"6","tags":["vêtements"],"h":"Quiz","b":"","q":"Au Royaume-Uni, « trainers », ce sont…","o":["des baskets","des entraîneurs de foot","des trains","des chaussettes"],"a":0,"e":"Trainers (UK) = sneakers (US) = baskets."},{"id":"vo612","t":"quiz","s":"vo","l":"6","tags":["apparence"],"h":"Quiz","b":"","q":"« Freckles », ce sont…","o":["des taches de rousseur","des lunettes","des cheveux frisés","des boucles d’oreilles"],"a":0,"e":"She has got freckles = elle a des taches de rousseur."},{"id":"vo613","t":"quiz","s":"vo","l":"6","tags":["nourriture"],"h":"Quiz","b":"","q":"« I’m thirsty » veut dire…","o":["J’ai soif.","J’ai faim.","J’ai trente ans.","J’ai froid."],"a":0,"e":"Thirsty = soif ; hungry = faim. Attention : thirty = trente."},{"id":"vo614","t":"quiz","s":"vo","l":"6","tags":["routine"],"h":"Quiz","b":"","q":"« Se lever » se dit…","o":["get up","wake up","go to bed","stand down"],"a":0,"e":"Wake up = se réveiller ; get up = sortir du lit."},{"id":"vo615","t":"quiz","s":"vo","l":"6","tags":["loisirs"],"h":"Quiz","b":"","q":"I play ___ guitar.","o":["the","a","Ø (rien)","to"],"a":0,"e":"Instrument : play the guitar. Sport : play football, sans the.","en":"I play the guitar."},{"id":"vo616","t":"quiz","s":"vo","l":"6","tags":["dates"],"h":"Quiz","b":"","q":"Quelle phrase est bien écrite ?","o":["My birthday is on Monday, the 3rd of June.","My birthday is on monday, the 3rd of june.","My birthday is in Monday, the 3 of June.","My birthday is at Monday, the third June."],"a":0,"e":"Majuscule aux jours et mois, et « on » devant un jour.","en":"My birthday is on Monday, the 3rd of June."},{"id":"vo617","t":"quiz","s":"vo","l":"6","tags":["émotions"],"h":"Quiz","b":"","q":"« I’m scared of spiders » : la personne…","o":["a peur des araignées","adore les araignées","collectionne les araignées","est en colère contre les araignées"],"a":0,"e":"Scared of = qui a peur de."},{"id":"ph61","t":"fiche","s":"ph","l":"6","tags":["-s final"],"h":"Le -s final : 3 prononciations","b":"- **/s/** après un son sourd (p, t, k, f) : looks, cats, Jack’s\n- **/z/** après un son voisé : plays, dogs, goes, Jane’s\n- **/ɪz/** après s, z, sh, ch, x : watches, witches, boxes\n> Vaut pour la 3e personne (she watches), le pluriel (witches) et le génitif (Jack’s).","en":"He looks. She plays. He watches. Cats. Dogs. Witches. Jack's bike. Jane's book."},{"id":"ph62","t":"fiche","s":"ph","l":"6","tags":["accent de mot"],"h":"L’accent de mot : la syllabe qui frappe","b":"En anglais, une syllabe est **plus forte** que les autres. Si tu la mets au mauvais endroit, on ne te comprend pas.\n- **FA**vourite, **BEAU**tiful, **E**lephant\n- ba**NA**na, com**PU**ter, ho**TEL**\nLes syllabes faibles se réduisent souvent en **/ə/**, le son « eu » très léger : banana /bəˈnɑːnə/.\n> Dans le dictionnaire, l’apostrophe ˈ se place juste avant la syllabe accentuée.","en":"Favourite. Beautiful. Banana. Computer. Elephant. Hotel."},{"id":"ph63","t":"fiche","s":"ph","l":"6","tags":["lettres muettes"],"h":"Les lettres muettes","b":"- **gh** : light, night, daughter\n- **k** devant n : knife, know, knee\n- **w** devant r : write, wrong\n- **n** final après m : autumn\n- autres : Wed**n**esday /ˈwenzdeɪ/, i**s**land, lis**t**en, **h**our","en":"Light. Night. Autumn. Wednesday. Knife. Know. Write. Island. Listen."},{"id":"ph64","t":"fiche","s":"ph","l":"6","tags":["diphtongues"],"h":"Les diphtongues : deux sons qui glissent","b":"Une diphtongue = une voyelle qui glisse vers une autre :\n- **/eɪ/** day, name, play\n- **/aɪ/** my, time, ice\n- **/ɔɪ/** boy, toy\n- **/əʊ/** go, home, phone\n- **/aʊ/** now, house\n- **/ɪə/** here, **/eə/** hair\n> « Name » ne se dit pas « nam » : /neɪm/.","en":"Day. My. Boy. Go. Now. Here. Hair."},{"id":"ph65","t":"piege","s":"ph","l":"6","tags":["h"],"h":"Le H se prononce !","b":"En anglais, le **h** est presque toujours **soufflé** : **h**ello, **h**appy, **h**ouse, **h**amster.\n> Entraîne-toi : souffle sur ta main en disant « house ». Tu dois sentir l’air.\nExceptions où il est muet : **h**our, **h**onest, **h**onour → d’où **an** hour.","en":"Hello! Happy, house, horse, hamster. An hour. An honest boy."},{"id":"ph66","t":"quiz","s":"ph","l":"6","tags":["-s final"],"h":"Quiz","b":"","q":"Le -s de « watches » se prononce…","o":["/ɪz/","/s/","/z/","il ne se prononce pas"],"a":0,"e":"Après -ch, -sh, -s, -x : on ajoute une syllabe /ɪz/."},{"id":"ph67","t":"quiz","s":"ph","l":"6","tags":["lettres muettes"],"h":"Quiz","b":"","q":"Quelle lettre est muette dans « knife » ?","o":["k","n","f","i"],"a":0,"e":"Devant n, le k ne se prononce pas : knife, know, knee."},{"id":"ph68","t":"quiz","s":"ph","l":"6","tags":["accent de mot"],"h":"Quiz","b":"","q":"Dans « banana », la syllabe accentuée est…","o":["la 2e : ba-NA-na","la 1re : BA-na-na","la 3e : ba-na-NA","aucune"],"a":0,"e":"ba-NA-na : les deux autres syllabes se réduisent en /ə/."},{"id":"ph69","t":"quiz","s":"ph","l":"6","tags":["h"],"h":"Quiz","b":"","q":"Dans quel mot le h est-il muet ?","o":["hour","house","happy","hello"],"a":0,"e":"Hour /ˈaʊə/ : d’où « an hour »."},{"id":"cu61","t":"repere","s":"cu","l":"6","tags":["pays","capitales"],"h":"Le monde anglophone : les pays et leurs capitales","b":"- **United Kingdom** : London\n- **Ireland** : Dublin\n- **United States** : Washington, D.C.\n- **Canada** : Ottawa\n- **Australia** : Canberra (pas Sydney !)\n- **New Zealand** : Wellington\n- **India** : New Delhi\n- **Kenya** : Nairobi\n> L’anglais est langue officielle dans plus de 50 pays, sur tous les continents."},{"id":"cu62","t":"fiche","s":"cu","l":"6","tags":["Royaume-Uni"],"h":"Le Royaume-Uni, c’est 4 nations","b":"- **England** : London\n- **Scotland** : Edinburgh\n- **Wales** (pays de Galles) : Cardiff\n- **Northern Ireland** : Belfast\n> **Great Britain** = l’île (Angleterre, Écosse, pays de Galles). **United Kingdom** = Great Britain + l’Irlande du Nord.","en":"England, Scotland, Wales and Northern Ireland. London, Edinburgh, Cardiff and Belfast."},{"id":"cu63","t":"fiche","s":"cu","l":"6","tags":["école","axe 2"],"h":"Axe 2 : l’école au Royaume-Uni","b":"- L’**uniforme** est la règle : blazer, cravate (**tie**), jupe ou pantalon.\n- En entrant au collège, à 11 ans, on est en **Year 7** (≈ 6e).\n- Beaucoup d’écoles ont des **houses** : des équipes qui gagnent des points toute l’année… comme à Hogwarts.\n- Le midi : cantine ou **packed lunch**.","en":"I'm in Year 7. We wear a uniform. My house is Gryffindor."},{"id":"cu64","t":"fiche","s":"cu","l":"6","tags":["paysages","axe 3"],"h":"Axe 3 : pays et paysages","b":"- **Les Highlands** (Écosse) : montagnes, lacs (**lochs**) et le **Ben Nevis**, plus haut sommet du Royaume-Uni (1 345 m). Loch Ness et son monstre « Nessie ».\n- **Le Mississippi** : un des plus grands fleuves d’Amérique du Nord, il coule jusqu’au golfe du Mexique. Mark Twain y a navigué.\n- **Kenya** : le **Nairobi National Park** est juste à côté de la capitale ; on y voit girafes, zèbres et rhinocéros noirs, une espèce menacée.","en":"The Scottish Highlands. Ben Nevis. Loch Ness. The Mississippi River."},{"id":"cu65","t":"fiche","s":"cu","l":"6","tags":["légendes","axe 4"],"h":"Axe 4 : dragons, géants et légendes","b":"- **Le dragon rouge** (Y Ddraig Goch) est sur le **drapeau du pays de Galles**.\n- **Finn McCool**, géant légendaire d’Irlande : il aurait construit la **Giant’s Causeway**, une côte d’environ 40 000 colonnes de basalte, en Irlande du Nord.\n- **Leprechaun** : petit lutin irlandais qui cache un chaudron d’or au pied de l’arc-en-ciel.\n- **Dr. Seuss** : auteur américain aux rimes folles, The Cat in the Hat (1957).","en":"Finn McCool is a giant. He builds the Giant's Causeway. A leprechaun. A dragon."},{"id":"cu66","t":"fiche","s":"cu","l":"6","tags":["personnages","axe 1"],"h":"Axe 1 : personnes et personnages","b":"- **Paddington** : ours venu du **Pérou**, trouvé à la gare de Paddington à Londres, fan de **marmalade**. Créé par Michael Bond en 1958.\n- **Harry Potter** : sorcier imaginé par J. K. Rowling (premier livre en 1997), élève à Hogwarts.\n- **Sherlock Holmes**, **Peter Pan**, **Alice** : d’autres héros britanniques nés dans les livres.","en":"Paddington Bear comes from Peru. He loves marmalade. Harry Potter is a wizard."},{"id":"cu67","t":"fiche","s":"cu","l":"6","tags":["fêtes","axe 5"],"h":"Axe 5 : Noël à la britannique","b":"- **Christmas crackers** : on tire à deux sur un tube en carton qui claque ; dedans, une couronne en papier, une blague et un petit cadeau.\n- **Christmas pudding** et **mince pies** au dessert.\n- Les enfants accrochent des **stockings** (chaussettes) pour les cadeaux.\n- **Boxing Day** : le **26 décembre**, jour férié.\n- Le **Grinch**, personnage de Dr. Seuss, déteste Noël.","en":"Merry Christmas! Christmas crackers. Christmas pudding. Boxing Day.","p":[["🎄","Christmas tree","sapin de Noël"],["🎁","presents","cadeaux"],["🧦","stocking","chaussette"],["🎅","Father Christmas","le père Noël"],["⭐","star","étoile"],["🦌","reindeer","renne"],["🔔","bells","cloches"],["⛄","snowman","bonhomme de neige"]]},{"id":"cu68","t":"fiche","s":"cu","l":"6","tags":["fêtes"],"h":"Les autres fêtes à connaître","b":"- **Halloween** : 31 octobre, « Trick or treat! »\n- **Bonfire Night** : 5 novembre au Royaume-Uni, feux d’artifice pour se souvenir du complot de Guy Fawkes contre le Parlement (1605).\n- **Thanksgiving** : 4e jeudi de novembre aux États-Unis, dinde en famille.\n- **St Patrick’s Day** : 17 mars, fête de l’Irlande, tout en vert.","en":"Happy Halloween! Trick or treat! Bonfire Night. Thanksgiving. St Patrick's Day.","p":[["🎃","pumpkin","citrouille"],["👻","Halloween","Halloween"],["🍬","trick or treat","un bonbon ou un sort"],["🎆","fireworks","feux d’artifice"],["🔥","bonfire","feu de joie"],["🦃","turkey","dinde"],["☘️","shamrock","trèfle"],["🐰","Easter bunny","lapin de Pâques"]]},{"id":"cu69","t":"fiche","s":"cu","l":"6","tags":["musique","axe 5"],"h":"Supercalifragilisticexpialidocious","b":"Ce mot géant vient de la chanson du film **Mary Poppins** (1964), d’après les livres de P. L. Travers. Il ne veut rien dire… sauf « génial » !\nL’anglais adore jouer avec les sons : rimes, comptines (**nursery rhymes**), virelangues (**tongue twisters**) comme « She sells seashells by the seashore ».","en":"Supercalifragilisticexpialidocious!"},{"id":"cu610","t":"quiz","s":"cu","l":"6","tags":["Royaume-Uni"],"h":"Quiz","b":"","q":"La capitale de l’Écosse est…","o":["Edinburgh","Glasgow","Cardiff","Dublin"],"a":0,"e":"Edinburgh. Cardiff est la capitale du pays de Galles, Dublin celle de l’Irlande."},{"id":"cu611","t":"quiz","s":"cu","l":"6","tags":["pays","capitales"],"h":"Quiz","b":"","q":"La capitale de l’Australie est…","o":["Canberra","Sydney","Melbourne","Wellington"],"a":0,"e":"Canberra. Wellington est la capitale de la Nouvelle-Zélande."},{"id":"cu612","t":"quiz","s":"cu","l":"6","tags":["fêtes"],"h":"Quiz","b":"","q":"Boxing Day, c’est le…","o":["26 décembre","24 décembre","31 octobre","5 novembre"],"a":0,"e":"Le lendemain de Noël, jour férié au Royaume-Uni."},{"id":"cu613","t":"quiz","s":"cu","l":"6","tags":["légendes"],"h":"Quiz","b":"","q":"Quel animal est sur le drapeau du pays de Galles ?","o":["un dragon rouge","un lion","une licorne","un cerf"],"a":0,"e":"Y Ddraig Goch, le dragon rouge gallois."},{"id":"cu614","t":"quiz","s":"cu","l":"6","tags":["paysages"],"h":"Quiz","b":"","q":"Le plus haut sommet du Royaume-Uni est…","o":["Ben Nevis","Snowdon","Mont Blanc","Loch Ness"],"a":0,"e":"Ben Nevis, 1 345 m, dans les Highlands écossais."},{"id":"cu615","t":"quiz","s":"cu","l":"6","tags":["personnages"],"h":"Quiz","b":"","q":"D’où vient l’ours Paddington ?","o":["du Pérou","du Canada","d’Écosse","d’Australie"],"a":0,"e":"Il arrive du Pérou et adore la marmalade."},{"id":"cu616","t":"quiz","s":"cu","l":"6","tags":["fêtes"],"h":"Quiz","b":"","q":"Thanksgiving se fête…","o":["en novembre, aux États-Unis","en juillet, au Royaume-Uni","le 17 mars, en Irlande","le 31 octobre, partout"],"a":0,"e":"Le 4e jeudi de novembre."},{"id":"cu617","t":"quiz","s":"cu","l":"6","tags":["légendes"],"h":"Quiz","b":"","q":"La Giant’s Causeway se trouve…","o":["en Irlande du Nord","en Écosse","au Kenya","aux États-Unis"],"a":0,"e":"Une côte de colonnes de basalte, liée à la légende de Finn McCool."},{"id":"co61","t":"methode","s":"co","l":"6","tags":["compréhension de l’oral"],"h":"Écouter un document : avant d’appuyer sur play","b":"1. Regarde le **titre**, l’**image**, la source : de quoi ça va parler ?\n2. Fais des **hypothèses** : qui parle, où, de quoi ?\n3. 1re écoute : combien de **voix** ? Quel **ton** (joyeux, triste, en colère) ? Quels **bruits** ?\n4. Repère les **mots transparents** (restaurant, family, chocolate) et les mots **répétés**.\n> Tu ne dois pas tout comprendre. Tu dois comprendre l’essentiel."},{"id":"co62","t":"methode","s":"co","l":"6","tags":["compréhension de l’écrit"],"h":"Lire un texte sans tout traduire","b":"1. Observe la **mise en page** : BD, carte postale, page web, recette, article ?\n2. Lis le titre, regarde les images : fais des hypothèses.\n3. Souligne les **mots que tu connais** et les **mots transparents**.\n4. Repère les mots **répétés** : ils te donnent le thème.\n> Traduire mot à mot, c’est lent et ça embrouille. Cherche le sens général d’abord."},{"id":"co63","t":"piege","s":"co","l":"6","tags":["faux amis"],"h":"Mots transparents… et faux amis","b":"Beaucoup de mots ressemblent au français : family, restaurant, elephant, music. Mais attention aux **faux amis** :\n- **library** = bibliothèque (pas librairie, qui se dit bookshop)\n- **a car** = une voiture (pas un car)\n- **a coin** = une pièce de monnaie\n- **large** = grand (pas large)"},{"id":"co64","t":"quiz","s":"co","l":"6","tags":["compréhension de l’oral"],"h":"Quiz","b":"","q":"Avant la 1re écoute, le meilleur réflexe :","o":["observer le titre et l’image pour faire des hypothèses","fermer les yeux et attendre","essayer de tout écrire","traduire le titre mot à mot"],"a":0,"e":"Les indices autour du document préparent ton cerveau à comprendre."},{"id":"co65","t":"quiz","s":"co","l":"6","tags":["faux amis"],"h":"Quiz","b":"","q":"« Library » veut dire…","o":["bibliothèque","librairie","liberté","libraire"],"a":0,"e":"Une librairie se dit bookshop."},{"id":"ex61","t":"methode","s":"ex","l":"6","tags":["se présenter"],"h":"Te présenter en 6 phrases","b":"1. Hello! My name’s… / I’m…\n2. I’m eleven (years old).\n3. I’m French and I live in…\n4. I have one brother / I don’t have any brothers or sisters.\n5. I like… but I don’t like…\n6. That’s me!\n> Ajoute un détail en plus à chaque fois (une couleur, une raison avec because) : c’est ça, progresser.","en":"Hello! My name's Léa. I'm eleven. I'm French and I live in Perpignan. I have one brother. His name is Tom. I like dancing but I don't like football. That's me!"},{"id":"ex62","t":"methode","s":"ex","l":"6","tags":["décrire"],"h":"Décrire un personnage","b":"- **Qui ?** He is a famous British wizard.\n- **Âge** : He is eleven years old.\n- **Apparence** : He has short black hair and round glasses.\n- **Caractère** : He is brave and loyal.\n- **Entourage** : His best friends are…\n> Tu peux réutiliser cette trame pour n’importe quel personnage.","en":"Harry Potter is a famous British wizard. He is eleven years old. He has short black hair and round glasses. His best friends are Hermione and Ron."},{"id":"ex63","t":"fiche","s":"ex","l":"6","tags":["interaction"],"h":"Saluer, demander des nouvelles, prendre congé","b":"- Hello! / Hi! / Good morning! (le matin) / Good afternoon!\n- How are you? — I’m fine, thank you. And you? / I’m so so.\n- Nice to meet you!\n- Bye! / See you tomorrow! / Have a nice day!\n> « Good night » se dit seulement pour aller dormir.","en":"Good morning! How are you? I'm fine, thank you. And you? See you tomorrow! Bye!"},{"id":"ex64","t":"methode","s":"ex","l":"6","tags":["écrire"],"h":"Écrire un petit message ou une carte postale","b":"- Début : **Dear** Sam, / Hi Sam!\n- Où tu es, ce que tu fais : I’m in London. It’s great!\n- Une question pour ton correspondant : How are you?\n- Fin : **Love,** / **See you soon,** / Best wishes, + ton prénom.\n> Relis : majuscules, -s de la 3e personne, ponctuation.","en":"Dear Sam, I'm in London with my class. It's great! Love, Léa."},{"id":"ex65","t":"quiz","s":"ex","l":"6","tags":["écrire"],"h":"Quiz","b":"","q":"Pour terminer un message à un(e) ami(e), tu écris…","o":["Love, Léa","Dear Léa","Good morning Léa","How are you Léa"],"a":0,"e":"Dear sert à commencer ; Love ou See you soon à finir."},{"id":"ex66","t":"quiz","s":"ex","l":"6","tags":["interaction"],"h":"Quiz","b":"","q":"« How are you? » La meilleure réponse :","o":["I’m fine, thank you. And you?","I’m eleven.","I’m from Perpignan.","How are you too."],"a":0,"e":"How are you = comment vas-tu. On répond, puis on retourne la question.","en":"I'm fine, thank you. And you?"},{"id":"ex67","t":"quiz","s":"ex","l":"6","tags":["se présenter"],"h":"Quiz","b":"","q":"Laquelle de ces phrases est correcte ?","o":["I don’t have any brothers or sisters.","I don’t have any brother or sister.","I haven’t brothers or sisters.","I don’t have no brothers."],"a":0,"e":"Any + pluriel dans une phrase négative, et une seule négation.","en":"I don't have any brothers or sisters."},{"id":"gr51","t":"fiche","s":"gr","l":"5","tags":["présent simple","be + ing"],"h":"Présent simple ou BE + -ING ?","b":"- **Présent simple** : l’habitude, le général → I usually **walk** to school.\n- **BE + -ING** : ce qui se passe maintenant, en ce moment → Today I**’m taking** the bus.\n> Repères : usually, every day, often → présent simple ; now, today, at the moment, Look! → BE + -ing.\nCertains verbes ne se mettent presque jamais en -ing : **like, love, want, know, understand, believe**. I **want** a pizza (pas « I’m wanting »).","en":"I usually walk to school, but today I'm taking the bus. She often reads, but now she is sleeping."},{"id":"gr52","t":"fiche","s":"gr","l":"5","tags":["prétérit"],"h":"Le prétérit des verbes réguliers : -ED","b":"Action **terminée** dans le passé, à un moment précis : verbe + **-ed**.\n> I play**ed** tennis yesterday. We visit**ed** London last year.\nOrthographe :\n- e final : like → lik**ed**\n- consonne + y : study → stud**ied**\n- 1 voyelle + 1 consonne finale accentuée : stop → sto**pped**\n> Même forme à toutes les personnes : I played, she played, they played.","en":"I played tennis yesterday. We visited London last year. She stopped. He studied."},{"id":"gr53","t":"fiche","s":"gr","l":"5","tags":["prétérit","verbes irréguliers"],"h":"Les 15 irréguliers à connaître en premier","b":"- be → was / were\n- have → **had** ; do → **did** ; go → **went**\n- see → **saw** ; come → **came** ; get → **got**\n- make → **made** ; take → **took** ; eat → **ate**\n- buy → **bought** ; think → **thought**\n- write → **wrote** ; find → **found** ; say → **said**\n> Ce sont les plus fréquents dans les récits : ils valent plus que tous les autres réunis.","en":"I went to the museum. I saw a dinosaur. I bought a postcard. We ate fish and chips."},{"id":"gr54","t":"fiche","s":"gr","l":"5","tags":["prétérit","did"],"h":"DID : questions et négations au passé","b":"- Question : **Did** + sujet + **base verbale** → **Did** you **go** to the party?\n- Réponse courte : Yes, I **did**. / No, I **didn’t**.\n- Négation : I **didn’t go**.\n- Avec un mot interrogatif : Where **did** you **go**? What **did** she **say**?","en":"Did you go to the party? Yes, I did. I didn't go. Where did you go?"},{"id":"gr55","t":"piege","s":"gr","l":"5","tags":["prétérit","did"],"h":"Après DID, le verbe redevient « normal »","b":"Le passé est déjà porté par **did**. Le verbe qui suit reste à la **base verbale** :\n- I didn’t **went** ✗ → I didn’t **go** ✓\n- Did you **saw** ✗ → Did you **see** ✓\n> Un seul passé par phrase : soit le verbe (I went), soit did (I didn’t go).","en":"I didn't go. Did you see the film?"},{"id":"gr56","t":"fiche","s":"gr","l":"5","tags":["was","were"],"h":"WAS / WERE : le verbe BE au passé","b":"- I / he / she / it **was**\n- you / we / they **were**\n- Négation : wasn’t, weren’t. Question : **Was** it good?\n- Il y avait : **there was** + singulier, **there were** + pluriel.","en":"I was tired. They were at home. There was a storm. There were many people."},{"id":"gr57","t":"fiche","s":"gr","l":"5","tags":["ago"],"h":"AGO : « il y a » dans le temps","b":"On le place **après** la durée, avec le prétérit :\n> I went to Scotland two years **ago**. (il y a deux ans)\n> She called ten minutes **ago**.\nNe confonds pas avec « il y a » = there is !","en":"I went to Scotland two years ago. Five minutes ago."},{"id":"gr58","t":"fiche","s":"gr","l":"5","tags":["futur","will"],"h":"Le futur avec WILL","b":"WILL + base verbale, à toutes les personnes.\n- **Prédiction** : I think it **will** rain tomorrow.\n- **Décision prise sur le moment** : The phone’s ringing! I**’ll** answer.\n- **Promesse** : I**’ll** help you.\nNégation : **won’t** (= will not). She won’t come.","en":"I think it will rain tomorrow. I'll help you! She won't come."},{"id":"gr59","t":"fiche","s":"gr","l":"5","tags":["futur","be going to"],"h":"BE GOING TO : le projet déjà décidé","b":"BE + going to + base verbale.\n- **Projet déjà prévu** : I**’m going to** visit London next summer.\n- **Prédiction avec un indice visible** : Look at those clouds! It**’s going to** rain.\n> Will = je décide maintenant ou je prédis. Going to = c’était déjà prévu, ou je le vois venir.","en":"I'm going to visit London next summer. Look at those clouds! It's going to rain."},{"id":"gr510","t":"fiche","s":"gr","l":"5","tags":["modaux"],"h":"SHOULD et COULD","b":"- **should** = conseil : You **should** go to bed. You **shouldn’t** eat so many sweets.\n- **could** = capacité dans le passé : I **could** swim when I was five.\n- **could** = suggestion, possibilité : We **could** go to the park.\n> Comme can et must : pas de -s, pas de to.","en":"You look tired. You should go to bed. You shouldn't eat so many sweets. I could swim when I was five. We could go to the park."},{"id":"gr511","t":"fiche","s":"gr","l":"5","tags":["comparatif"],"h":"Le comparatif : comparer deux choses","b":"- Adjectif court (1 syllabe, ou 2 en -y) : **-er than** → big**ger** than, happ**ier** than\n- Adjectif long : **more … than** → **more** interesting **than**\n- Égalité : **as … as** → as tall as\n- Irréguliers : good → **better**, bad → **worse**, far → **further**\n> Le « que » de la comparaison se dit **than**, pas « that ».","en":"London is bigger than Paris. This book is more interesting than the film. My marks are better than last year. She is as tall as her brother."},{"id":"gr512","t":"fiche","s":"gr","l":"5","tags":["superlatif"],"h":"Le superlatif : le plus…","b":"- Adjectif court : **the … -est** → the high**est** mountain\n- Adjectif long : **the most …** → **the most** beautiful castle\n- Irréguliers : good → **the best**, bad → **the worst**\n- « du monde, de l’équipe » : **in** the world, **in** the team ; « de ma vie » : **of** my life\n> Ben Nevis is the highest mountain **in** the UK.","en":"Ben Nevis is the highest mountain in the UK. It's the most beautiful castle in Scotland. It was the best day of my life."},{"id":"gr513","t":"fiche","s":"gr","l":"5","tags":["quantifieurs"],"h":"MUCH, MANY, SOME, ANY","b":"- **many** + dénombrable pluriel : How many sweets? not many friends\n- **much** + indénombrable : How much sugar? not much time\n- **some** : phrases affirmatives et offres → There are some apples. Would you like some tea?\n- **any** : phrases négatives et questions → Is there any milk? There isn’t any bread.\n> Indénombrables : water, bread, money, homework, information, advice.","en":"How much sugar? How many sweets? There are some apples. Is there any milk? There isn't any bread."},{"id":"gr514","t":"fiche","s":"gr","l":"5","tags":["pronoms réfléchis"],"h":"Les pronoms réfléchis : -SELF / -SELVES","b":"myself, yourself, himself, herself, itself, ourselves, yourselves, themselves.\n- Le sujet agit sur lui-même : She hurt **herself**.\n- « Moi-même » pour insister : I made this cake **myself**!\n> Enjoy **yourself**! = Amuse-toi bien !","en":"Enjoy yourself! I made it myself. They introduced themselves."},{"id":"gr515","t":"fiche","s":"gr","l":"5","tags":["fréquence"],"h":"Les adverbes de fréquence","b":"always (100 %), **usually**, **often**, **sometimes**, **rarely**, **never** (0 %).\nPlace :\n- **avant** le verbe : I **always** get up at seven.\n- **après** BE : She is **never** late.\n> How often do you…? — Once a week, twice a month, every day.","en":"I always get up at seven. She is never late. We often go to the beach. I sometimes play chess."},{"id":"gr516","t":"fiche","s":"gr","l":"5","tags":["opinion"],"h":"Donner son opinion","b":"- **I think (that)** … / **I believe** …\n- **In my opinion**, … / **For me**, …\n- **I agree** with you. / **I disagree.** (sans be ! pas « I am agree »)\n- I’m not sure.\n> Ajoute toujours une raison avec **because** : c’est ce qui transforme un avis en argument.","en":"I think that the film is great. In my opinion, cricket is boring. I agree with you. I disagree."},{"id":"gr517","t":"fiche","s":"gr","l":"5","tags":["hypothèse","if"],"h":"IF + présent, WILL : si…, alors…","b":"> **If** it **rains**, we **will stay** at home.\n- Après **if** : présent (jamais will).\n- Dans l’autre partie : **will**, can, could, l’impératif…\n> If you’re free, call me!","en":"If it rains, we will stay at home. If you are free, we could go to the exhibition."},{"id":"gr518","t":"fiche","s":"gr","l":"5","tags":["connecteurs","opposition"],"h":"BUT, HOWEVER, WHEREAS : opposer","b":"- **but** : mais (au milieu de la phrase)\n- **however** : cependant (en début de phrase, suivi d’une virgule) → However, it’s free for children.\n- **whereas** : alors que (pour un contraste) → He loves summer, whereas I prefer winter.","en":"I like rugby, but my sister prefers tennis. Tickets are expensive. However, it's free for children. He loves summer, whereas I prefer winter."},{"id":"gr519","t":"quiz","s":"gr","l":"5","tags":["prétérit"],"h":"Quiz","b":"","q":"Yesterday, we ___ to the Natural History Museum.","o":["went","go","goed","did go to"],"a":0,"e":"Yesterday = passé terminé. Go → went.","en":"Yesterday, we went to the Natural History Museum."},{"id":"gr520","t":"quiz","s":"gr","l":"5","tags":["prétérit","did"],"h":"Quiz","b":"","q":"Did you ___ the new film?","o":["see","saw","seen","sees"],"a":0,"e":"Après did, base verbale : did you see.","en":"Did you see the new film?"},{"id":"gr521","t":"quiz","s":"gr","l":"5","tags":["présent","be + ing"],"h":"Quiz","b":"","q":"Look outside! It ___ !","o":["is snowing","snows","snow","snowed"],"a":0,"e":"« Look! » : ça se passe maintenant → BE + -ing.","en":"Look outside! It is snowing!"},{"id":"gr522","t":"quiz","s":"gr","l":"5","tags":["prétérit"],"h":"Quiz","b":"","q":"I ___ my homework last night.","o":["did","do","done","doed"],"a":0,"e":"Do → did, did, did. Last night = prétérit.","en":"I did my homework last night."},{"id":"gr523","t":"quiz","s":"gr","l":"5","tags":["comparatif"],"h":"Quiz","b":"","q":"London is ___ than Edinburgh.","o":["bigger","more big","biggest","more bigger"],"a":0,"e":"Adjectif court : -er, avec doublement : bigger.","en":"London is bigger than Edinburgh."},{"id":"gr524","t":"quiz","s":"gr","l":"5","tags":["superlatif"],"h":"Quiz","b":"","q":"It was ___ day of my life!","o":["the best","the better","the most good","the goodest"],"a":0,"e":"Good → better → the best.","en":"It was the best day of my life!"},{"id":"gr525","t":"quiz","s":"gr","l":"5","tags":["quantifieurs"],"h":"Quiz","b":"","q":"How ___ sugar do you want in your tea?","o":["much","many","any","lot"],"a":0,"e":"Sugar est indénombrable : how much.","en":"How much sugar do you want in your tea?"},{"id":"gr526","t":"quiz","s":"gr","l":"5","tags":["ago"],"h":"Quiz","b":"","q":"« Il y a deux semaines » se dit…","o":["two weeks ago","there are two weeks","ago two weeks","since two weeks"],"a":0,"e":"Durée + ago, avec le prétérit."},{"id":"gr527","t":"quiz","s":"gr","l":"5","tags":["modaux"],"h":"Quiz","b":"","q":"You look tired. You ___ go to bed early.","o":["should","must to","shoulds","would"],"a":0,"e":"Should = conseil. Pas de to, pas de -s.","en":"You look tired. You should go to bed early."},{"id":"gr528","t":"quiz","s":"gr","l":"5","tags":["futur"],"h":"Quiz","b":"","q":"Look at those dark clouds! It ___ rain.","o":["is going to","will to","going","rains"],"a":0,"e":"Un indice visible (les nuages) : be going to.","en":"Look at those dark clouds! It is going to rain."},{"id":"gr529","t":"quiz","s":"gr","l":"5","tags":["futur"],"h":"Quiz","b":"","q":"The phone is ringing. — OK, I ___ answer it!","o":["’ll","’m going to","answer","would"],"a":0,"e":"Décision prise sur le moment : will.","en":"The phone is ringing. — OK, I'll answer it!"},{"id":"gr530","t":"quiz","s":"gr","l":"5","tags":["pronoms réfléchis"],"h":"Quiz",

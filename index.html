n- **could have** = on aurait pu → We **could have won**!\n- **might have** = c’est peut-être arrivé → He **might have missed** the bus.","en":"I should have studied harder. You shouldn't have said that. We could have won."},{"id":"gr337","t":"fiche","s":"gr","l":"3","tags":["capacité"],"h":"BE ABLE TO, MANAGE TO","b":"**Can** n’existe qu’au présent (et could au passé). Pour les autres temps : **be able to**.\n- I **will be able to** drive next year.\n- I **have never been able to** whistle.\n- **manage to** = réussir à (après un effort) : She **managed to** finish on time.","en":"I was able to swim at five. She managed to finish on time. I'll be able to drive next year."},{"id":"gr338","t":"fiche","s":"gr","l":"3","tags":["quantifieurs"],"h":"FEW / A FEW, LITTLE / A LITTLE : la nuance qui change tout","b":"- **a few** / **a little** = un peu, quelques-uns (positif)\n- **few** / **little** = peu, pas assez (négatif)\n> I have **a few** friends (quelques amis, ça va). I have **few** friends (peu d’amis, c’est triste).\nFew + dénombrable, little + indénombrable.","en":"I have few friends. I have a few friends. There is little time. There is a little time."},{"id":"gr339","t":"fiche","s":"gr","l":"3","tags":["so","such"],"h":"SO ou SUCH ? « tellement »","b":"- **so** + adjectif / adverbe : It was **so** cold.\n- **such a** + adjectif + nom singulier : It was **such a** cold day.\n- **such** + adjectif + nom pluriel / indénombrable : **such** nice people\n- Conséquence : It was **so** cold **that** we stayed home.","en":"It was so cold. It was such a cold day. She's such a good singer."},{"id":"gr340","t":"fiche","s":"gr","l":"3","tags":["insistance"],"h":"Insister sur une idée","b":"- **do / does / did** en affirmative = vraiment : I **do** like jazz! She **did** try!\n- **It is… that / who** : **It was** Rosa Parks **who** refused to give up her seat.\n- **What** + phrase + **is** : **What I want is** peace.","en":"I do like jazz! It was Rosa Parks who refused to stand up. What I want is peace."},{"id":"gr341","t":"fiche","s":"gr","l":"3","tags":["relatives"],"h":"Relatives : avec ou sans virgules ?","b":"- **Sans virgules** (déterminative) : l’info est indispensable pour savoir de qui on parle → The students **who passed** are happy. (seulement ceux-là)\n- **Avec virgules** (explicative) : l’info est un ajout → My sister, **who lives in Dublin**, is a nurse.\n> Avec virgules : jamais de **that**, et on ne peut pas effacer le relatif.","en":"My sister, who lives in Dublin, is a nurse. The students who passed are happy."},{"id":"gr342","t":"fiche","s":"gr","l":"3","tags":["opposition"],"h":"Opposer et nuancer comme en B1","b":"- **On the one hand**… **On the other hand**… (d’un côté… de l’autre)\n- **whereas** / **while** (alors que)\n- **however**, **nevertheless** (cependant, néanmoins)\n- **in spite of** / **despite** + nom ou -ing\n- **yet** (et pourtant)","en":"On the one hand, it's fun. On the other hand, it's expensive. While some people love it, others hate it."},{"id":"gr343","t":"fiche","s":"gr","l":"3","tags":["verbe + to","verbe + ing"],"h":"STOP, REMEMBER, TRY : le sens change !","b":"- **stop** + -ing = arrêter de → I stopped **eating** sweets.\n- **stop to** + BV = s’arrêter pour → I stopped **to buy** a drink.\n- **remember to** = ne pas oublier de (à faire) / **remember** + -ing = se souvenir d’avoir fait\n- **try to** = essayer de (effort) / **try** + -ing = essayer pour voir","en":"I stopped smoking. I stopped to buy a newspaper. Remember to lock the door. I remember meeting him."},{"id":"gr344","t":"fiche","s":"gr","l":"3","tags":["prépositions"],"h":"Les prépositions qui suivent les adjectifs et les verbes","b":"- interested **in**, good **at**, bad **at**\n- proud **of**, afraid **of**, tired **of**, fond **of**\n- worried **about**, excited **about**\n- different **from**, married **to**\n- depend **on**, listen **to**, wait **for**, look **forward to**","en":"I'm interested in history. She's proud of her son. He's afraid of spiders. I'm good at maths. It depends on the weather."},{"id":"gr345","t":"fiche","s":"gr","l":"3","tags":["wish","regret"],"h":"I WISH + PAST PERFECT : regretter le passé","b":"> I wish I **had studied** more. (je regrette de ne pas avoir…)\n> **If only** I **hadn’t said** that!\n- I wish + prétérit = regret au **présent** (I wish I had a dog)\n- I wish + past perfect = regret au **passé**","en":"I wish I had studied more. If only I hadn't said that."},{"id":"gr346","t":"fiche","s":"gr","l":"3","tags":["futur dans le passé"],"h":"Le futur vu du passé","b":"- **would** + BV : She said she **would** come. (discours indirect de « I will come »)\n- **was / were going to** : une intention passée… souvent pas réalisée → I **was going to** call you, but I forgot.","en":"She said she would come. I was going to call you, but I forgot."},{"id":"gr347","t":"fiche","s":"gr","l":"3","tags":["get"],"h":"GET : le verbe à tout faire","b":"- **get** + adjectif = devenir : It’s **getting** dark. I **got** tired.\n- **get** = recevoir, obtenir : I **got** a message.\n- **get to** = arriver à : How do I get to the station?\n- **get lost**, **get married**, **get ready**, **get up**, **get on with** (s’entendre avec)","en":"It's getting dark. I got tired. Get ready! I got lost."},{"id":"vo312","t":"fiche","s":"vo","l":"3","tags":["orientation"],"h":"Études et orientation","b":"- **high school** (lycée US), **sixth form** (lycée UK), **college** / **university**\n- a **vocational** school (lycée professionnel), an **apprenticeship** (apprentissage)\n- a **degree** (diplôme universitaire), a **subject**, to **graduate**\n- **career**, **ambition**, **to be good at**, **work experience** (stage d’observation)","en":"I'd like to go to a vocational school. An apprenticeship. A degree. University.","p":[["🎓","degree","diplôme"],["🏫","school","école"],["🧑‍🎓","student","étudiant"],["🔧","apprenticeship","apprentissage"],["📖","subject","matière"],["🏛️","university","université"],["📝","exam","examen"],["🎯","ambition","ambition"]]},{"id":"vo313","t":"fiche","s":"vo","l":"3","tags":["argumentation"],"h":"Le lexique du débat","b":"- an **advantage** / a **benefit** ≠ a **drawback** / a **disadvantage**\n- the **pros and cons** (le pour et le contre)\n- an **issue** (un problème de société), a **solution**\n- **It’s worth it** (ça en vaut la peine), **on the whole** (dans l’ensemble)\n- **to convince**, **to persuade**, a **point of view**","en":"The main advantage is... The drawback is... On the whole... It's worth it."},{"id":"vo314","t":"fiche","s":"vo","l":"3","tags":["discriminations"],"h":"Égalité et discriminations","b":"- **prejudice** (préjugé), **racism**, **sexism**, **discrimination**\n- **segregation**, **injustice**, **inequality** ≠ **equality**\n- **civil rights**, **equal rights**, **human rights**\n- to **fight against**, to **stand up for**, to **speak out**","en":"Racism. Prejudice. Discrimination. Equal rights. Segregation. To fight against injustice."},{"id":"vo315","t":"fiche","s":"vo","l":"3","tags":["réseaux sociaux"],"h":"Internet et réseaux sociaux","b":"- **online** / **offline**, a **social network**, a **follower**\n- **cyberbullying** (cyberharcèlement), a **troll**, a **fake account**\n- **privacy** (vie privée), **privacy settings**, **personal data**\n- **screen time**, to be **addicted to**\n> En France, en cas de harcèlement : le **3018**, gratuit et anonyme.","en":"Cyberbullying. Privacy settings. A screen addiction. Online. A fake account.","p":[["🌐","online","en ligne"],["📴","offline","hors ligne"],["🔒","privacy","vie privée"],["👤","account","compte"],["🎭","fake account","faux compte"],["😡","troll","troll"],["⏳","screen time","temps d’écran"],["🚫","block","bloquer"]]},{"id":"vo316","t":"fiche","s":"vo","l":"3","tags":["environnement","engagement"],"h":"Agir pour la planète","b":"- **carbon footprint** (empreinte carbone), **greenhouse gases**\n- to **go green**, **sustainable** (durable), **eco-friendly**\n- **single-use plastic**, to **reduce waste**, **zero waste**\n- a **climate strike**, an **environmental activist**","en":"Carbon footprint. To reduce waste. To go green. Climate activists.","p":[["👣","carbon footprint","empreinte carbone"],["🌱","eco-friendly","écologique"],["🥤","single-use plastic","plastique jetable"],["🚲","go green","adopter un mode de vie vert"],["💧","save water","économiser l’eau"],["🌳","plant trees","planter des arbres"],["🧑‍🤝‍🧑","climate strike","grève pour le climat"],["♻️","zero waste","zéro déchet"]]},{"id":"vo317","t":"fiche","s":"vo","l":"3","tags":["expressions idiomatiques"],"h":"8 expressions idiomatiques à connaître","b":"- **It’s a piece of cake** = c’est du gâteau\n- **Break a leg!** = bonne chance ! (au théâtre)\n- **It’s raining cats and dogs** = il pleut des cordes\n- **I’m all ears** = je suis tout ouïe\n- **once in a blue moon** = tous les 36 du mois\n- **to be under the weather** = ne pas être en forme\n- **to cost an arm and a leg** = coûter les yeux de la tête\n- **to hit the books** = se mettre à réviser","en":"It's a piece of cake. Break a leg! It's raining cats and dogs. I'm all ears. Once in a blue moon.","p":[["🍰","a piece of cake","c’est du gâteau"],["🦵","break a leg","bonne chance"],["🐱","raining cats and dogs","pleuvoir des cordes"],["👂","all ears","tout ouïe"],["🌕","once in a blue moon","tous les 36 du mois"],["🤒","under the weather","pas en forme"],["💸","cost an arm and a leg","coûter une fortune"],["📚","hit the books","se mettre à réviser"]]},{"id":"vo318","t":"piege","s":"vo","l":"3","tags":["faux amis"],"h":"Faux amis : la suite","b":"- **to achieve** = réussir, accomplir (pas achever → to finish)\n- **a deception** = une tromperie (déception → disappointment)\n- **injured** = blessé (injurié → insulted)\n- **a lecture** = un cours magistral, une conférence (lecture → reading)\n- **a preservative** = un conservateur alimentaire !\n- **to resume** = reprendre (résumer → to sum up)","en":"I want to achieve my goals. What a deception! He was injured. A lecture."},{"id":"vo319","t":"fiche","s":"vo","l":"3","tags":["connecteurs B1"],"h":"Les connecteurs du niveau B1","b":"- Ajouter : **furthermore**, **moreover**, **in addition**, **besides**\n- Opposer : **nevertheless**, **however**, **on the contrary**\n- Conséquence : **consequently**, **therefore**, **as a result**\n- Illustrer : **for instance**, **such as**\n- Reformuler : **in other words**, **that is to say**\n- Conclure : **to sum up**, **all in all**, **in conclusion**","en":"Furthermore. Nevertheless. Consequently. In other words. To sum up."},{"id":"cu321","t":"fiche","s":"cu","l":"3","tags":["États-Unis","histoire"],"h":"Axe 6 : la guerre de Sécession","b":"- **1861-1865** : guerre civile entre les États du **Nord** (l’Union) et ceux du **Sud** (la Confédération), notamment sur la question de l’**esclavage**.\n- **Abraham Lincoln** proclame l’émancipation des esclaves en 1863 ; il est assassiné en 1865.\n- **1865** : le **13e amendement** abolit l’esclavage.\n- Mais dans le Sud, la ségrégation s’installe pour près d’un siècle.","en":"The Civil War, 1861-1865. Abraham Lincoln. The 13th Amendment abolished slavery."},{"id":"cu322","t":"fiche","s":"cu","l":"3","tags":["Amérindiens","axe 1"],"h":"Axe 1 : les peuples amérindiens","b":"- Des centaines de nations vivaient sur le continent : Cherokee, Sioux (Lakota), Navajo, Apache…\n- **1830** : l’**Indian Removal Act** force des peuples du Sud-Est à partir vers l’ouest du Mississippi. Pour les Cherokees, ce déplacement meurtrier est appelé **the Trail of Tears** (la Piste des larmes).\n- Aujourd’hui, des **réserves** existent et les nations amérindiennes défendent leurs langues et leurs droits.","en":"Native Americans. The Indian Removal Act of 1830. The Trail of Tears."},{"id":"cu323","t":"fiche","s":"cu","l":"3","tags":["géographie","axe 6"],"h":"Axe 6 : les grands paysages américains","b":"- **Yellowstone** (1872) : le premier **parc national** du monde, avec ses geysers.\n- **Le Grand Canyon** (Arizona), creusé par le fleuve **Colorado**.\n- Les **Rocheuses** (Rocky Mountains), les **Grands Lacs**, le désert de **Mojave**.\n- Le pays compte **6 fuseaux horaires** principaux, d’Hawaï à la côte Est.","en":"The Grand Canyon. Yellowstone. The Rocky Mountains. The Great Lakes."},{"id":"cu324","t":"fiche","s":"cu","l":"3","tags":["élections","axe 6"],"h":"Axe 6 : comment on élit le président américain","b":"- L’élection a lieu tous les **4 ans**, en **novembre**.\n- Les citoyens votent dans chaque État pour des **grands électeurs** : le **Collège électoral** compte **538** membres. Il en faut **270** pour gagner.\n- Deux grands partis : les **Démocrates** (âne) et les **Républicains** (éléphant).\n- Le nouveau président prête serment le **20 janvier** (Inauguration Day).","en":"The Electoral College. 538 electors. 270 votes to win. Inauguration Day is on the 20th of January."},{"id":"cu325","t":"fiche","s":"cu","l":"3","tags":["cinéma","axe 4"],"h":"Axe 4 : Hollywood, l’usine à rêves","b":"- **Hollywood**, quartier de **Los Angeles**, devient la capitale du cinéma dans les années 1910-1920.\n- Les **Oscars** (Academy Awards) sont remis depuis **1929**.\n- Le cinéma américain diffuse dans le monde entier une image des États-Unis : rêve américain, westerns, super-héros.\n> Une image… à analyser avec esprit critique.","en":"Hollywood. The Oscars. The Golden Age of Hollywood."},{"id":"cu326","t":"fiche","s":"cu","l":"3","tags":["jazz","axe 4"],"h":"Axe 4 : le jazz et le blues, langages de liberté","b":"- Le **blues** naît dans le Sud chez les Afro-Américains, héritier des chants de travail.\n- Le **jazz** naît à **La Nouvelle-Orléans** au début du 20e siècle.\n- **Louis Armstrong**, trompettiste et chanteur, en devient une star mondiale.\n- Ces musiques ont donné naissance au rock, à la soul, au hip-hop.","en":"Jazz was born in New Orleans. Louis Armstrong. The blues."},{"id":"cu327","t":"fiche","s":"cu","l":"3","tags":["médias","axe 4"],"h":"Axe 4 : Watergate, le pouvoir de la presse","b":"- **1972** : des cambrioleurs sont arrêtés dans l’immeuble du Watergate, au siège du Parti démocrate.\n- Deux journalistes du **Washington Post**, Bob Woodward et Carl Bernstein, enquêtent et remontent jusqu’à la Maison-Blanche.\n- **1974** : le président **Richard Nixon** démissionne, le seul de l’histoire américaine.\n> On appelle la presse le « quatrième pouvoir » (**the Fourth Estate**).","en":"The Watergate scandal. Two journalists from The Washington Post. Nixon resigned in 1974."},{"id":"cu328","t":"fiche","s":"cu","l":"3","tags":["engagement","axe 5"],"h":"Axe 5 : d’autres formes d’engagement","b":"- **Live Aid** (1985) : concerts géants à Londres et Philadelphie pour lutter contre la famine en Éthiopie.\n- **Greenpeace** : ONG environnementale fondée en 1971 à Vancouver (Canada).\n- **Black Lives Matter** : mouvement né en 2013 aux États-Unis contre les violences policières visant les Noirs.\n- **Pétitions**, **boycotts**, **marches**, **bénévolat** : l’engagement prend mille formes.","en":"Live Aid, 1985. Greenpeace was founded in 1971. Black Lives Matter."},{"id":"cu329","t":"fiche","s":"cu","l":"3","tags":["travail","axe 2"],"h":"Axe 2 : le travail au 20e siècle","b":"- **1913** : **Henry Ford** installe la **chaîne de montage** mobile pour fabriquer la Ford T ; la voiture devient accessible, mais le travail devient répétitif.\n- **Seconde Guerre mondiale** : les Américaines remplacent les hommes dans les usines. Leur symbole : **Rosie the Riveter** et l’affiche « **We Can Do It!** ».","en":"Henry Ford's assembly line, 1913. Rosie the Riveter. We can do it!"},{"id":"cu330","t":"fiche","s":"cu","l":"3","tags":["migrations","axe 3"],"h":"Axe 3 : la génération Windrush","b":"- Le **22 juin 1948**, le navire **Empire Windrush** arrive près de Londres avec des centaines de passagers venus surtout de **Jamaïque** et des Caraïbes, invités à aider à reconstruire le pays.\n- On appelle **Windrush generation** les migrants caribéens arrivés jusqu’en 1971.\n- Depuis 2018, le 22 juin est le **Windrush Day**.","en":"The Windrush generation arrived in 1948. Windrush Day is on the 22nd of June."},{"id":"cu331","t":"fiche","s":"cu","l":"3","tags":["migrations","axe 3"],"h":"Axe 3 : la statue de la Liberté, symbole d’accueil","b":"- Sur le socle de la statue se trouve un poème d’**Emma Lazarus**, **The New Colossus** (1883).\n- La statue y invite le monde à lui confier ses pauvres et ses exilés : elle devient le symbole de l’**accueil** des immigrants arrivant à New York.\n- Elle tient une **torche** et une tablette portant la date du **4 juillet 1776**.","en":"Give me your tired, your poor. The New Colossus by Emma Lazarus."},{"id":"cu332","t":"fiche","s":"cu","l":"3","tags":["rencontre","axe 1"],"h":"Axe 1 : le Commonwealth","b":"- Une organisation de **56 pays**, pour la plupart d’anciens territoires de l’**Empire britannique** : Inde, Canada, Australie, Afrique du Sud, Nigeria, Jamaïque…\n- Le monarque britannique en est le chef symbolique.\n- Les **Commonwealth Games** réunissent ses athlètes tous les quatre ans.","en":"The Commonwealth of Nations. 56 countries."},{"id":"cu333","t":"fiche","s":"cu","l":"3","tags":["école américaine","axe 2"],"h":"Axe 2 : le lycée américain","b":"- 4 années : **freshman** (14-15 ans), **sophomore**, **junior**, **senior**.\n- Des matières au choix, des clubs, du sport universitaire très suivi.\n- Le **prom** : le bal de fin d’année.\n- La **graduation** : cérémonie de remise des diplômes en toge et chapeau carré, que l’on lance en l’air.\n- Pour l’université : dossier scolaire, lettres de recommandation, parfois le test **SAT**.","en":"High school. Freshman, sophomore, junior, senior. Prom. Graduation."},{"id":"co34","t":"methode","s":"co","l":"3","tags":["graphique","statistiques"],"h":"Comprendre et présenter un graphique","b":"- **The chart / graph / table shows**…\n- Hausse : **rise**, **increase**, **go up** ; baisse : **fall**, **decrease**, **go down**\n- **from** 10% **to** 30% ; **by** 20% (de 20 points)\n- **half**, **a third**, **a quarter**, **most of**, **the majority of**\n> Décris d’abord la tendance générale, puis les chiffres marquants.","en":"The chart shows that... The number of migrants rose from... to... Half of the students..."},{"id":"co35","t":"methode","s":"co","l":"3","tags":["humour","ironie"],"h":"Repérer l’humour et l’ironie","b":"- **Le décalage** entre ce qui est dit et ce qui est montré (image, ton de la voix).\n- **L’exagération** : « Oh great, another Monday! »\n- **Les guillemets** à l’écrit, une voix qui traîne à l’oral.\n- **Le contexte culturel** : le célèbre humour britannique est souvent **pince-sans-rire** (understatement).\n> « It’s a bit chilly » quand il fait −10 °C : c’est de l’understatement."},{"id":"ex39","t":"methode","s":"ex","l":"3","tags":["article","blog"],"h":"Écrire un article ou un billet de blog","b":"1. **Un titre** accrocheur.\n2. **Une accroche** : une question au lecteur (Have you ever wondered…?)\n3. **Des paragraphes** avec une idée chacun, des exemples, des chiffres.\n4. **Ton avis** et une ouverture : What do you think? Leave a comment!\n> Ton : plus personnel qu’une lettre formelle, mais phrases complètes.","en":"Have you ever wondered...? In this article, I will... What do you think? Leave a comment!"},{"id":"ex310","t":"methode","s":"ex","l":"3","tags":["entretien"],"h":"Réussir un entretien (stage, job d’été, oral)","b":"- **Tell me about yourself.** → présente-toi en 3 phrases : âge, études, passions.\n- **Why do you want…?** → I’m interested in… because…\n- **What are your strengths?** → I’m hard-working, reliable, and I’m good at…\n- **Do you have any questions?** → Prépare toujours une question.\n> Regarde ton interlocuteur, souris, et ne récite pas.","en":"Tell me about yourself. Why do you want this job? What are your strengths?"},{"id":"ex311","t":"methode","s":"ex","l":"3","tags":["conseils"],"h":"Donner des conseils de façon nuancée","b":"- **You should** / **You ought to**…\n- **If I were you, I would**…\n- **Why don’t you**…? / **How about** + -ing?\n- **You’d better**… (conseil pressant)\n- **It might be a good idea to**…","en":"If I were you, I would... You should... Why don't you...? You'd better..."},{"id":"ex312","t":"methode","s":"ex","l":"3","tags":["raconter","B1"],"h":"Raconter une expérience au niveau B1","b":"- **Variété des temps** : prétérit, prétérit BE + -ing, past perfect.\n- **Connecteurs** : at first, later, by the time, eventually.\n- **Émotions** nuancées : I was overwhelmed / relieved / thrilled.\n- **Bilan** au present perfect : It’s the best day I’ve ever had. It has changed me.","en":"I had never seen so many people. By the time we arrived, the concert had started. It was the best day I've ever had."},{"t":"quiz","s":"vo","l":"6","tags":["imagier","famille"],"h":"Quiz","b":"","q":"👨 « père », en anglais :","o":["father","baby","sister","brother"],"a":0,"e":"👨 père = father.","en":"father","id":"vo630"},{"t":"quiz","s":"vo","l":"6","tags":["imagier","famille"],"h":"Quiz","b":"","q":"👩 « mère », en anglais :","o":["mother","brother","family","father"],"a":0,"e":"👩 mère = mother.","en":"mother","id":"vo631"},{"t":"quiz","s":"vo","l":"6","tags":["imagier","apparence"],"h":"Quiz","b":"","q":"👱 « cheveux blonds », en anglais :","o":["blond hair","a beard","tall","eyes"],"a":0,"e":"👱 cheveux blonds = blond hair.","en":"blond hair","id":"vo632"},{"t":"quiz","s":"vo","l":"6","tags":["imagier","apparence"],"h":"Quiz","b":"","q":"🧔 « une barbe », en anglais :","o":["a beard","tall","blond hair","eyes"],"a":0,"e":"🧔 une barbe = a beard.","en":"a beard","id":"vo633"},{"t":"quiz","s":"vo","l":"6","tags":["imagier","vêtements"],"h":"Quiz","b":"","q":"👢 « bottes », en anglais :","o":["boots","coat","socks","cap"],"a":0,"e":"👢 bottes = boots.","en":"boots","id":"vo634"},{"t":"quiz","s":"vo","l":"6","tags":["imagier","vêtements"],"h":"Quiz","b":"","q":"👕 « tee-shirt », e e tes hypothèses, ajoute les chiffres, les noms, les opinions.","Rédige en français, organisé par idées, pas dans l’ordre d’écoute.","Termine par le message ou le point de vue du document."],"traps":["Vouloir tout comprendre dès la 1re écoute, et paniquer.","Écrire des phrases entières pendant l’écoute et rater la suite.","Oublier les opinions et les sentiments des personnes."]},{"id":"ce","act":"ce","s":"co","n":"Compréhension de l’écrit","dur":"30 min","parts":[{"n":"Paratexte et hypothèses","d":"3 min","m":3},{"n":"Lecture globale","d":"7 min","m":7},{"n":"Lecture détaillée et repérages","d":"12 min","m":12},{"n":"Réponses et relecture","d":"8 min","m":8}],"note":"Format type d’une évaluation en classe. Les durées sont des repères d’entraînement.","steps":["Regarde la mise en page, le titre, la source et la date : quel type de texte ?","Lis une première fois en entier sans t’arrêter sur les mots inconnus.","Souligne les mots transparents, les mots répétés et les connecteurs.","Relis paragraphe par paragraphe : qui, quoi, où, quand, pourquoi.","Justifie tes réponses avec des éléments précis du texte.","Relis tes réponses : sont-elles complètes et compréhensibles ?"],"traps":["Traduire mot à mot au lieu de chercher le sens.","Se laisser piéger par un faux ami (library, actually, eventually).","Répondre sans citer le texte quand on te demande de justifier."]},{"id":"ee","act":"ee","s":"ex","n":"Expression écrite","dur":"35 min","parts":[{"n":"Comprendre le sujet, idées au brouillon","d":"8 min","m":8},{"n":"Rédaction","d":"20 min","m":20},{"n":"Relecture avec la check-list","d":"7 min","m":7}],"note":"Format type d’une évaluation en classe. Les durées sont des repères d’entraînement.","steps":["Souligne dans le sujet : le type de texte, le destinataire, le temps à utiliser, le nombre de mots.","Au brouillon : une liste d’idées et de mots-clés, pas le texte entier.","Rédige en paragraphes, avec des connecteurs (first, then, because, however).","Réutilise le vocabulai function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function inl(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }

  var lines = String(src || "").split("\n"), out = [], list = null, j, L, m;
  function close(){ if (list) { out.push("</" + list + ">"); list = null; } }

}

function pickVoice(lang){
  var k, vl, exact = null, any = null;
  if (!VOICES.length) loadVoices();

    vl = String(VOICES[k].lang || "").replace("_", "-");

  }

}

  h += '<p class="wide glitch-sm" style="text-align:center;margin:30px 0 2px;font-size:1.3em">Swipe ton English</p><p class="small" style="text-align:center;margin:0 0 6px">Une appli BROT2YOU. Gratuite, sans pub, sans compte.</p></div>';
  $("v-me").innerHTML = h;

  $("pseudo").onchange = function(){ st.pseudo = this.value.replace(/^\s+|\s+$/g, ""); save(); renderMe(); };
  $("meRev").onclick = function(){ if (n) startReview(); };
  $("meLv").onclick = function(){ openLevelPicker(false); };
  function mark(id, attr, val){ var bs = $(id).children, z; for (z = 0; z < bs.length; z++) bs[z].className = String(bs[z].getAttribute(attr)) === String(val) ? "on" : ""; }
  mark("lvSeg", "data-l", curL()); mark("pvSeg2", "data-p", st.prev ? "1" : "0"); mark("vcSeg", "data-v", st.voice); mark("rtSeg", "data-r", st.rate);
  mark("thSeg", "data-t", st.theme); mark("ftSeg", "data-d", st.dys ? "1" : "0"); mark("fsSeg", "data-s", st.fs); mark("vbSeg", "data-b", st.vibe);
  $("lvSeg").onclick = function(ev){ var t = ev.target.getAttribute("data-l"); if (!t) return; setLevel(t); toast("Programme de " + LVN[t] + " chargé"); renderMe(); };
  $("pvSeg2").onclick = function(ev){ var t = ev.target.getAttribute("data-p"); if (t === null) return; setLevel(curL(), t === "1"); renderMe(); };
  $("vcSeg").onclick = function(ev){ var t = ev.target.getAttribute("data-v"); if (!t) return; st.voice = t; save(); renderMe(); speak(t === "us" ? "Hi! This is the American voice." : "Hello! This is the British voice."); };
  $("rtSeg").onclick = function(ev){ var t = ev.target.getAttribute("data-r"); if (!t) return; st.rate = +t; save(); renderMe(); speak("Let's practise English together."); };
  $("vbSeg").onclick = function(ev){ var t = ev.target.getAttribute("data-b"); if (!t) return; setVibe(t); renderMe(); };
  $("thSeg").onclick = function(ev){ var t = ev.target.getAttribute("data-t"); if (!t) return; st.theme = t; save(); applyPrefs(); renderMe(); };
  $("ftSeg").onclick = function(ev){ var t = ev.target.getAttribute("data-d"); if (t === null) return; st.dys = t === "1"; save(); applyPrefs(); renderMe(); };
  $("fsSeg").onclick = function(ev){ var t = ev.target.getAttribute("data-s"); if (!t) return; st.fs = +t; save(); applyPrefs(); renderMe(); };
  $("exp").onclick = exportData;
  $("imp").onclick = function(){ $("impF").click(); };
  $("impF").onchange = importData;
  $("rst").onclick = function(){
    if (this.getAttribute("data-c")) { var keep = {theme:st.theme, vibe:st.vibe, dys:st.dys, fs:st.fs, lvl:st.lvl, prev:st.prev, voice:st.voice, rate:st.rate}, kk; st = blank(); for (kk in keep) if (keep.hasOwnProperty(kk)) st[kk] = keep[kk]; save(); updateBadge(); toast("Progression effacée"); renderMe(); renderFeed(); }
    else { this.setAttribute("data-c", "1"); this.textContent = "Confirmer : tout effacer"; }
  };
  var sel = $("v-me").querySelectorAll(".selfg select"), zz;
  for (zz = 0; zz < sel.length; zz++) sel[zz].onchange = function(){ var a2 = this.getAttribute("data-a"), v2 = +this.value, ok = v2 >= STEPS.indexOf(cible().lv), cf = $("sfc_" + a2); selfOf()[a2] = v2; save(); cf.className = "cf" + (ok ? " ok" : ""); cf.textContent = (ok ? "✓ " : "") + cible().lv; selfResult(); };
  selfResult();
}
function selfResult(){
  var me = selfOf(), c = cible(), tgt = STEPS.indexOf(c.lv), k, a, v, done = 0, filled = 0, low = null, lowV = 99, r = $("selfR");
  for (k = 0; k < D.acts.length; k++) { a = D.acts[k][0]; v = me[a] || 0; if (!v) continue; filled++; if (v >= tgt) done++; if (v < lowV) { lowV = v; low = D.acts[k]; } }
  if (!filled) { r.innerHTML = '<span class="small">Choisis ton niveau dans chaque activité pour voir où tu en es par rapport à la cible de ' + esc(LVN[curL()]) + '.</span>'; return; }
  var h = '<div class="big wide glitch">' + done + '/' + filled + '</div><div style="font-weight:800;margin-top:6px">' + (done === 6 ? "Cible atteinte partout. Excellent !" : "activité" + (filled > 1 ? "s" : "") + " positionnée" + (filled > 1 ? "s" : "") + " au niveau visé (" + esc(c.lv) + ")") + '</div>';
  if (filled < 6) h += '<div class="small" style="margin-top:4px">Encore ' + (6 - filled) + ' activité' + (6 - filled > 1 ? "s" : "") + ' à positionner.</div>';
  if (low && lowV < tgt) h += '<div class="small" style="margin-top:6px">Ta priorité : <b>' + esc(low[1]) + '</b>. En fin d’année, tu dois pouvoir : ' + esc(c[low[0]]) + '</div>';
  r.innerHTML = h;
}
function exportData(){
  var blob = new Blob([JSON.stringify(st, null, 1)], {type:"application/json"}), a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "swipe-ton-english-" + dayKey() + ".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 500);
  toast("Fichier de progression téléchargé");
}
function importData(){
  var f = this.files && this.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try { var o = JSON.parse(rd.result); if (!o || typeof o.xp !== "number" || !o.seen) throw new Error("x"); var b = blank(), k; for (k in o) if (o.hasOwnProperty(k) && b.hasOwnProperty(k)) b[k] = o[k]; st = b; save(); applyPrefs(); updateBadge(); toast("Progression importée"); renderMe(); renderFeedChips(); renderFeed(); }
    catch (e) { toast("Ce fichier n’est pas une sauvegarde de Swipe ton English"); }
  };
  rd.readAsText(f);
}

/* ---------------- navigation ---------------- */
var current = "feed";
function refreshCurrent(){ if (current === "me") renderMe(); else if (current === "defi" && !defi) renderDefiHome(); else if (current === "explore") renderExplore(true); else if (current === "exams") renderExams(); }
function show(v){
  stopSpeak();
  if (current === "defi" && v !== "defi" && defi && !defi.done) { stopTick(); defi = null; }
  if ($("ov").className.indexOf("on") >= 0) closeOv();
  current = v;
  var vs = document.querySelectorAll(".view"), k; for (k = 0; k < vs.length; k++) vs[k].className = "view" + (vs[k].id === "v-" + v ? " on" : "");
  var ts = document.querySelectorAll("#tabbar [data-v]"); for (k = 0; k < ts.length; k++) { var on = ts[k].getAttribute("data-v") === v; if (ts[k].className.indexOf("plus") < 0) ts[k].className = "tab" + (on ? " on" : ""); ts[k].setAttribute("aria-current", on ? "page" : "false"); }
  syncBar();
  if (v === "explore") renderExplore(true);
  else if (v === "defi") { if (!defi || defi.done) { defi = null; renderDefiHome(); } }
  else if (v === "exams") renderExams();
  else if (v === "me") renderMe();
}
$("tabbar").addEventListener("click", function(ev){ var t = ev.target; while (t && t !== this && !t.getAttribute("data-v")) t = t.parentNode; if (t && t !== this) show(t.getAttribute("data-v")); });
document.addEventListener("keydown", function(ev){
  if (ev.key === "Escape" && $("ov").className.indexOf("on") >= 0) closeOv();
  if (current === "feed" && $("ov").className.indexOf("on") < 0 && (ev.key === "ArrowDown" || ev.key === "ArrowUp") && !(ev.target && /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName))) {
    var f = $("feed"); f.scrollBy ? f.scrollBy({top:(ev.key === "ArrowDown" ? 1 : -1) * f.clientHeight, behavior:"smooth"}) : (f.scrollTop += (ev.key === "ArrowDown" ? 1 : -1) * f.clientHeight); ev.preventDefault();
  }
});

$("brandFeed").innerHTML = brandHTML();
applyPrefs();
renderFeedChips();
renderFeed();
updateBadge();
if (!st.lvl) openLevelPicker(true);
})();
</script>
</body>
</html>
